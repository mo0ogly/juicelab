<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JuiceLab dashboard - login</title>
  {% include "_head_assets.html" %}
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.35) 100%),
        repeating-linear-gradient(0deg, transparent 0 39px, var(--border) 39px 40px);
      opacity: 0.18;
    }
    .login-card {
      width: min(440px, 100%); position: relative; z-index: 1;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%),
        var(--bg-elev);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 36px 36px 28px;
      box-shadow: var(--shadow-pop);
    }
    .login-card::before {
      content: ""; display: block; height: 2px; margin-bottom: 24px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--rose) 60%, var(--amber) 100%);
    }
    .login-mark {
      font-family: var(--font-mono);
      font-size: 10.5px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--text-mute);
      margin: 0 0 14px;
    }
    .login-mark::before {
      content: "//"; color: var(--accent); margin-right: 8px;
    }
    .login-card h1 {
      margin: 0 0 10px;
      font-family: var(--font-display); font-style: italic;
      font-weight: 400; font-size: 34px;
      letter-spacing: -0.02em; color: var(--text); line-height: 1.05;
    }
    .login-card p.lead {
      margin: 0 0 24px; color: var(--text-soft);
      font-size: 14px; line-height: 1.6;
    }
    .login-card label {
      display: block;
      font-family: var(--font-mono); font-size: 10.5px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-mute); margin: 18px 0 6px;
    }
    .login-card input[type="password"] {
      width: 100%; box-sizing: border-box;
      padding: 12px 14px;
      font-family: var(--font-mono); font-size: 14px;
      letter-spacing: 0.04em;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg); color: var(--text);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .login-card input[type="password"]:focus-visible {
      outline: none; border-color: var(--accent);
      box-shadow: var(--shadow-focus);
    }
    .login-card button {
      width: 100%; margin-top: 24px;
      padding: 12px 16px;
      border-radius: var(--radius-sm); border: 1px solid var(--accent);
      font-family: var(--font-body); font-weight: 600;
      font-size: 13px; letter-spacing: 0.04em;
      text-transform: uppercase; cursor: pointer;
      background: var(--accent); color: var(--bg);
      transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }
    .login-card button:hover {
      background: var(--accent-deep); transform: translateY(-1px);
      box-shadow: 0 6px 16px var(--accent-glow);
    }
    .login-card button:focus-visible {
      outline: none; box-shadow: var(--shadow-focus);
    }
    .login-error {
      margin-top: 18px; padding: 10px 14px;
      background: var(--danger-soft); color: var(--danger);
      border: 1px solid var(--danger); border-radius: var(--radius-sm);
      font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em;
    }
    .login-meta {
      margin-top: 24px; padding-top: 16px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 10.5px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-mute);
    }
    .login-lang { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="/login">
    <div class="login-lang">{% include "_lang_switch.html" %}</div>
    <p class="login-mark">JuiceLab dashboard</p>
    <h1>{{ t('LOGIN_TITLE') }}</h1>
    <p class="lead">{{ t('LOGIN_LEAD') }}</p>
    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}
    <label for="token">{{ t('LOGIN_TOKEN_LABEL') }}</label>
    <input id="token" name="token" type="password" autocomplete="off" autofocus required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">{{ t('LOGIN_SUBMIT') }}</button>
    <div class="login-meta">{{ t('LOGIN_META') }}</div>
  </form>
</body>
</html>
