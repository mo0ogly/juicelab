<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>JuiceLab dashboard - login</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: min(400px, 92vw);
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.45);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p.lead { margin: 0 0 18px; opacity: 0.7; font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 13px; opacity: 0.78; margin: 14px 0 4px; }
    input[type="password"] {
      width: 100%; box-sizing: border-box;
      padding: 10px 12px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: #e2e8f0;
      font: inherit;
    }
    button {
      width: 100%; margin-top: 18px;
      padding: 11px 14px; border-radius: 8px; border: 0;
      font: inherit; font-weight: 600; cursor: pointer;
      background: #38bdf8; color: #0f172a;
    }
    .error {
      margin-top: 14px; padding: 8px 12px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 6px; color: #fca5a5;
      font-size: 13px;
    }
    .meta { margin-top: 20px; font-size: 12px; opacity: 0.55; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>JuiceLab — login prof</h1>
    <p class="lead">
      Entre le token enseignant (<code>DASHBOARD_TEACHER_TOKEN</code>) pour
      acceder au dashboard de cohorte.
    </p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <label for="token">Token</label>
    <input id="token" name="token" type="password" autocomplete="off" autofocus required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Se connecter</button>
    <div class="meta">
      Le token est stocke dans un cookie HttpOnly. Hit <code>/logout</code> pour le supprimer.
    </div>
  </form>
</body>
</html>
