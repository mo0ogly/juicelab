<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JuiceLab dashboard - login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}" integrity="{{ css_sri }}" crossorigin="anonymous">
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .login-card {
      width: min(420px, 100%);
      background: var(--bg-elev); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 28px; box-shadow: var(--shadow-pop);
    }
    .login-card h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
    .login-card p.lead { margin: 0 0 18px; color: var(--text-soft); font-size: 14px; line-height: 1.5; }
    .login-card label { display: block; font-size: 13px; color: var(--text-soft); margin: 14px 0 4px; }
    .login-card input[type="password"] {
      width: 100%; box-sizing: border-box;
      padding: 10px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font: inherit;
    }
    .login-card input[type="password"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    .login-card button {
      width: 100%; margin-top: 18px;
      padding: 11px 14px; border-radius: var(--radius-sm); border: 0;
      font: inherit; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    .login-card button:hover { background: var(--accent-deep); }
    .login-card button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .login-error {
      margin-top: 14px; padding: 8px 12px;
      background: var(--danger-soft); color: var(--danger);
      border: 1px solid var(--danger); border-radius: var(--radius-sm);
      font-size: 13px;
    }
    .login-meta { margin-top: 20px; font-size: 12px; color: var(--text-mute); }
    .login-lang { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="/login">
    <div class="login-lang">{% include "_lang_switch.html" %}</div>
    <h1>{{ t('LOGIN_TITLE') }}</h1>
    <p class="lead">{{ t('LOGIN_LEAD') }}</p>
    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}
    <label for="token">{{ t('LOGIN_TOKEN_LABEL') }}</label>
    <input id="token" name="token" type="password" autocomplete="off" autofocus required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">{{ t('LOGIN_SUBMIT') }}</button>
    <div class="login-meta">{{ t('LOGIN_META') }}</div>
  </form>
</body>
</html>
