name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 04:00 UTC, catches CVE-as-code drift between merges.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL semantic analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use security-extended queries: adds taint flow + CWE rules
          # beyond the default pack. Slower but catches more.
          queries: security-extended
          # Scope: only our productive code. juice-shop/ submodule is
          # deliberately vulnerable (the lab itself), so analyzing it
          # would flood the security tab with intentional findings.
          config: |
            paths:
              - dashboard
              - .github/workflows
            paths-ignore:
              - juice-shop
              - dashboard/tests
              - dashboard/data
              - dashboard/__pycache__
              - "**/node_modules"

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
