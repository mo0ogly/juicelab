version: 2
# Dependabot config -- auto-opens PRs when a dashboard dep has a CVE
# patch or a minor/patch bump available. Combined with the
# dashboard-security-recette CI gate (which runs pip-audit + safety
# against the lockfile), this gives a tight loop : dep CVE published
# -> Dependabot opens PR -> CI runs full SAST/SCA/SBOM -> human review.

updates:
  # --- Python lockfile (dashboard) -------------------------------------
  - package-ecosystem: pip
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
      - security
    commit-message:
      prefix: deps
      include: scope
    groups:
      # Group test-only deps so they share a single PR (less reviewer noise).
      test-deps:
        patterns:
          - "pytest*"
          - "coverage"
      # Group Flask + Jinja + Werkzeug (move together upstream).
      flask-stack:
        patterns:
          - "Flask*"
          - "Jinja2"
          - "Werkzeug"
          - "MarkupSafe"
          - "itsdangerous"
          - "click"
          - "blinker"
    ignore:
      # Major version bumps require human triage (potential breaking
      # changes), let Dependabot keep us on the current major.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions versions ----------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "04:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci

  # --- Docker base image (juicelab overlay) ---------------------------
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: docker
