challenge_key: xssBonusChallenge
journal_prompts:
  before_solve_fr: Avant le défi, explique ce que tu sais déjà sur contenu actif et services tiers.
    Quelle observation pourrait confirmer ou réfuter ton hypothèse ? N’écris pas de solution attendue.
  before_solve_en: Before the challenge, explain what you already know about active content and third-party
    services. Which observation could support or refute your hypothesis? Do not write an expected
    solution.
  after_solve_fr: 'À propos de contenu actif et services tiers : 1. Décris une observation et sa
    preuve, puis une limite. 2. Explique la cause du risque. 3. Justifie une protection côté approprié.
    4. Transpose-la à une application de réservation fictive et décris un contrôle défensif et le
    résultat attendu. Distingue ce contrôle proposé d’un contrôle exécuté. Vise au moins 50 mots
    utiles ; le compteur ne note pas la qualité.'
  after_solve_en: 'For active content and third-party services: 1. Describe one observation, its
    evidence and a limit. 2. Explain the cause of the risk. 3. Justify a protection in the appropriate
    layer. 4. Transfer it to a fictional booking app and describe a defensive check and expected
    result. Distinguish a proposed check from an executed one. Aim for at least 50 useful words;
    word count does not grade quality.'
