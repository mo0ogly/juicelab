challenge_key: forgedFeedbackChallenge
schema_version: juicelab.briefing.v2
mission_fr: Dans le laboratoire local autorisé, étudie le défi « Forged Feedback ». Expliquer pourquoi
  le serveur doit déterminer l’auteur d’un avis à partir de l’identité authentifiée. Limite tes observations
  à l’instance prévue pour le TD.
mission_en: In the authorised local lab, study the “Forged Feedback” challenge. Explain why the server
  must determine a feedback author from the authenticated identity. Keep observations within the
  instance provided for this course.
learning_objectives_fr:
- Expliquer pourquoi le serveur doit déterminer l’auteur d’un avis à partir de l’identité authentifiée.
- Séparer ce qui est observé, ce qui est déduit et ce qui reste à vérifier.
learning_objectives_en:
- Explain why the server must determine a feedback author from the authenticated identity.
- Separate observations, inferences and what remains to be verified.
prerequisites_fr:
- Savoir utiliser le navigateur et ses outils de développement.
- Connaître le périmètre autorisé du laboratoire et la différence client/serveur.
prerequisites_en:
- Know how to use the browser and its developer tools.
- Know the authorised lab scope and the client/server distinction.
deliverable_fr: 'Dans le journal après le défi : une observation précise et sa preuve, une explication
  du risque, une protection justifiée et une vérification défensive sur un autre cas. Le nombre de
  mots ne suffit pas à établir la qualité du raisonnement.'
deliverable_en: 'In the post-challenge journal: one precise observation and its evidence, an explanation
  of the risk, a justified protection and a defensive check for a different case. Word count alone
  does not establish reasoning quality.'
concepts:
- title_fr: Identité de l’auteur et confiance
  title_en: Author identity and trust
  body_fr: 'Le point étudié est : identité de l’auteur et confiance. Une carte résolue indique un
    état du laboratoire ; le journal doit préciser les observations qui soutiennent ton explication
    et leurs limites.'
  body_en: The focus is author identity and trust. A solved card indicates lab state; your journal
    must identify observations supporting your explanation and their limits.
