challenge_key: forgedFeedbackChallenge
schema_version: juicelab.quiz.v2
quiz:
  Q1:
    type: multiple_choice
    question_fr: 'Le hidden input userId etait pre-rempli par le frontend avec

      ton vrai id, et le backend l''utilisait tel quel. Pourquoi ce

      pattern est-il un anti-pattern ?

      '
    question_en: 'The hidden userId input was pre-filled by the frontend with

      your real id, and the backend used it as-is. Why is this

      pattern an anti-pattern?

      '
    options_fr:
    - Parce que les hidden inputs sont mal supportes par certains navigateurs
    - Parce que TOUT input client est manipulable, hidden ou non. Faire confiance a une valeur cliente
      pour determiner l'identite revient a laisser l'utilisateur choisir qui il est cote serveur
    - Parce que les hidden inputs ne sont pas envoyes en HTTPS
    - Parce que les hidden inputs sont detectes par les WAF comme malveillants
    options_en:
    - Because hidden inputs are poorly supported by some browsers
    - Because ANY client input is tamper-able, hidden or not. Trusting a client value to determine
      identity lets the user choose who they are server-side
    - Because hidden inputs aren't sent over HTTPS
    - Because hidden inputs are flagged as malicious by WAFs
    correct: 1
    explanation_fr: 'Reflexe fondamental : le serveur ne doit JAMAIS faire confiance

      au client pour des decisions d''identite ou d''autorisation.

      Hidden vs visible n''a aucune importance — tout transit en clair

      dans le body HTTP, manipulable par F12 ou Burp. La defense

      canonique : deduire l''identite du JWT verifie.

      '
    explanation_en: 'Fundamental reflex: the server must NEVER trust the client

      for identity or authorization decisions. Hidden vs visible

      doesn''t matter — everything transits in cleartext in the

      HTTP body, manipulable via F12 or Burp. Canonical defense:

      derive identity from the verified JWT.

      '
  Q2:
    type: multiple_choice
    question_fr: 'Quel est le pattern serveur-side correct pour ecrire le

      userId d''un feedback ?

      '
    question_en: 'What is the correct server-side pattern to write the userId

      of a feedback?

      '
    options_fr:
    - Spread req.body directement dans Feedback.create({ ...req.body }) — c'est concis
    - 'Override explicite : Feedback.create({ ...req.body, UserId: req.user.id }) — le serveur ignore
      tout userId venant du body et utilise celui du JWT verifie'
    - Chiffrer le userId cote client avec AES avant envoi
    - Utiliser un POST plutot qu'un PUT
    options_en:
    - Spread req.body directly into Feedback.create({ ...req.body }) — concise
    - 'Explicit override: Feedback.create({ ...req.body, UserId: req.user.id }) — server ignores
      any userId from body and uses the verified JWT one'
    - Encrypt userId client-side with AES before sending
    - Use POST rather than PUT
    correct: 1
    explanation_fr: 'Pattern canonique. Le spread est efficient pour copier les

      champs business (comment, rating) mais le userId DOIT etre

      ecrit par le serveur en derniere position pour ecraser tout

      userId malicieusement injecte. Frameworks d''auth modernes

      (Spring Security, NestJS) automatisent ce pattern via

      decorateurs (@AuthUser).

      '
    explanation_en: 'Canonical pattern. Spread is efficient to copy business

      fields (comment, rating) but userId MUST be written by the

      server last to overwrite any maliciously injected userId.

      Modern auth frameworks (Spring Security, NestJS) automate

      this via decorators (@AuthUser).

      '
  Q3:
    type: multiple_choice
    question_fr: Où et sur quoi faut-il vérifier les autorisations pour une action sur un objet ?
    question_en: Where and against what must permissions for an action on an object be checked?
    options_fr:
    - Uniquement dans les contrôles de navigation du navigateur.
    - Côté serveur à chaque requête, pour l’action et l’objet visés ; une configuration commune doit
      être complétée par les règles métier nécessaires.
    - Uniquement lors de la connexion, sans vérifier les objets concernés.
    - Uniquement selon l’adresse IP, quel que soit l’objet.
    options_en:
    - Only in browser navigation controls.
    - Server-side on every request, for the target action and object; common configuration must be
      supplemented by necessary business rules.
    - Only at login, without checking the objects involved.
    - Only by IP address, regardless of the object.
    correct: 1
    explanation_fr: 'OWASP demande de vérifier les permissions à chaque requête et pour la ressource
      visée. Un middleware commun peut centraliser des contrôles ; il ne dispense pas des règles
      métier ou des relations entre utilisateur et objet. Source : Authorization Cheat Sheet, sections
      Validate the Permissions on Every Request et Ensure Lookup IDs…'
    explanation_en: 'OWASP requires checking permissions on every request and for the target resource.
      Common middleware can centralise checks; it does not remove the need for business rules or
      user–object relationships. Source: Authorization Cheat Sheet, Validate the Permissions on Every
      Request and Ensure Lookup IDs…'
