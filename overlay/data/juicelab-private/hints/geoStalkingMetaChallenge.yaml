challenge_key: "geoStalkingMetaChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #3 : "answer the security question of
      the John, who enjoys hiking in the park". Donc John a une
      photo de hiking dans un parc. Ou trouver les photos
      uploadees par les users dans Juice Shop ? Indice : "Photo
      Wall".
    text_en: |
      Official OWASP hint #3: "answer the security question of
      the John, who enjoys hiking in the park". So John has a
      hiking photo in a park. Where to find user-uploaded
      photos in Juice Shop? Hint: "Photo Wall".
    pedagogical_intent: |
      Localize the photo surface.

  N2:
    cost_pct: 10
    text_fr: |
      /#/photo-wall affiche toutes les photos uploadees. Repere
      celle de John (caption avec "hiking" / "park"). Hint
      OWASP officiel #1 : "Take a look at the meta data of the
      corresponding photo". Quelle metadata d'une photo
      smartphone moderne contient des INFOS DE LIEU ?
    text_en: |
      /#/photo-wall shows all uploaded photos. Spot John's
      (caption with "hiking" / "park"). Official OWASP hint
      #1: "Take a look at the meta data of the corresponding
      photo". Which modern-smartphone-photo metadata holds
      LOCATION INFO?
    pedagogical_intent: |
      Pin the photo + signal EXIF.

  N3:
    cost_pct: 20
    text_fr: |
      EXIF metadata. Toute photo smartphone contient par
      defaut les coordonnees GPS exactes ou la photo a ete
      prise. Hint OWASP officiel #2 : "Make use of tools that
      can inspect the metadata of images". Outils : exiftool
      (CLI), exifviewer.org (online), ou simplement
      Properties Windows / Get Info macOS. Telecharge la photo
      de John (right-click + Save As) et inspecte.
    text_en: |
      EXIF metadata. Every smartphone photo holds by default
      exact GPS coords where it was taken. Official OWASP
      hint #2: "Make use of tools that can inspect the
      metadata of images". Tools: exiftool (CLI),
      exifviewer.org (online), or just Windows Properties /
      macOS Get Info. Download John's photo (right-click +
      Save As) and inspect.
    pedagogical_intent: |
      Spell EXIF tools.

  N4:
    cost_pct: 35
    text_fr: |
      Contrairement a geoStalkingVisual (indice dans l'image), ici
      l'indice est dans les METADONNEES EXIF de la photo de John sur le
      Photo Wall (caption "I love going hiking here..."). Les
      coordonnees GPS y sont enregistrees. Un reverse-geocoding donne le
      nom du lieu, qui est la reponse a la question secrete 14 de John
      (john@juice-sh.op).
    text_en: |
      Unlike geoStalkingVisual (clue in the image), here the clue is in
      the EXIF METADATA of John's photo on the Photo Wall (caption "I
      love going hiking here..."). GPS coordinates are stored there. A
      reverse-geocoding gives the place name, which is the answer to
      John's security question 14 (john@juice-sh.op).
    pedagogical_intent: |
      Correct the vector: EXIF GPS metadata, reverse-geocoded place name.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : telecharge la photo "hiking" de John, lis le GPS
        exiftool favorite-hiking-place.png | grep -i gps
      -> 36 deg 57' N, 84 deg 20' W. Reverse-geocode ces coordonnees. Le lieu configure est la
      foret nationale Daniel Boone (Kentucky, USA), donc la reponse est
      Daniel Boone National Forest (geoStalkingMetaSecurityAnswer dans
      config/default.yml). Sur /#/forgot-password : email
      john@juice-sh.op, question "What's your favorite place to go hiking?" (id 14),
      reponse Daniel Boone National Forest, puis nouveau mot de passe.
      Reponse confirmee en source ; reset non rejoue pour preserver le
      compte seede ; sur une autre config, lis le lieu reel dans l'EXIF.
      Defense : retirer les metadonnees EXIF (dont le GPS) des images
      publiees ; ne pas utiliser un lieu OSINTable comme secret.
    text_en: |
      Solution: download John's "hiking" photo, read the GPS
        exiftool favorite-hiking-place.png | grep -i gps
      -> 36 deg 57' N, 84 deg 20' W. Reverse-geocode these coordinates. The configured place is the
      Daniel Boone National Forest (Kentucky, USA), so the answer is
      Daniel Boone National Forest (geoStalkingMetaSecurityAnswer in
      config/default.yml). On /#/forgot-password: email
      john@juice-sh.op, question "What's your favorite place to go hiking?" (id 14),
      answer Daniel Boone National Forest, then a new password. Answer
      confirmed in source; reset not replayed to preserve the seeded
      account; on another config, read the real place from the EXIF.
      Defense: strip EXIF metadata (including GPS) from published images;
      do not use an OSINT-able place as a secret.
    pedagogical_intent: |
      Full solution: EXIF GPS method, exact answer, defense.
