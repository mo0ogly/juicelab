challenge_key: "privacyPolicyProofChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP : "find the privacy proof URL". Une URL existe pour
      "prouver" qu'on a lu la privacy policy. L'URL retourne une image.
    text_en: |
      OWASP hint: "find the privacy proof URL". A URL exists to "prove"
      one has read the privacy policy. URL returns an image.
    pedagogical_intent: |
      Activate URL hunting reflex.

  N2:
    cost_pct: 10
    text_fr: |
      L'URL sert un fichier image dans /assets/private/. Cherche dans le
      bundle Angular ou la page /#/privacy-security. Tools : DevTools
      Sources, grep frontend/dist/.
    text_en: |
      URL serves an image file in /assets/private/. Search Angular bundle
      or /#/privacy-security page. Tools: DevTools Sources, grep
      frontend/dist/.
    pedagogical_intent: |
      Spell location hint.

  N3:
    cost_pct: 20
    text_fr: |
      Voir routes/privacyPolicyProof.ts : `res.sendFile(path.resolve(
      'frontend/dist/frontend/assets/private/thank-you.jpg'))`. Donc
      l'URL retourne thank-you.jpg.
    text_en: |
      See routes/privacyPolicyProof.ts: `res.sendFile(path.resolve(
      'frontend/dist/frontend/assets/private/thank-you.jpg'))`. So URL
      returns thank-you.jpg.
    pedagogical_intent: |
      Reveal target file.

  N4:
    cost_pct: 35
    text_fr: |
      Naviguer
      http://localhost:3000/we/may/also/instruct/you/to/refuse/all/reasonably
      /necessary/responsibility (ou similaire suffix - inspect bundle).
      Dans server.ts: voir `app.use(... privacyPolicyProof)`. Le simple
      GET solve.
    text_en: |
      Navigate
      http://localhost:3000/we/may/also/instruct/you/to/refuse/all/reasonably
      /necessary/responsibility (or similar suffix - inspect bundle). In
      server.ts: see `app.use(... privacyPolicyProof)`. Simple GET solves.
    pedagogical_intent: |
      Spell URL example.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : comme pour
      Premium Paywall, c'est de la securite par l'obscurite. La preuve
      de lecture de la politique est servie a une URL longue et
      explicite, cachee du menu. L'ouvrir suffit a resoudre le challenge
      (routes/privacyPolicyProof.ts) :
        GET /we/may/also/instruct/you/to/refuse/all/reasonably/necessary/responsibility
      On la trouve en fouillant le code client ou les chemins devinables
      ; aucune crypto a casser.
      Defense : ne pas proteger une ressource par le seul secret de son
      URL ; appliquer un controle d'acces reel cote serveur.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): like
      Premium Paywall, this is security through obscurity. The
      policy-reading proof is served at a long, explicit URL hidden from
      the menu. Opening it is enough to solve the challenge
      (routes/privacyPolicyProof.ts):
        GET /we/may/also/instruct/you/to/refuse/all/reasonably/necessary/responsibility
      You find it by searching the client code or guessable paths; no
      crypto to break.
      Defense: do not protect a resource by the secrecy of its URL
      alone; enforce real server-side access control.
    pedagogical_intent: |
      Full verified solution: exact hidden URL, obscurity framing, defense.
