challenge_key: "privacyPolicyChallenge"
schema_version: "juicelab.hints.v1"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Toute application qui manipule des donnees personnelles est tenue
      d'afficher une politique de confidentialite quelque part. C'est une
      exigence du RGPD pour les applications europeennes et une bonne
      pratique generale. Ou se trouve generalement ce genre de document
      sur un site marchand ?
    text_en: |
      Any application that handles personal data is required to display a
      privacy policy somewhere. It is a GDPR requirement for European apps
      and good practice generally. Where do you usually find that kind of
      document on a commerce site?
    pedagogical_intent: |
      Activate the legal/UX reflex: a privacy policy is mandated and discoverable.

  N2:
    cost_pct: 10
    text_fr: |
      Sur la plupart des sites, la politique de confidentialite est dans la
      barre de navigation principale, le pied de page, ou un menu lateral.
      Sur Juice Shop, le menu Account et le menu lateral hamburger en haut a
      gauche regroupent les pages institutionnelles. Explore ces deux
      endroits.
    text_en: |
      On most sites, the privacy policy lives in the main nav, the footer,
      or a side menu. On Juice Shop, the Account menu and the left-hand
      hamburger sidebar group the institutional pages. Explore those two.
    pedagogical_intent: |
      Localize the UI surfaces likely to host policy links.

  N3:
    cost_pct: 20
    text_fr: |
      Le menu hamburger en haut a gauche ouvre un panneau lateral ;
      l'entree Privacy & Security regroupe la politique de
      confidentialite. La validation n'est pas un appel API : la page
      affiche, tout en bas, une petite image technique, et c'est la
      requete du navigateur vers cette image que le serveur
      reconnait.
    text_en: |
      The hamburger menu at the top left opens a side panel; the
      Privacy & Security entry groups the privacy policy. Validation
      is not an API call: the page displays a small technical image
      at the very bottom, and the server recognizes the browser's
      request for that image.
    pedagogical_intent: |
      Localize the page and reveal the real validation mechanism.

  N4:
    cost_pct: 35
    text_fr: |
      Le chemin est /#/privacy-security/privacy-policy (route enfant
      de privacy-security dans app.routing.ts). En bas du template,
      <img src="assets/public/images/padding/81px.png"/>
      (privacy-policy.component.html:172). Le middleware
      routes/verify.ts:71 resout le challenge sur toute URL qui se
      termine par /81px.png. Ouvrir la page suffit, puisque le
      navigateur charge l'image.
    text_en: |
      The path is /#/privacy-security/privacy-policy (child route of
      privacy-security in app.routing.ts). At the bottom of the
      template, <img src="assets/public/images/padding/81px.png"/>
      (privacy-policy.component.html:172). The middleware
      routes/verify.ts:71 solves the challenge on any URL ending with
      /81px.png. Opening the page is enough, since the browser loads
      the image.
    pedagogical_intent: |
      Guided steps: exact route and exact server condition.

  N5:
    cost_pct: 50
    text_fr: |
      Ouvre http://127.0.0.1:3000/#/privacy-security/privacy-policy
      (ou menu hamburger > Privacy & Security > Privacy Policy) et
      laisse la page se charger jusqu'en bas. La requete vers
      81px.png resout le challenge. Il n'y a rien a pirater ici
      (hint OWASP : "There is no real hacking involved here") :
      l'interet pedagogique est de remarquer qu'un serveur peut
      tracer la lecture d'une page par une simple image, technique
      appelee pixel de suivi.
      Defense / bonne pratique : declarer et minimiser ce type de
      suivi dans la politique de confidentialite elle-meme.
    text_en: |
      Open http://127.0.0.1:3000/#/privacy-security/privacy-policy
      (or hamburger menu > Privacy & Security > Privacy Policy) and
      let the page load to the bottom. The request for 81px.png
      solves the challenge. There is nothing to hack here (OWASP
      hint: "There is no real hacking involved here"): the
      pedagogical point is to notice that a server can track the
      reading of a page through a simple image, a technique called a
      tracking pixel.
      Defense / good practice: disclose and minimize this kind of
      tracking in the privacy policy itself.
    pedagogical_intent: |
      Full solution plus the transferable lesson (tracking pixel).
