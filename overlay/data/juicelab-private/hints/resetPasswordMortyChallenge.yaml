challenge_key: "resetPasswordMortyChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Ce challenge a deux volets : trouver la reponse obfusquee de
      Morty, ET vaincre la limitation de debit du formulaire. Hint
      OWASP #4 : "Forgot your password?" est protege par un rate
      limiter qu'il faut contourner. Commence par identifier Morty.
    text_en: |
      This challenge has two sides: find Morty's obfuscated answer AND
      beat the form's rate limiting. OWASP hint #4: "Forgot your
      password?" is protected by a rate limiter you must bypass. Start
      by identifying Morty.
    pedagogical_intent: |
      Announce the two sub-problems: obfuscated answer + rate limit.

  N2:
    cost_pct: 10
    text_fr: |
      Sur /#/forgot-password, saisis morty@juice-sh.op : la question
      est "Name of your favorite pet?". Morty vient de Rick & Morty ;
      son animal (un chien, S01E02) a un nom connu. Hints OWASP #2 et
      #3 : la reponse est vraie mais obfusquee, fait moins de 10
      caracteres et n'a pas de caractere special.
    text_en: |
      On /#/forgot-password, enter morty@juice-sh.op: the question is
      "Name of your favorite pet?". Morty is from Rick & Morty; his
      pet (a dog, S01E02) has a known name. OWASP hints #2 and #3: the
      answer is truthful but obfuscated, under 10 characters and with
      no special character.
    pedagogical_intent: |
      Give the exact question and the obfuscation constraints.

  N3:
    cost_pct: 20
    text_fr: |
      Le volet securite : /rest/user/reset-password est limite a 100
      requetes par 5 minutes, mais la cle de comptage est l'en-tete
      X-Forwarded-For (server.ts:344-347). Comme cet en-tete est fourni
      par le client, le faire varier a chaque requete fait compter
      chaque essai comme une IP differente et neutralise la limite.
    text_en: |
      The security side: /rest/user/reset-password is limited to 100
      requests per 5 minutes, but the counting key is the
      X-Forwarded-For header (server.ts:344-347). Since that header is
      client-supplied, varying it on each request makes every attempt
      count as a different IP and defeats the limit.
    pedagogical_intent: |
      Reveal the exact rate-limit flaw (client-controlled key).

  N4:
    cost_pct: 35
    text_fr: |
      Le pet de Morty est Snowball ; obfusque en leet, cela donne
      5N0wb41L (chiffres a la place de lettres, 8 caracteres, aucun
      caractere special : conforme aux contraintes). La validation
      (routes/resetPassword.ts:61) exige user Morty ET answer
      exactement "5N0wb41L".
    text_en: |
      Morty's pet is Snowball; obfuscated in leet, that gives
      5N0wb41L (digits for letters, 8 characters, no special
      character: matches the constraints). Validation
      (routes/resetPassword.ts:61) requires user Morty AND answer
      exactly "5N0wb41L".
    pedagogical_intent: |
      Give the exact obfuscated answer and the validation condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : si tu connais la reponse, un seul envoi suffit :
      /#/forgot-password, email morty@juice-sh.op, reponse 5N0wb41L,
      nouveau mot de passe. Si tu la brute-forces (liste de pet names
      en leet), fais varier l'en-tete X-Forwarded-For a chaque requete
      pour ne pas etre bloque a 100 essais par fenetre de 5 minutes.
      Reponse confirmee dans le code (resetPassword.ts:61), faille de
      debit confirmee (server.ts:344-347) ; non rejouee pour preserver
      le compte seede.
      Defense : limiter le debit sur une cle non falsifiable (IP de la
      connexion reelle, ou identifiant de compte cote serveur), ne pas
      faire confiance a X-Forwarded-For sans proxy de confiance.
    text_en: |
      Solution: if you know the answer, a single submission is enough:
      /#/forgot-password, email morty@juice-sh.op, answer 5N0wb41L,
      new password. If you brute-force it (leet pet-name list), vary
      the X-Forwarded-For header on each request so you are not blocked
      at 100 attempts per 5-minute window. Answer confirmed in the code
      (resetPassword.ts:61), rate-limit flaw confirmed
      (server.ts:344-347); not replayed to preserve the seeded account.
      Defense: rate-limit on a non-forgeable key (the real connection
      IP, or a server-side account id); do not trust X-Forwarded-For
      without a trusted proxy.
    pedagogical_intent: |
      Full solution: both sub-problems, source confirmation, defense.
