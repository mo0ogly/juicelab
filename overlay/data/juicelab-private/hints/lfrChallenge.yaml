challenge_key: "lfrChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #2 : "read up on Local File
      Read (LFR) vulnerabilities in popular NodeJS
      template engines". Donc (a) NodeJS, (b)
      template engine (pug, ejs, handlebars, mustache),
      (c) LFR class. Hint #3 : "easily forgettable
      endpoint" = un endpoint pas obvious dans la nav
      principale.
    text_en: |
      Official OWASP hint #2: "read up on Local File
      Read (LFR) vulnerabilities in popular NodeJS
      template engines". So (a) NodeJS, (b) template
      engine (pug, ejs, handlebars, mustache), (c)
      LFR class. Hint #3: "easily forgettable
      endpoint" = endpoint not obvious in main nav.
    pedagogical_intent: |
      Activate template engine LFR reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Endpoint cible : /dataerasure (POST). C'est
      l'endpoint GDPR Right to Erasure, visible si
      tu as resolu ghostLoginChallenge (Lot 5) ou
      via SQLi exfil. C'est un endpoint pas dans la
      navigation principale (forgettable). Sur cet
      endpoint, le body parameter `layout` est passe
      a res.render() comme template name.
    text_en: |
      Target endpoint: /dataerasure (POST). It's the
      GDPR Right to Erasure endpoint, visible if
      you solved ghostLoginChallenge (Lot 5) or via
      SQLi exfiltration. Endpoint not in main
      navigation (forgettable). On this endpoint,
      `layout` body parameter is passed to res.
      render() as template name.
    pedagogical_intent: |
      Spell endpoint + parameter.

  N3:
    cost_pct: 20
    text_fr: |
      Hint OWASP #4 : "500 Internal Server Error is
      always an interesting status code". Pour
      tester : POST /dataerasure avec body `{layout:
      "package.json", email: "...", securityAnswer:
      "..."}`. Si tu obtiens 500 (parsing error de
      pug) ou 200 avec html partiel, tu confirmes
      le LFR. Hint #5 : "Fuzzing can also help" -
      essaie plusieurs target paths.
    text_en: |
      OWASP hint #4: "500 Internal Server Error is
      always an interesting status code". To test:
      POST /dataerasure with body `{layout:
      "package.json", email: "...",
      securityAnswer: "..."}`. If you get 500 (pug
      parsing error) or 200 with partial html, you
      confirm LFR. Hint #5: "Fuzzing can also help"
      - try multiple target paths.
    pedagogical_intent: |
      Spell test methodology + status codes.

  N4:
    cost_pct: 35
    text_fr: |
      Le moteur de vues est Handlebars (hbs) et le parametre layout de
      /dataerasure est resolu en chemin de fichier
      (routes/dataErasure.ts) : il sert de gabarit et son contenu est
      renvoye (tronque). Seule une blocklist de sous-chaines bloque ftp,
      ctf.key et encryptionkeys. Le chemin est relatif au dossier des
      vues, il faut donc remonter avec ../ pour lire un fichier du
      projet. L'authentification se fait par le COOKIE de session.
    text_en: |
      The view engine is Handlebars (hbs) and the /dataerasure layout
      parameter is resolved to a file path (routes/dataErasure.ts): it
      is used as a template and its content is returned (truncated).
      Only a substring blocklist blocks ftp, ctf.key and encryptionkeys.
      The path is relative to the views folder, so you must go up with
      ../ to read a project file. Authentication uses the session
      COOKIE.
    pedagogical_intent: |
      Give the real mechanism: hbs layout path, ../ traversal, cookie auth.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : connecte
      (le token doit etre envoye en cookie), POST sur /dataerasure avec
      un layout qui remonte vers un fichier du projet :
        curl -s -X POST http://127.0.0.1:3000/dataerasure \\
          -b "token=<ton_jwt>" \\
          -H "Content-Type: application/json" \\
          -d '{"email":"<ton_email>","securityAnswer":"x","layout":"../package.json"}'
      La reponse contient le debut de package.json (tronque a 100
      caracteres + "......") : c'est la lecture de fichier arbitraire,
      le challenge est resolu (dataErasure.ts). ftp/ctf.key/
      encryptionkeys sont bloques par la blocklist ; un chemin sans ../
      echoue (cherche dans le dossier des vues -> 500).
      Defense : ne jamais construire un chemin de gabarit a partir
      d'une entree utilisateur ; canoniser et restreindre a un
      repertoire de vues fixe.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): logged
      in (the token must be sent as a cookie), POST to /dataerasure with
      a layout going up to a project file:
        curl -s -X POST http://127.0.0.1:3000/dataerasure \\
          -b "token=<your_jwt>" \\
          -H "Content-Type: application/json" \\
          -d '{"email":"<your_email>","securityAnswer":"x","layout":"../package.json"}'
      The response contains the start of package.json (truncated to 100
      characters + "......"): that is the arbitrary file read, the
      challenge solves (dataErasure.ts). ftp/ctf.key/encryptionkeys are
      blocked by the blocklist; a path without ../ fails (looked up in
      the views folder -> 500).
      Defense: never build a template path from user input; canonicalize
      and restrict to a fixed views directory.
    pedagogical_intent: |
      Full verified solution: exact payload (../package.json), cookie
      auth, defense.
