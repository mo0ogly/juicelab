challenge_key: "ghostLoginChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "Turns out that something is
      technically and legally wrong with the implementation
      of the right to be forgotten for users". Donc le bug
      est dans l'implementation de l'erasure (RTBF). Hint
      #4 : "What the Juice Shop does here is totally
      incompliant with GDPR" - c'est un soft delete vs hard
      delete issue.
    text_en: |
      Official OWASP hint #1: "Turns out that something is
      technically and legally wrong with the implementation
      of the right to be forgotten for users". So bug is
      in erasure (RTBF) implementation. Hint #4: "What the
      Juice Shop does here is totally incompliant with
      GDPR" - it's soft delete vs hard delete issue.
    pedagogical_intent: |
      Activate GDPR compliance reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #2 : "Trying out the Request Data Erasure
      functionality might be interesting, but cannot help
      you solve this challenge in real time". Donc utiliser
      la fonctionnalite RTBF NE resout PAS le challenge.
      Hint #3 : "If you have solved the challenge Retrieve
      a list of all user credentials via SQL Injection you
      might have already retrieved some information about
      how the Juice Shop deletes users". Pre-requis :
      resoudre exposedCredentialsChallenge ou
      unionSqlInjectionChallenge.
    text_en: |
      OWASP hint #2: "Trying out the Request Data Erasure
      functionality might be interesting, but cannot help
      you solve this challenge in real time". So using
      RTBF functionality DOES NOT solve challenge. Hint
      #3: "If you have solved the challenge Retrieve a list
      of all user credentials via SQL Injection you might
      have already retrieved some information about how
      the Juice Shop deletes users". Prerequisite: solve
      exposedCredentialsChallenge or
      unionSqlInjectionChallenge.
    pedagogical_intent: |
      Spell prerequisites + reveal soft-delete hint.

  N3:
    cost_pct: 20
    text_fr: |
      Apres SQLi exfil de la table Users, tu verras Chris
      dans la liste avec un champ `deletedAt` ou `is_deleted`
      non-null (ex. "2026-04-02T12:34:56Z"). C'est un soft
      delete : la row reste, juste un timestamp ajoute. La
      cible : Chris est deletedAt mais ses credentials
      (email + password hash) restent en DB. Le login
      endpoint Juice Shop NE FILTRE PAS sur deletedAt
      (Sequelize paranoid: false ou raw query).
    text_en: |
      After SQLi exfiltration of Users table, you'll see
      Chris in list with non-null `deletedAt` or
      `is_deleted` field (e.g., "2026-04-02T12:34:56Z").
      Soft delete: row stays, only timestamp added. Target:
      Chris is deletedAt but his credentials (email +
      password hash) remain in DB. Juice Shop login
      endpoint DOES NOT FILTER on deletedAt (Sequelize
      paranoid: false or raw query).
    pedagogical_intent: |
      Reveal soft-delete + login bypass mechanic.

  N4:
    cost_pct: 35
    text_fr: |
      Chris est un compte SUPPRIME (son deletedAt est renseigne). La
      requete de login ajoute "AND deletedAt IS NULL", donc un login
      normal echoue meme avec le bon mot de passe : c'est un
      "fantome". Mais c'est exactement la meme injection que pour les
      autres logins : en commentant la fin de la requete, tu neutralises
      aussi le filtre deletedAt. Il te faut l'email de Chris.
    text_en: |
      Chris is a DELETED account (its deletedAt is set). The login
      query appends "AND deletedAt IS NULL", so a normal login fails
      even with the right password: a "ghost". But it is the very same
      injection as the other logins: by commenting out the end of the
      query, you also neutralize the deletedAt filter. You need Chris's
      email.
    pedagogical_intent: |
      Correct the method: SQLi comment also bypasses the deletedAt filter.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : l'email de
      Chris est chris.pike@juice-sh.op (visible via une SQLi UNION sur
      les Users, challenge Database Schema / User Credentials). Dans le
      champ email du login, saisis :
        chris.pike@juice-sh.op'--
      mot de passe quelconque, puis Login. La requete devient
      "... email='chris.pike@juice-sh.op'-- AND password=... AND
      deletedAt IS NULL" : tout est commente apres l'email, le filtre
      deletedAt disparait et tu es connecte en tant que le compte
      supprime. Le challenge est resolu (login.ts:73, id de Chris).
      Defense : requetes parametrees (plus d'injection), et filtrer les
      comptes supprimes dans une clause que l'entree ne peut pas
      contourner (idealement au niveau applicatif, pas par concatenation).
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): Chris's
      email is chris.pike@juice-sh.op (visible via a UNION SQLi on the
      Users, Database Schema / User Credentials challenge). In the login
      email field, enter:
        chris.pike@juice-sh.op'--
      any password, then Login. The query becomes
      "... email='chris.pike@juice-sh.op'-- AND password=... AND
      deletedAt IS NULL": everything after the email is commented out,
      the deletedAt filter disappears and you are logged in as the
      deleted account. The challenge is solved (login.ts:73, Chris's id).
      Defense: parameterized queries (no more injection), and filter
      deleted accounts with a clause the input cannot bypass (ideally
      at the application level, not by concatenation).
    pedagogical_intent: |
      Full solution: verified SQLi payload, ghost mechanism, defense.
