challenge_key: "nftUnlockChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel unique : "Find the seed phrase
      posted accidentally". Donc une seed phrase BIP39 a ete
      postee quelque part par accident. La seed est une suite
      de 12 ou 24 mots qui controle un wallet entier. Ou
      pourrait-elle avoir ete postee ?
    text_en: |
      Single official OWASP hint: "Find the seed phrase
      posted accidentally". So a BIP39 seed phrase was
      posted accidentally somewhere. Seed is a 12 or 24
      word sequence controlling an entire wallet. Where
      could it have been posted?
    pedagogical_intent: |
      Activate seed-OSINT reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Surfaces probables : (1) un commit Git du repo Juice
      Shop public (devs qui paste accidentellement). (2) Un
      Issue/Discussion GitHub. (3) Un tweet ou screenshot
      Discord. (4) Un fichier de config oublie dans /ftp/ ou
      assets. La methode pentest : recherche le pattern de 12
      mots BIP39 sur le repo Juice Shop public et les
      channels social media du projet.
    text_en: |
      Likely surfaces: (1) a Git commit in the public Juice
      Shop repo (devs accidentally pasting). (2) A GitHub
      Issue/Discussion. (3) A tweet or Discord screenshot.
      (4) A forgotten config file in /ftp/ or assets.
      Pentest method: search the 12-word BIP39 pattern in the
      public Juice Shop repo and project social media
      channels.
    pedagogical_intent: |
      Spell OSINT surfaces.

  N3:
    cost_pct: 20
    text_fr: |
      Pattern BIP39 detection : 12 mots tires de la wordlist
      BIP39 standard (2048 mots anglais classiques :
      "abandon ability able about above absent..."). Tools de
      detection : trufflehog avec --include-detectors=bip39,
      ou simple regex matchant 12+ mots de la wordlist
      separes par espaces. Cherche dans le repo Juice Shop
      public ou dans les /ftp/ leaks.
    text_en: |
      BIP39 detection pattern: 12 words drawn from the
      standard BIP39 wordlist (2048 classic English words:
      "abandon ability able about above absent..."). Detection
      tools: trufflehog with --include-detectors=bip39, or
      simple regex matching 12+ wordlist words separated by
      spaces. Search the public Juice Shop repo or /ftp/
      leaks.
    pedagogical_intent: |
      Spell BIP39 detection patterns.

  N4:
    cost_pct: 35
    text_fr: |
      Le hint OWASP est direct : "find the seed phrase posted
      accidentally". La phrase de recuperation (12 mots BIP39) a ete
      laissee dans un AVIS client visible sur le site (un utilisateur
      demande son NFT en donnant l'adresse de son wallet ET sa seed).
      Cherche dans les feedbacks (carrousel About Us) le commentaire qui
      mentionne un wallet et une suite de 12 mots. Avec une seed BIP39,
      on derive la cle privee du wallet.
    text_en: |
      The OWASP hint is blunt: "find the seed phrase posted
      accidentally". The 12-word BIP39 recovery phrase was left in a
      customer REVIEW visible on the site (a user asks for their NFT
      giving their wallet address AND their seed). Look in the feedback
      (About Us carousel) for the comment mentioning a wallet and a
      12-word list. From a BIP39 seed you derive the wallet's private
      key.
    pedagogical_intent: |
      Point at the leaked seed (a feedback comment) and the derivation.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : a partir
      de la seed de 12 mots trouvee dans l'avis, derive la cle privee
      (chemin Ethereum par defaut) puis soumets-la :
        node -e "const {HDNodeWallet}=require('ethers');console.log(HDNodeWallet.fromPhrase('<les 12 mots>').privateKey)"
        POST /rest/web3/submitKey  body {"privateKey":"0x..."}
      Le serveur (routes/checkKeys.ts) compare ta cle a celle derivee
      de la seed ; si elle correspond, le challenge est resolu. Si tu
      envoies l'adresse publique ou la cle publique, le serveur te le
      signale (messages distincts). Un portefeuille type MetaMask
      permet aussi d'importer la seed et de lire la cle privee.
      Defense : ne jamais publier une seed/clef privee ; une seed
      divulguee = controle total du wallet, irreversible.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): from the
      12-word seed found in the review, derive the private key (default
      Ethereum path) and submit it:
        node -e "const {HDNodeWallet}=require('ethers');console.log(HDNodeWallet.fromPhrase('<the 12 words>').privateKey)"
        POST /rest/web3/submitKey  body {"privateKey":"0x..."}
      The server (routes/checkKeys.ts) compares your key to the one
      derived from the seed; on a match the challenge is solved. If you
      send the public address or public key, the server tells you so
      (distinct messages). A wallet like MetaMask can also import the
      seed and reveal the private key.
      Defense: never publish a seed/private key; a leaked seed means
      total, irreversible control of the wallet.
    pedagogical_intent: |
      Full solution: verified derivation + submitKey, defense.
