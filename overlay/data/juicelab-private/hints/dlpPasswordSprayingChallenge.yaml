challenge_key: "dlpPasswordSprayingChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP #1 : "find some leaked access
      logs which happen to have a fairly common
      format". Donc cherche des access logs en
      OSINT externe. Hint #4 : "Password
      Spraying" (1 password testee sur many
      accounts).
    text_en: |
      OWASP hint #1: "find some leaked access
      logs which happen to have a fairly common
      format". So search access logs in
      external OSINT. Hint #4: "Password
      Spraying" (1 password tested on many
      accounts).
    pedagogical_intent: |
      Activate external OSINT reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hints OWASP #2 + #3 : "popular help
      platform for developers" (Stack
      Overflow) + "platform to share data
      quickly" (Pastebin). Recherche Google :
      "juice shop access log site:pastebin.
      com" ou "juice shop logs
      stackoverflow".
    text_en: |
      OWASP hints #2 + #3: "popular help
      platform for developers" (Stack
      Overflow) + "platform to share data
      quickly" (Pastebin). Google search:
      "juice shop access log site:pastebin.
      com" or "juice shop logs stackoverflow".
    pedagogical_intent: |
      Spell OSINT search method.

  N3:
    cost_pct: 20
    text_fr: |
      Le leaked log contient des entries type
      `GET /rest/user/login?email=J12934@juice-
      sh.op&password=<password>`. Le password
      est en URL clair (anti-pattern). Note
      l'email J12934 (ressemble a un employee
      ID) et le password.
    text_en: |
      Leaked log contains entries like `GET
      /rest/user/login?email=J12934@juice-
      sh.op&password=<password>`. Password
      in cleartext URL (anti-pattern). Note
      email J12934 (looks like employee ID)
      and password.
    pedagogical_intent: |
      Reveal log format.

  N4:
    cost_pct: 35
    text_fr: |
      Source verifiee (routes/login.ts:64) :
      `solveIf(() => req.body.email ===
      'J12934@juice-sh.op' && req.body.password
      === '0Y8rMnww$*9VFYE§59-!Fg1L6t&6lB')`.
      Donc l'email cible = J12934@juice-sh.op,
      password = `0Y8rMnww$*9VFYE§59-!Fg1L6t&
      6lB`. Login normal via /#/login.
    text_en: |
      Verified source (routes/login.ts:64):
      `solveIf(() => req.body.email ===
      'J12934@juice-sh.op' && req.body.
      password === '0Y8rMnww$*9VFYE§59-!Fg1L6t
      &6lB')`. So target email = J12934@juice-
      sh.op, password = `0Y8rMnww$*9VFYE§59-
      !Fg1L6t&6lB`. Normal login via /#/login.
    pedagogical_intent: |
      Reveal exact credentials.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : les
      identifiants fuitent dans le journal d'acces du serveur (cf.
      challenge Access Log, GET /support/logs/access.log), ou d'anciens
      logins apparaissent en clair dans l'URL. On y lit le compte
      J12934@juice-sh.op et son mot de passe
      0Y8rMnww$*9VFYE§59-!Fg1L6t&6lB. Sur /#/login, saisis ces deux
      valeurs -> Login. Reponse 200, challenge resolu (login.ts:64).
      Identifiants exacts verifies en recette. (Le nom "password
      spraying" est trompeur : ici c'est une FUITE de journal, pas une
      pulverisation de mots de passe.)
      Defense : ne jamais journaliser d'identifiants ; proteger l'acces
      aux logs ; faire tourner les secrets exposes.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): the
      credentials leak in the server access log (see the Access Log
      challenge, GET /support/logs/access.log), where old logins appear
      in cleartext in the URL. There you read the account
      J12934@juice-sh.op and its password
      0Y8rMnww$*9VFYE§59-!Fg1L6t&6lB. On /#/login, enter both values ->
      Login. Response 200, challenge solved (login.ts:64). Exact
      credentials verified during testing. (The name "password spraying"
      is misleading: this is a log LEAK, not a spraying attack.)
      Defense: never log credentials; protect access to logs; rotate
      exposed secrets.
    pedagogical_intent: |
      Full solution: real log-leak source, exact verified credentials.
