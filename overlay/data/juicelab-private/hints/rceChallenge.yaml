challenge_key: "rceChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP : "make notevil throw infinite loop". L'endpoint b2b
      orders execute du code JS user-provided dans un sandbox.
    text_en: |
      OWASP hint: "make notevil throw infinite loop". B2B orders endpoint
      executes user-provided JS code in a sandbox.
    pedagogical_intent: |
      Activate eval + sandbox reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Endpoint : POST /api/b2b/v2/orders avec body.orderLinesData. Le
      sandbox notevil bloque les boucles infinies (rejet "Infinite loop
      detected"). Pour solve, faut declencher cette erreur.
    text_en: |
      Endpoint: POST /api/b2b/v2/orders with body.orderLinesData. notevil
      sandbox blocks infinite loops (reject "Infinite loop detected"). To
      solve, must trigger this error.
    pedagogical_intent: |
      Spell endpoint + condition.

  N3:
    cost_pct: 20
    text_fr: |
      Login (n'importe quel user). Send POST /api/b2b/v2/orders avec
      body : `{"orderLinesData": "while(true){}"}`. Le notevil detecte la
      boucle apres N iterations (max iterations limit) et throw "Infinite
      loop detected - reached max iterations".
    text_en: |
      Login (any user). Send POST /api/b2b/v2/orders with body:
      `{"orderLinesData": "while(true){}"}`. notevil detects loop after N
      iterations (max iterations limit) and throws "Infinite loop detected
      - reached max iterations".
    pedagogical_intent: |
      Reveal exact payload.

  N4:
    cost_pct: 35
    text_fr: |
      L'API B2B evalue le champ orderLinesData dans un bac a sable
      (vm + safeEval, routes/b2bOrder.ts) avec un timeout de 2000 ms.
      Deux issues : une boucle infinie detectee leve "Infinite loop
      detected - reached max iterations" (c'est rceChallenge), tandis
      qu'un calcul lent qui depasse 2000 ms leve un timeout (c'est
      rceOccupyChallenge). Pour rceChallenge, il faut donc une boucle
      infinie franche, pas un calcul lourd.
    text_en: |
      The B2B API evaluates the orderLinesData field in a sandbox
      (vm + safeEval, routes/b2bOrder.ts) with a 2000 ms timeout. Two
      outcomes: a detected infinite loop raises "Infinite loop detected
      - reached max iterations" (that is rceChallenge), while a slow
      computation exceeding 2000 ms raises a timeout (that is
      rceOccupyChallenge). For rceChallenge you need a clear infinite
      loop, not a heavy computation.
    pedagogical_intent: |
      Distinguish rce (infinite-loop detected) from rceOccupy (timeout).

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : connecte,
      envoie une boucle infinie a l'API B2B :
        curl -s -X POST http://127.0.0.1:3000/b2b/v2/orders \\
          -H "Authorization: Bearer <ton_jwt>" \\
          -H "Content-Type: application/json" \\
          -d '{"orderLinesData":"while(true){}"}'
      Le bac a sable detecte la boucle et leve "Infinite loop detected
      - reached max iterations" ; le challenge est resolu
      (b2bOrder.ts:31). Endpoint exact : /b2b/v2/orders (pas
      /api/b2b/v2/orders).
      Defense : ne jamais evaluer une entree utilisateur ; si une
      expression est indispensable, utiliser un interpreteur restreint
      sans acces au runtime et avec des limites strictes.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): logged
      in, send an infinite loop to the B2B API:
        curl -s -X POST http://127.0.0.1:3000/b2b/v2/orders \\
          -H "Authorization: Bearer <your_jwt>" \\
          -H "Content-Type: application/json" \\
          -d '{"orderLinesData":"while(true){}"}'
      The sandbox detects the loop and raises "Infinite loop detected -
      reached max iterations"; the challenge solves (b2bOrder.ts:31).
      Exact endpoint: /b2b/v2/orders (not /api/b2b/v2/orders).
      Defense: never evaluate user input; if an expression is
      unavoidable, use a restricted interpreter with no runtime access
      and strict limits.
    pedagogical_intent: |
      Full verified solution: exact endpoint, infinite-loop payload,
      defense.
