challenge_key: "zeroStarsChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel unique : "Before you invest
      time bypassing the API, you might want to play
      around with the UI a bit". Donc tente le UI
      cleverness en premier. Surface : feedback form
      sur /#/contact.
    text_en: |
      Official OWASP single hint: "Before you invest
      time bypassing the API, you might want to play
      around with the UI a bit". So try UI
      cleverness first. Surface: feedback form on
      /#/contact.
    pedagogical_intent: |
      Activate UI exploration reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Sur la page Customer Feedback, la note se regle avec un curseur
      (slider) borne de 1 a 5 : impossible d'y choisir 0. Mais
      observe l'etat initial du formulaire : remplis commentaire et
      captcha SANS toucher au curseur. Le bouton Submit reste grise.
      Pourquoi ? Que vaut la note tant que tu n'as pas bouge le
      curseur ?
    text_en: |
      On the Customer Feedback page, the rating is set with a slider
      bounded from 1 to 5: you cannot pick 0 there. But observe the
      initial state of the form: fill in comment and captcha WITHOUT
      touching the slider. The Submit button stays greyed out. Why?
      What is the rating worth as long as you have not moved the
      slider?
    pedagogical_intent: |
      Localize the surface: the client-side guard (disabled button),
      not the slider bounds.

  N3:
    cost_pct: 20
    text_fr: |
      Dans contact.component.ts, la note vaut 0 au chargement
      (public rating = 0). Le bouton est desactive par la condition
      [disabled]="... || !rating" : c'est la SEULE barriere, et elle
      vit dans ton navigateur. Le handler save() envoie ensuite
      this.rating tel quel. Deux voies : neutraliser la barriere dans
      le DOM (Inspecter l'element), ou rejouer la requete hors UI.
    text_en: |
      In contact.component.ts, the rating is 0 on load
      (public rating = 0). The button is disabled by the condition
      [disabled]="... || !rating": that is the ONLY barrier, and it
      lives in your browser. The save() handler then sends
      this.rating as-is. Two ways: neutralize the barrier in the DOM
      (Inspect element), or replay the request outside the UI.
    pedagogical_intent: |
      Narrow down by code reading: client-only validation, two
      bypass paths.

  N4:
    cost_pct: 35
    text_fr: |
      Voie UI : remplis commentaire + captcha, ne touche pas au
      curseur, clic droit sur Submit > Inspecter, supprime l'attribut
      disabled du <button id="submitButton">, puis clique. save()
      envoie rating = 0.
      Voie API : le formulaire fait POST /api/Feedbacks avec
        { captchaId, captcha, comment, rating }
      Le captcha s'obtient par GET /rest/captcha, dont la reponse
      contient deja la solution (champ answer). Cote serveur
      (models/feedback.ts), le setter de rating n'a aucune borne et
      resout le challenge si Number(rating) === 0.
    text_en: |
      UI path: fill in comment + captcha, do not touch the slider,
      right-click Submit > Inspect, remove the disabled attribute
      from <button id="submitButton">, then click. save() sends
      rating = 0.
      API path: the form sends POST /api/Feedbacks with
        { captchaId, captcha, comment, rating }
      The captcha comes from GET /rest/captcha, whose response
      already contains the solution (answer field). Server-side
      (models/feedback.ts), the rating setter has no bound and
      solves the challenge when Number(rating) === 0.
    pedagogical_intent: |
      Guided steps for both paths, with the exact server condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution API (verifiee en recette sur Juice Shop 19.2.1, sans
      authentification) :
        curl -s http://127.0.0.1:3000/rest/captcha
        # -> {"captchaId":0,"captcha":"4-7*6","answer":"-38"}
        curl -s -X POST http://127.0.0.1:3000/api/Feedbacks \
          -H "Content-Type: application/json" \
          -d '{"captchaId":0,"captcha":"-38","comment":"zero","rating":0}'
      Reponse 201, challenge resolu. Reprends captchaId et answer de
      TA reponse : ils changent a chaque appel.
      La voie UI (attribut disabled retire) est deduite du code
      (contact.component.html:68, contact.component.ts:45 et :86) ;
      elle envoie le meme corps avec rating 0.
      Defense : valider la note COTE SERVEUR (validator Sequelize
      min: 1, max: 5 sur rating) ; une borne d'interface n'est
      jamais un controle de securite. Accessoirement, ne pas renvoyer
      la solution du captcha au client.
    text_en: |
      API solution (verified during testing on Juice Shop 19.2.1, no
      authentication):
        curl -s http://127.0.0.1:3000/rest/captcha
        # -> {"captchaId":0,"captcha":"4-7*6","answer":"-38"}
        curl -s -X POST http://127.0.0.1:3000/api/Feedbacks \
          -H "Content-Type: application/json" \
          -d '{"captchaId":0,"captcha":"-38","comment":"zero","rating":0}'
      Response 201, challenge solved. Reuse captchaId and answer from
      YOUR response: they change on every call.
      The UI path (disabled attribute removed) is derived from the
      code (contact.component.html:68, contact.component.ts:45 and
      :86); it sends the same body with rating 0.
      Defense: validate the rating SERVER-SIDE (Sequelize validator
      min: 1, max: 5 on rating); a UI bound is never a security
      control. As a side note, do not send the captcha solution to
      the client.
    pedagogical_intent: |
      Full solution: verified API commands, UI path with code
      references, canonical server-side defense.
