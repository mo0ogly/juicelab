challenge_key: "usernameXssChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #2 : "Find a screen in the application
      that looks subtly odd and dated compared with all other
      screens". Donc une page LEGACY visuellement differente du
      reste. Tous les autres ecrans utilisent Angular Material
      (style coherent). Lequel des ecrans Juice Shop est
      visuellement different — old-school HTML, pas de Material
      ?
    text_en: |
      Official OWASP hint #2: "Find a screen in the application
      that looks subtly odd and dated compared with all other
      screens". So a LEGACY page visually different from the
      rest. All other screens use Angular Material (consistent
      style). Which Juice Shop screen looks visually different —
      old-school HTML, no Material?
    pedagogical_intent: |
      Direct toward the legacy page identification.

  N2:
    cost_pct: 10
    text_fr: |
      La page legacy est le profil utilisateur, servi par un endpoint
      Express (pas la SPA Angular) a /profile, avec un rendu de
      gabarit cote serveur. Hint OWASP #1 : le MEME ecran cumule deux
      defauts : un nettoyage maison a base de regex sur le champ
      Username, ET une injection possible dans l'en-tete Content-
      Security-Policy. Il faut exploiter les deux ensemble.
    text_en: |
      The legacy page is the user profile, served by an Express
      endpoint (not the Angular SPA) at /profile, with server-side
      template rendering. OWASP hint #1: the SAME screen has two
      flaws: a homegrown regex cleanup on the Username field, AND a
      possible injection into the Content-Security-Policy header. You
      must exploit both together.
    pedagogical_intent: |
      Locate the legacy page and announce the two combined flaws.

  N3:
    cost_pct: 20
    text_fr: |
      La CSP de /profile vaut img-src 'self' <profileImage>; script-
      src 'self' 'unsafe-eval'. Le champ profileImage vient de
      l'URL d'image que TU fournis (Image URL sur le profil) : quand
      l'URL n'est pas une image recuperable, le serveur la stocke
      telle quelle (routes/profileImageUrlUpload.ts). En y glissant
      ; script-src 'unsafe-inline', tu ajoutes cette directive a la
      CSP et tu autorises le script inline.
    text_en: |
      The /profile CSP is img-src 'self' <profileImage>; script-src
      'self' 'unsafe-eval'. The profileImage field comes from the
      image URL YOU provide (Image URL on the profile): when the URL
      is not a fetchable image, the server stores it as-is
      (routes/profileImageUrlUpload.ts). By slipping
      ; script-src 'unsafe-inline' into it, you add that directive to
      the CSP and allow inline script.
    pedagogical_intent: |
      Explain the CSP injection via the profile image URL field.

  N4:
    cost_pct: 35
    text_fr: |
      Deuxieme defaut : le champ Username passe par un nettoyage maison
      (security.sanitizeLegacy) dont la regex /<(?:\w+)\W+?[\w]/gi
      retire UN motif "balise ouvrante + un caractere". Tu peux donc
      cacher un leurre qui, une fois retire, reconstitue le script. La
      validation (routes/userProfile.ts) exige que la CSP stockee
      contienne 'unsafe-inline' ET que le username stocke contienne
      exactement <script>alert(`xss`)</script>.
    text_en: |
      Second flaw: the Username field goes through a homegrown cleanup
      (security.sanitizeLegacy) whose regex /<(?:\w+)\W+?[\w]/gi
      removes ONE "opening tag + one char" pattern. So you can hide a
      decoy that, once removed, reconstitutes the script. Validation
      (routes/userProfile.ts) requires the stored CSP to contain
      'unsafe-inline' AND the stored username to contain exactly
      <script>alert(`xss`)</script>.
    pedagogical_intent: |
      Explain the regex bypass and the exact two-part solve condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (payloads du test natif, bypass regex verifie hors
      ligne). Sur /#/profile :
      1. Champ Image URL : https://a.png; script-src 'unsafe-inline' 'self' 'unsafe-eval'
         puis valider : la CSP autorise desormais le script inline.
      2. Champ Username : <<a|ascript>alert(`xss`)</script>
         puis valider. La regex retire <a|a et il reste exactement
         <script>alert(`xss`)</script> ; le script s'execute.
      Note : challenge desactive en Docker (safetyMode). Chaine
      complete non rejouee pendant la revue ; payloads tires du test
      cypress officiel (test/cypress/e2e/profile.spec.ts) et bypass
      regex reproduit hors ligne.
      Defense : supprimer la CSP construite a partir d'entrees
      utilisateur (profileImage), remplacer le nettoyage regex maison
      par un echappement contextuel, et ne jamais rendre un champ
      utilisateur en HTML non echappe.
    text_en: |
      Solution (payloads from the native test, regex bypass verified
      offline). On /#/profile:
      1. Image URL field: https://a.png; script-src 'unsafe-inline' 'self' 'unsafe-eval'
         then submit: the CSP now allows inline script.
      2. Username field: <<a|ascript>alert(`xss`)</script>
         then submit. The regex removes <a|a and exactly
         <script>alert(`xss`)</script> remains; the script runs.
      Note: challenge disabled in Docker (safetyMode). Full chain not
      replayed during the review; payloads taken from the official
      cypress test (test/cypress/e2e/profile.spec.ts) and the regex
      bypass reproduced offline.
      Defense: remove the CSP built from user input (profileImage),
      replace the homegrown regex cleanup with contextual escaping, and
      never render a user field as unescaped HTML.
    pedagogical_intent: |
      Full solution: both payloads, source of payloads, honest replay
      status, defense.
