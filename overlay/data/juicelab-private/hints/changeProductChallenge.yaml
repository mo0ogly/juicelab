challenge_key: "changeProductChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 enumere 3 voies theoriques : (a)
      broken admin functionality, (b) RESTful API holes, (c) SQL
      Injection. Hint #2 te previent : 2 sur 3 sont des dead ends.
      Donc UNE seule voie marche en pratique. Reflechis : si tu
      essaies SQLi sur /rest/products/search, tu peux LIRE des
      donnees mais peux-tu MODIFIER une row precise via ce vector
      ? Et un admin functionality, est-ce que Juice Shop t'expose
      un /admin/products UI ?
    text_en: |
      Official OWASP hint #1 enumerates 3 theoretical paths: (a)
      broken admin functionality, (b) RESTful API holes, (c) SQL
      Injection. Hint #2 warns: 2 out of 3 are dead ends. So
      ONLY ONE works in practice. Think: if you try SQLi on
      /rest/products/search, can you READ data but can you
      MODIFY a specific row via that vector? And admin
      functionality, does Juice Shop expose a /admin/products UI?
    pedagogical_intent: |
      Eliminate dead ends, focus on RESTful API.

  N2:
    cost_pct: 10
    text_fr: |
      L'API RESTful est l'angle. Juice Shop expose
      /api/Products/:id avec les 4 verbs HTTP par defaut (GET POST
      PUT DELETE) sans restriction. Source : codefixes/
      changeProductChallenge.info.yml fix #2 (incorrect) explique
      : "the default permissions of the underlying API generator
      will be used: Allowing GET, POST, PUT and DELETE - without
      any restrictions". Quel verb modifie un row existant ?
    text_en: |
      The RESTful API is the angle. Juice Shop exposes
      /api/Products/:id with all 4 HTTP verbs by default (GET POST
      PUT DELETE) with no restriction. Source: codefixes/
      changeProductChallenge.info.yml fix #2 (incorrect) explains:
      "the default permissions of the underlying API generator
      will be used: Allowing GET, POST, PUT and DELETE - without
      any restrictions". Which verb modifies an existing row?
    pedagogical_intent: |
      Spell auto-generation default behavior, hint PUT.

  N3:
    cost_pct: 20
    text_fr: |
      PUT /api/Products/:id update le row. Tu dois trouver l'id
      du produit "OWASP SSL Advanced Forensic Tool (O-Saft)".
      Methode : GET /api/Products et grep le name pour trouver
      l'id. Ou plus directement : navigate dans le catalogue
      Juice Shop, ouvre le produit O-Saft, l'URL contient l'id
      (typiquement #/search?q=O-Saft mais le vrai id est dans le
      JSON network).
    text_en: |
      PUT /api/Products/:id updates the row. You must find the
      id of "OWASP SSL Advanced Forensic Tool (O-Saft)". Method:
      GET /api/Products and grep name to find the id. Or more
      directly: browse the Juice Shop catalog, open the O-Saft
      product, the URL contains the id (typically
      #/search?q=O-Saft but the real id is in the JSON network).
    pedagogical_intent: |
      Help locate the target product id.

  N4:
    cost_pct: 35
    text_fr: |
      O-Saft a l'id 9 dans le jeu de donnees par defaut (verifie par
      GET /api/Products/9). Aucun jeton n'est requis : la ligne
      app.put('/api/Products/:id', security.isAuthorized()) est
      commentee dans server.ts. La validation (routes/verify.ts,
      changeProductChallenge) exige DEUX conditions sur la nouvelle
      description : l'ancien lien https://www.owasp.org/index.php/O-Saft
      a disparu, ET elle contient exactement la chaine
        <a href="https://owasp.slack.com" target="_blank">
      Un href sans target="_blank" ne valide pas. La verification
      tourne en middleware a chaque requete : le challenge apparait
      resolu a la requete suivante.
    text_en: |
      O-Saft has id 9 in the default dataset (checked with
      GET /api/Products/9). No token is required: the line
      app.put('/api/Products/:id', security.isAuthorized()) is
      commented out in server.ts. Validation (routes/verify.ts,
      changeProductChallenge) requires TWO conditions on the new
      description: the old link https://www.owasp.org/index.php/O-Saft
      is gone, AND it contains exactly the string
        <a href="https://owasp.slack.com" target="_blank">
      An href without target="_blank" does not validate. The check
      runs as middleware on every request: the challenge shows as
      solved on the next request.
    pedagogical_intent: |
      Give the exact validation contract (two conditions, exact
      anchor string) before the full command.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
        curl -s -X PUT http://127.0.0.1:3000/api/Products/9 \
          -H "Content-Type: application/json" \
          -d '{"description":"O-Saft is an easy to use tool. <a href=\"https://owasp.slack.com\" target=\"_blank\">More...</a>"}'
      Reponse 200. Envoie ensuite n'importe quelle requete (recharge
      la page) : le middleware databaseRelatedChallenges relit le
      produit et resout le challenge.
      Defense canonique (codefixes, fix 3 correct) : n'autoriser que
      GET sur l'API produits :
        app.post('/api/Products', security.denyAll())
        app.put('/api/Products/:id', security.denyAll())
        app.delete('/api/Products/:id', security.denyAll())
      Le fix 4 (isAuthorized sur PUT) est insuffisant : il laisse tout
      client authentifie modifier le catalogue.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
        curl -s -X PUT http://127.0.0.1:3000/api/Products/9 \
          -H "Content-Type: application/json" \
          -d '{"description":"O-Saft is an easy to use tool. <a href=\"https://owasp.slack.com\" target=\"_blank\">More...</a>"}'
      Response 200. Then send any request (reload the page): the
      databaseRelatedChallenges middleware reloads the product and
      solves the challenge.
      Canonical defense (codefixes, fix 3 correct): allow only GET on
      the products API:
        app.post('/api/Products', security.denyAll())
        app.put('/api/Products/:id', security.denyAll())
        app.delete('/api/Products/:id', security.denyAll())
      Fix 4 (isAuthorized on PUT) is insufficient: it still lets any
      authenticated customer modify the catalogue.
    pedagogical_intent: |
      Full solution: verified command, why the solve is deferred,
      canonical fix from codefixes and why the partial fix fails.
