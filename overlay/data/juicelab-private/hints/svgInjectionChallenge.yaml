challenge_key: "svgInjectionChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP #1 : "multiple gaffes".
      Hint #2 : "delivery box image is made
      of [SVG]". Donc cible = remplacer le
      SVG default par cataas.com kitten.
    text_en: |
      OWASP hint #1: "multiple gaffes".
      Hint #2: "delivery box image is made
      of [SVG]". So target = replace
      default SVG with cataas.com kitten.
    pedagogical_intent: |
      Activate SVG + multi-vuln reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #4 : "exploit another
      vulnerability with own two challenges".
      Indique Unvalidated Redirects. Hint
      #5 : "strict use of cross-domain
      kittens" - cataas.com URL specifique.
    text_en: |
      OWASP hint #4: "exploit another
      vulnerability with own two challenges".
      Indicates Unvalidated Redirects. Hint
      #5: "strict use of cross-domain
      kittens" - specific cataas.com URL.
    pedagogical_intent: |
      Spell composition + target.

  N3:
    cost_pct: 20
    text_fr: |
      Source serveur (lib/startup/
      registerWebsocketEvents.ts:47) :
      `solveIf(() => data?.match(/...\/
      redirect?to=https?:\/\/placecats.com
      \/.../) && isRedirectAllowed(data))`.
      Donc le payload doit contenir une
      path traversal SVG qui redirect vers
      placecats.com (anciennement cataas).
    text_en: |
      Server source (lib/startup/
      registerWebsocketEvents.ts:47):
      `solveIf(() => data?.match(/...\/
      redirect?to=https?:\/\/placecats.com
      \/.../) && isRedirectAllowed(data))`.
      So payload must contain SVG path
      traversal redirecting to placecats.
      com (formerly cataas).
    pedagogical_intent: |
      Reveal exact regex.

  N4:
    cost_pct: 35
    text_fr: |
      Le vecteur n'est pas un fichier SVG uploade : c'est un parametre
      de test oublie, testDecal, sur la page /#/deluxe-membership. Il
      definit l'image du sticker en passant par l'endpoint /redirect,
      ce qui permet de charger une image EXTERNE. Pour que le redirect
      soit accepte, l'URL doit contenir une entree de l'allowlist (la
      meme faille includes() que redirectChallenge) ; la cible reelle
      est une image placecats.com.
    text_en: |
      The vector is not an uploaded SVG file: it is a forgotten test
      parameter, testDecal, on the /#/deluxe-membership page. It sets
      the sticker image through the /redirect endpoint, allowing an
      EXTERNAL image to load. For the redirect to be accepted, the URL
      must contain an allowlist entry (the same includes() flaw as
      redirectChallenge); the real target is a placecats.com image.
    pedagogical_intent: |
      Correct the vector: testDecal param on deluxe-membership via redirect.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (payload du test natif ; non rejoue de bout en bout -
      validation par evenement websocket apres chargement de l'image) :
      ouvre, connecte, l'URL
        /#/deluxe-membership?testDecal=<payload URL-encode>
      ou payload =
        ../../../<chemin>/redirect?to=https://placecats.com/g/200/100?x=https://github.com/juice-shop/juice-shop
      Le suffixe ?x=https://github.com/juice-shop/juice-shop satisfait
      isRedirectAllowed (includes), et la regex de validation reconnait
      la cible placecats.com. Le frontend emet alors
      verifySvgInjectionChallenge et le serveur resout le challenge
      (registerWebsocketEvents.ts:47). Source : test cypress
      (test/cypress/e2e/deluxe.spec.ts).
      Defense : supprimer les parametres de debug en production, valider
      les redirections par correspondance exacte (pas includes), et ne
      pas charger d'images d'origine arbitraire.
    text_en: |
      Solution (native test payload; not replayed end-to-end -
      validation via a websocket event after the image loads): open,
      logged in, the URL
        /#/deluxe-membership?testDecal=<URL-encoded payload>
      where payload =
        ../../../<path>/redirect?to=https://placecats.com/g/200/100?x=https://github.com/juice-shop/juice-shop
      The suffix ?x=https://github.com/juice-shop/juice-shop satisfies
      isRedirectAllowed (includes), and the validation regex recognizes
      the placecats.com target. The frontend then emits
      verifySvgInjectionChallenge and the server solves the challenge
      (registerWebsocketEvents.ts:47). Source: cypress test
      (test/cypress/e2e/deluxe.spec.ts).
      Defense: remove debug parameters in production, validate redirects
      by exact match (not includes), and do not load images from
      arbitrary origins.
    pedagogical_intent: |
      Full solution: correct vector, exact payload, defense.
