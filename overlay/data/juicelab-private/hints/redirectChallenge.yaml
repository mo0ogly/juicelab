challenge_key: "redirectChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP : "any redirect not on allowlist". L'endpoint /redirect
      a une allowlist mais elle est verifiable de maniere lax.
    text_en: |
      OWASP hint: "any redirect not on allowlist". /redirect endpoint has
      allowlist but verified loosely.
    pedagogical_intent: |
      Activate allowlist + bypass reflex.

  N2:
    cost_pct: 10
    text_fr: |
      L'allowlist est dans lib/insecurity.ts (Set redirectAllowlist).
      Test /redirect?to=https://www.attacker.com -> rejete. Mais /redirect
      ?to=https://www.attacker.com?https://github.com/bkimminich/juice-shop
      pourrait passer.
    text_en: |
      Allowlist is in lib/insecurity.ts (Set redirectAllowlist). Test
      /redirect?to=https://www.attacker.com -> rejected. But /redirect
      ?to=https://www.attacker.com?https://github.com/bkimminich/juice-shop
      could pass.
    pedagogical_intent: |
      Spell concrete bypass form.

  N3:
    cost_pct: 20
    text_fr: |
      Source bug lib/insecurity.ts:138 :
      `allowed = allowed || url.includes(allowedUrl)`. includes() trouve
      l'allowlist URL n'importe ou dans la chaine, pas qu'au debut. Donc
      accole une URL allowlistee comme query parameter pour bypass.
    text_en: |
      Source bug lib/insecurity.ts:138:
      `allowed = allowed || url.includes(allowedUrl)`. includes() finds
      allowlist URL anywhere in string, not only at start. So append an
      allowlisted URL as query parameter to bypass.
    pedagogical_intent: |
      Reveal exact bug.

  N4:
    cost_pct: 35
    text_fr: |
      La faille est dans isRedirectAllowed (lib/insecurity.ts) : il
      teste url.includes(allowedUrl), pas un prefixe. N'importe quelle
      URL qui CONTIENT une entree de l'allowlist passe le controle,
      meme si la vraie cible est ailleurs. L'allowlist actuelle contient
      https://github.com/juice-shop/juice-shop (et non l'ancien chemin
      bkimminich). La validation (redirectChallenge) exige en plus que
      l'URL ne COMMENCE pas par une entree autorisee (redirection
      reellement detournee).
    text_en: |
      The flaw is in isRedirectAllowed (lib/insecurity.ts): it tests
      url.includes(allowedUrl), not a prefix. Any URL that CONTAINS an
      allowlist entry passes the check, even if the real target is
      elsewhere. The current allowlist contains
      https://github.com/juice-shop/juice-shop (not the old bkimminich
      path). Validation (redirectChallenge) also requires the URL NOT
      to START with an allowed entry (a genuinely unintended redirect).
    pedagogical_intent: |
      Explain the includes() flaw and the current allowlist entry.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : fabrique
      une URL dont la vraie cible est attaquante mais qui contient une
      entree de l'allowlist en parametre, par exemple
        /redirect?to=https://www.attacker.com?x=https://github.com/juice-shop/juice-shop
      (URL-encode la valeur de to). includes() trouve la sous-chaine
      autorisee donc le redirect est accepte, mais la cible reelle est
      attacker.com : le challenge se resout. Attention : l'ancien
      chemin github.com/bkimminich/juice-shop n'est plus dans
      l'allowlist et echoue (406).
      Defense : valider l'URL de redirection par correspondance exacte
      avec une liste blanche (ou un prefixe strict), jamais par
      includes().
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): build a
      URL whose real target is attacker-controlled but which contains
      an allowlist entry as a parameter, e.g.
        /redirect?to=https://www.attacker.com?x=https://github.com/juice-shop/juice-shop
      (URL-encode the to value). includes() finds the allowed substring
      so the redirect is accepted, but the real target is attacker.com:
      the challenge solves. Note: the old path
      github.com/bkimminich/juice-shop is no longer in the allowlist
      and fails (406).
      Defense: validate the redirect URL by exact allowlist match (or a
      strict prefix), never by includes().
    pedagogical_intent: |
      Full solution: verified payload with the current path, defense.
