challenge_key: "ephemeralAccountantChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Le hint OWASP officiel #2 dit "the user literally needs to be
      ephemeral as in lasting for only a short time". Ephemere = qui
      ne dure pas, qui n'est pas persiste. Si tu ne peux pas
      enregistrer le user (le shop refuse) et tu ne peux pas
      l'inserer en DB (le challenge est invalidate), comment serait-il
      possible d'avoir un user "qui n'existe pas vraiment" mais qui
      te connecte quand meme ?
    text_en: |
      The official OWASP hint #2 says "the user literally needs to be
      ephemeral as in lasting for only a short time". Ephemeral =
      doesn't last, not persisted. If you can't register (the shop
      refuses) and you can't INSERT in DB (challenge invalidated),
      how could a user "not really existing" still log you in?
    pedagogical_intent: |
      Activate the conceptual reflex on persistence vs transient session.

  N2:
    cost_pct: 10
    text_fr: |
      Le hint OWASP officiel #5 le dit explicitement : "The fact that
      this challenge is in the Injection category should already give
      away the intended approach". Il faut faire une injection SQL
      sur le login. Mais quelle FAMILLE de SQLi peut FABRIQUER des
      donnees au lieu de simplement filtrer ?
    text_en: |
      Official OWASP hint #5 says it explicitly: "The fact that this
      challenge is in the Injection category should already give away
      the intended approach". You must SQL inject on login. But which
      FAMILY of SQLi can FABRICATE data instead of just filtering?
    pedagogical_intent: |
      Distinguish UNION-based from comment-based SQLi by hinting at fabrication.

  N3:
    cost_pct: 20
    text_fr: |
      UNION SELECT permet d'ajouter un row choisi par l'attaquant a un
      resultat de requete. Si le backend SELECT * FROM users WHERE
      email='<input>', tu peux injecter '
      UNION SELECT ...,'acc0unt4nt@juice-sh.op',... -- pour fabriquer
      un user. Probleme technique : il faut le BON nombre de colonnes
      avec les BONS types pour que l'UNION soit accepte. Methode :
      test progressif (NULL,NULL,...) jusqu'a ce que ca passe.
    text_en: |
      UNION SELECT lets you append a row chosen by the attacker to a
      query result. If the backend is SELECT * FROM users WHERE
      email='<input>', you can inject '
      UNION SELECT ...,'acc0unt4nt@juice-sh.op',... -- to fabricate
      a user. Technical issue: you need the RIGHT column count with
      compatible types for the UNION to be accepted. Method:
      progressive testing (NULL,NULL,...) until it goes through.
    pedagogical_intent: |
      Give the syntactic shape and the column-alignment difficulty.

  N4:
    cost_pct: 35
    text_fr: |
      La requete de login fait SELECT * FROM Users : ton UNION doit
      aligner TOUTES les colonnes de Users, soit 13 (id, username,
      email, password, role, deluxeToken, lastLoginIp, profileImage,
      totpSecret, isActive, createdAt, updatedAt, deletedAt). Trois
      contraintes pour que la session soit valide : l'id (colonne 1)
      non nul, l'email (colonne 3) = acc0unt4nt@juice-sh.op, le role
      (colonne 5) = exactement "accounting", et totpSecret (colonne 9)
      = chaine vide (sinon le serveur reclame un second facteur).
    text_en: |
      The login query does SELECT * FROM Users: your UNION must align
      ALL columns of Users, i.e. 13 (id, username, email, password,
      role, deluxeToken, lastLoginIp, profileImage, totpSecret,
      isActive, createdAt, updatedAt, deletedAt). Three constraints for
      a valid session: a non-null id (column 1), email (column 3) =
      acc0unt4nt@juice-sh.op, role (column 5) = exactly "accounting",
      and totpSecret (column 9) = empty string (otherwise the server
      asks for a second factor).
    pedagogical_intent: |
      Correct the column count (13) and the exact role value and
      totpSecret constraint.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : dans le
      champ email du login, saisis
        ' UNION SELECT 15,'acc','acc0unt4nt@juice-sh.op','x','accounting','a','a','a','',1,null,null,null FROM Users--
      mot de passe quelconque. Le UNION fabrique une ligne "accounting"
      ephemere (aucun enregistrement correspondant en base), le AND
      password est commente, et tu es connecte comme accountant. Le
      challenge verifie que ce compte n'existe pas vraiment (count = 0)
      puis se resout (login.ts:77). Attention : role "accountant"
      (sans -ing) echoue ; totpSecret non vide force le flux 2FA.
      Defense : requetes parametrees sur le login, et ne jamais deduire
      le role d'un resultat de requete falsifiable par l'entree.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): in the
      login email field, enter
        ' UNION SELECT 15,'acc','acc0unt4nt@juice-sh.op','x','accounting','a','a','a','',1,null,null,null FROM Users--
      any password. The UNION forges an ephemeral "accounting" row (no
      matching DB record), the AND password is commented out, and you
      are logged in as the accountant. The challenge checks the account
      does not really exist (count = 0) then solves (login.ts:77). Note:
      role "accountant" (without -ing) fails; a non-empty totpSecret
      forces the 2FA flow.
      Defense: parameterized login queries, and never derive the role
      from a query result forgeable by the input.
    pedagogical_intent: |
      Full solution: verified 13-column UNION, exact role, defense.
