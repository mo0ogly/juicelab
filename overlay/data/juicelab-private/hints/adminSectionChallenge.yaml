challenge_key: "adminSectionChallenge"
schema_version: "juicelab.hints.v1"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Toute application qui a des utilisateurs ordinaires a presque toujours
      une section reservee aux administrateurs. Cette section n'est pas
      proposee dans le menu pour un utilisateur normal, mais l'URL existe.
      Le controle d'acces n'est pas l'absence du lien, c'est la verification
      de l'identite. Que se passe-t-il si tu ouvres l'URL alors que tu es
      deja admin ?
    text_en: |
      Any application with regular users almost always has an
      administrator-only section. That section is not offered in the menu
      for a regular user, but the URL exists. Access control is not the
      absence of the link, it is the identity check. What happens if you
      open the URL while already logged in as admin?
    pedagogical_intent: |
      Activate the access-control reflex: hidden URL is not the same as protected URL.

  N2:
    cost_pct: 10
    text_fr: |
      Deux questions distinctes : OU est la page (son chemin), et QUI
      decide si tu as le droit de l'afficher ? Dans une SPA Angular,
      les chemins sont dans le bundle JavaScript, comme pour le
      score-board. Le controle d'acces, lui, peut vivre cote serveur
      ou seulement dans le navigateur. Le hint OWASP annonce "au moins
      trois facons" de le contourner : c'est un indice sur sa solidite.
    text_en: |
      Two separate questions: WHERE is the page (its path), and WHO
      decides whether you may display it? In an Angular SPA, paths
      live in the JavaScript bundle, as for the score board. Access
      control, however, may live server-side or only in the browser.
      The OWASP hint announces "at least three ways" to bypass it:
      that is a clue about how solid it is.
    pedagogical_intent: |
      Split the problem: route discovery versus where access control
      is enforced.

  N3:
    cost_pct: 20
    text_fr: |
      Cherche "admin" dans la table de routage du bundle (Sources >
      main.js) : tu trouveras le path de la page et la garde qui la
      protege (canActivate). Cette garde (AdminGuard, app.guard.ts)
      decode le JWT stocke dans localStorage avec jwtDecode, SANS
      verifier sa signature, et laisse passer si data.role vaut
      "admin". Le controle est donc entierement cote client.
    text_en: |
      Search for "admin" in the bundle routing table (Sources >
      main.js): you will find the page path and the guard protecting
      it (canActivate). That guard (AdminGuard, app.guard.ts) decodes
      the JWT stored in localStorage with jwtDecode, WITHOUT checking
      its signature, and lets you through if data.role is "admin".
      The check is therefore entirely client-side.
    pedagogical_intent: |
      Localize the surface: route path plus the client-only guard.

  N4:
    cost_pct: 35
    text_fr: |
      Le chemin est /#/administration. Pour passer la garde, il faut
      un token dont le role est admin. Voie la plus directe : te
      connecter comme admin (challenge Login Admin, injection SQL
      dans le champ email). Autres voies coherentes avec la garde :
      mot de passe faible du compte admin (Password Strength), ou
      token modifie a la main puisque la signature n'est pas
      verifiee par la garde. Le challenge est valide quand la page
      s'affiche reellement : elle charge l'image
      assets/public/images/padding/19px.png, et le serveur resout le
      challenge sur cette requete (routes/verify.ts:65).
    text_en: |
      The path is /#/administration. To pass the guard you need a
      token whose role is admin. Most direct way: log in as admin
      (Login Admin challenge, SQL injection in the email field).
      Other ways consistent with the guard: the admin account's weak
      password (Password Strength), or a hand-edited token since the
      guard does not verify the signature. The challenge is solved
      when the page actually renders: it loads the image
      assets/public/images/padding/19px.png, and the server solves
      the challenge on that request (routes/verify.ts:65).
    pedagogical_intent: |
      Guided steps: exact path, three bypass families matching the
      OWASP hint, exact validation trigger.

  N5:
    cost_pct: 50
    text_fr: |
      1. Page de login, email : ' OR true--  , mot de passe
         quelconque. Tu es connecte comme admin@juice-sh.op.
      2. Barre d'adresse : http://127.0.0.1:3000/#/administration
      3. La page liste utilisateurs et feedbacks ; son image
         19px.png declenche la validation.
      Cette sequence est deduite du code (app.routing.ts,
      app.guard.ts, administration.component.html:119,
      verify.ts:65) ; elle n'a pas ete rejouee en navigateur lors de
      la revue du 2026-11-16.
      Defense : la garde Angular n'est qu'un confort d'interface.
      Chaque endpoint d'administration doit verifier cote serveur un
      token signe et le role admin ; ne pas exposer de route
      d'administration dans le bundle client public.
    text_en: |
      1. Login page, email: ' OR true--  , any password. You are
         logged in as admin@juice-sh.op.
      2. Address bar: http://127.0.0.1:3000/#/administration
      3. The page lists users and feedback; its 19px.png image
         triggers validation.
      This sequence is derived from the code (app.routing.ts,
      app.guard.ts, administration.component.html:119,
      verify.ts:65); it was not replayed in a browser during the
      2026-11-16 review.
      Defense: the Angular guard is only a UI convenience. Every
      administration endpoint must verify a signed token and the
      admin role server-side; do not expose an administration route
      in the public client bundle.
    pedagogical_intent: |
      Full solution with code references, honest replay status,
      server-side defense.
