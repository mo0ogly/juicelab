challenge_key: "resetPasswordJimChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Le mecanisme attaque est la reinitialisation par question secrete.
      Hint OWASP #1 : le plus dur est de decouvrir QUI est Jim. Son
      email, jim@juice-sh.op, apparait comme auteur d'avis produit
      (clique des produits, section Reviews). Reste a identifier le
      personnage derriere ce compte.
    text_en: |
      The attacked mechanism is the security-question reset. OWASP
      hint #1: the hard part is finding out WHO Jim is. His email,
      jim@juice-sh.op, appears as a product review author (open
      products, Reviews section). Then identify the character behind
      the account.
    pedagogical_intent: |
      Frame the reset mechanism and the identity step.

  N2:
    cost_pct: 10
    text_fr: |
      Sur /#/forgot-password, saisis jim@juice-sh.op : la question
      secrete s'affiche, "Your eldest siblings middle name?" (le
      DEUXIEME prenom du frere/soeur aine, pas son prenom). Hint OWASP
      #2 : Jim a repondu honnetement a une mauvaise question ; hint #3 :
      Jim est une celebrite, donc la reponse est trouvable en source
      ouverte.
    text_en: |
      On /#/forgot-password, enter jim@juice-sh.op: the security
      question shows, "Your eldest siblings middle name?" (the MIDDLE
      name of the eldest sibling, not their first name). OWASP hint
      #2: Jim answered a bad question truthfully; hint #3: Jim is a
      celebrity, so the answer is findable in open sources.
    pedagogical_intent: |
      Give the exact question and stress "middle name".

  N3:
    cost_pct: 20
    text_fr: |
      Jim est James T. Kirk, capitaine de l'USS Enterprise (Star
      Trek). Cherche sa famille sur Memory Alpha ou Wikipedia : son
      frere aine est George Samuel Kirk. La question demande le
      DEUXIEME prenom de ce frere aine.
    text_en: |
      Jim is James T. Kirk, captain of the USS Enterprise (Star
      Trek). Look up his family on Memory Alpha or Wikipedia: his
      elder brother is George Samuel Kirk. The question asks for that
      elder brother's MIDDLE name.
    pedagogical_intent: |
      Identify the character and the exact genealogical fact needed.

  N4:
    cost_pct: 35
    text_fr: |
      George SAMUEL Kirk : le deuxieme prenom est Samuel. C'est donc
      la reponse, pas "George" ni "George Samuel". La validation
      (routes/resetPassword.ts:58) exige user Jim ET answer exactement
      "Samuel". Hint OWASP #4 : la reponse est aussi brute-forcable
      avec une bonne liste de prenoms.
    text_en: |
      George SAMUEL Kirk: the middle name is Samuel. So that is the
      answer, not "George" nor "George Samuel". Validation
      (routes/resetPassword.ts:58) requires user Jim AND answer
      exactly "Samuel". OWASP hint #4: the answer is also brute-
      forceable with a good first-name list.
    pedagogical_intent: |
      Pin the exact answer and the validation condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : /#/forgot-password, email jim@juice-sh.op, question
      "Your eldest siblings middle name?", reponse Samuel, puis un
      nouveau mot de passe. Reponse confirmee dans le code
      (resetPassword.ts:58) ; question confirmee par
      /rest/user/security-question?email=jim@juice-sh.op. Non rejouee
      pour ne pas changer le mot de passe du compte seede.
      Defense : les questions secretes a reponse publique (celebrite,
      genealogie) n'offrent aucune protection ; preferer un reset par
      e-mail a jeton a usage unique.
    text_en: |
      Solution: /#/forgot-password, email jim@juice-sh.op, question
      "Your eldest siblings middle name?", answer Samuel, then a new
      password. Answer confirmed in the code (resetPassword.ts:58);
      question confirmed via
      /rest/user/security-question?email=jim@juice-sh.op. Not replayed
      to avoid changing the seeded account's password.
      Defense: security questions with a public answer (celebrity,
      genealogy) offer no protection; prefer an email reset with a
      single-use token.
    pedagogical_intent: |
      Full solution, source-confirmed answer, honest replay status,
      defense.
