challenge_key: "jwtUnsignedChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "This challenge exploits
      a weird option that is supported when signing
      tokens with JWT". L'option weird = `alg: "none"`.
      Hint #4 : "downgrading to no encryption at all".
      Hint #5 : URL-safe encoding (base64url).
    text_en: |
      Official OWASP hint #1: "This challenge exploits
      a weird option that is supported when signing
      tokens with JWT". The weird option = `alg:
      "none"`. Hint #4: "downgrading to no encryption
      at all". Hint #5: URL-safe encoding (base64url).
    pedagogical_intent: |
      Activate alg=none JWT vuln reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #2 : "begin with retrieving a valid
      JWT from the application's Authorization request
      header". Donc login Juice Shop normal, puis
      copy le JWT depuis Authorization header
      (DevTools Network tab, ou localStorage `token`).
      Hint #3 : JWT a une expiration courte, fais vite.
    text_en: |
      OWASP hint #2: "begin with retrieving a valid
      JWT from the application's Authorization
      request header". So normal Juice Shop login,
      then copy JWT from Authorization header
      (DevTools Network tab, or localStorage
      `token`). Hint #3: JWT has short expiration,
      be fast.
    pedagogical_intent: |
      Spell JWT acquisition.

  N3:
    cost_pct: 20
    text_fr: |
      Decode le JWT sur jwt.io (paste dans le
      decoder). Tu vois 3 parts : header (`{alg:
      "RS256", typ: "JWT"}` ou similar), payload
      (`{data: {email: "your@email", id: ..., ...}}`),
      signature. Pour le forger : (a) modifier header
      en `{"alg":"none","typ":"JWT"}`, (b) modifier
      payload pour `data.email = "jwtn3d@juice-
      sh.op"`, (c) signature vide.
    text_en: |
      Decode JWT on jwt.io (paste in decoder). You
      see 3 parts: header (`{alg: "RS256", typ:
      "JWT"}` or similar), payload (`{data: {email:
      "your@email", id: ..., ...}}`), signature. To
      forge: (a) modify header to
      `{"alg":"none","typ":"JWT"}`, (b) modify
      payload to `data.email = "jwtn3d@juice-
      sh.op"`, (c) empty signature.
    pedagogical_intent: |
      Spell forge mechanic.

  N4:
    cost_pct: 35
    text_fr: |
      Un JWT a trois parties base64url separees par des points :
      header.payload.signature. Mets alg a "none" dans le header, mets
      data.email a jwtn3d@juice-sh.op dans le payload (garde iat et un
      exp lointain, par ex. 9999999999), et laisse la signature VIDE
      (termine par un point). Le serveur (routes/verify.ts, jwtChallenge)
      resout si l'algorithme est "none" ET l'email correspond.
    text_en: |
      A JWT has three base64url parts separated by dots:
      header.payload.signature. Set alg to "none" in the header, set
      data.email to jwtn3d@juice-sh.op in the payload (keep iat and a
      far exp, e.g. 9999999999), and leave the signature EMPTY (end
      with a dot). The server (routes/verify.ts, jwtChallenge) solves
      if the algorithm is "none" AND the email matches.
    pedagogical_intent: |
      Give the token structure, the none-alg and the needed claims.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : forge le
      token, par exemple
        node -e "const b=s=>Buffer.from(s).toString('base64url');console.log(b('{\"alg\":\"none\",\"typ\":\"JWT\"}')+'.'+b('{\"data\":{\"email\":\"jwtn3d@juice-sh.op\"},\"iat\":1,\"exp\":9999999999}')+'.')"
      puis envoie-le comme jeton : soit en en-tete
      Authorization: Bearer <token>, soit en le mettant dans
      localStorage sous la cle token puis en rechargeant. Le challenge
      se resout a la premiere requete authentifiee. Sans exp lointain,
      la verification echoue.
      Defense : rejeter cote serveur l'algorithme "none" ; verifier la
      signature avec une liste blanche d'algorithmes (RS256 attendu).
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): forge
      the token, e.g.
        node -e "const b=s=>Buffer.from(s).toString('base64url');console.log(b('{\"alg\":\"none\",\"typ\":\"JWT\"}')+'.'+b('{\"data\":{\"email\":\"jwtn3d@juice-sh.op\"},\"iat\":1,\"exp\":9999999999}')+'.')"
      then send it as the token: either in an Authorization: Bearer
      <token> header, or by placing it in localStorage under the key
      token and reloading. The challenge solves on the first
      authenticated request. Without a far exp, verification fails.
      Defense: reject the "none" algorithm server-side; verify the
      signature against an algorithm allowlist (RS256 expected).
    pedagogical_intent: |
      Full solution: verified forge command, delivery, exp caveat,
      defense.
