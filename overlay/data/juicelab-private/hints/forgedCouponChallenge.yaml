challenge_key: "forgedCouponChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "Try either a)
      knowledgeable brute force, b) reverse
      engineering, or c) cloud research". 3
      approaches possibles. Tags : Good for Demos,
      Code Analysis. Cible : coupon code donnant
      80%+ discount.
    text_en: |
      Official OWASP hint #1: "Try either a)
      knowledgeable brute force, b) reverse
      engineering, or c) cloud research". 3
      possible approaches. Tags: Good for Demos,
      Code Analysis. Target: coupon code giving
      80%+ discount.
    pedagogical_intent: |
      Activate 3-approach strategic thinking.

  N2:
    cost_pct: 10
    text_fr: |
      Source serveur (routes/order.ts:185) :
      `solveIf(() => discount >= 80)`. La fonction
      `security.discountFromCoupon(coupon)` dans
      lib/insecurity.ts decrypte le coupon. Donc
      le code de generation/decryption est
      visible dans le bundle Angular OU dans le
      source backend (Code Analysis tag).
    text_en: |
      Server source (routes/order.ts:185):
      `solveIf(() => discount >= 80)`.
      `security.discountFromCoupon(coupon)` in
      lib/insecurity.ts decrypts coupon. So
      generation/decryption code visible in
      Angular bundle OR backend source (Code
      Analysis tag).
    pedagogical_intent: |
      Spell solve check + investigation surface.

  N3:
    cost_pct: 20
    text_fr: |
      Inspecte lib/insecurity.ts (Juice Shop
      source). La fonction generateCoupon utilise
      typiquement z85 encoding + symmetric XOR ou
      shift cipher avec un seed predictible. Le
      format est generalement
      `<DATE>-<DISCOUNT>-<NAME>` encoded. Pour
      reverse-engineer : copy la fonction generate
      Coupon, exporter localement, generer un
      coupon avec discount=80 et today's date.
    text_en: |
      Inspect lib/insecurity.ts (Juice Shop
      source). generateCoupon function typically
      uses z85 encoding + symmetric XOR or shift
      cipher with predictable seed. Format
      generally `<DATE>-<DISCOUNT>-<NAME>`
      encoded. To reverse-engineer: copy
      generateCoupon function, export locally,
      generate coupon with discount=80 and
      today's date.
    pedagogical_intent: |
      Reveal investigation method.

  N4:
    cost_pct: 35
    text_fr: |
      Le code du coupon (lib/insecurity.ts) est volontairement faible :
        generateCoupon(discount, date) = z85.encode(MMMYY + '-' + discount)
      ou MMMYY est le mois en 3 lettres MAJUSCULES + l'annee sur 2
      chiffres (ex. NOV26). Il n'y a NI XOR NI chiffrement : juste un
      encodage z85 reversible. A la validation (discountFromCoupon), le
      serveur z85-decode, verifie que le mois/annee est le mois COURANT,
      et lit la remise. Le challenge est resolu si la remise est >= 80.
    text_en: |
      The coupon code (lib/insecurity.ts) is deliberately weak:
        generateCoupon(discount, date) = z85.encode(MMMYY + '-' + discount)
      where MMMYY is the 3-letter UPPERCASE month + 2-digit year (e.g.
      NOV26). There is NO XOR and NO encryption: just a reversible z85
      encoding. On validation (discountFromCoupon), the server z85-
      decodes, checks the month/year is the CURRENT month, and reads
      the discount. The challenge solves if the discount is >= 80.
    pedagogical_intent: |
      Correct the algorithm: z85 encoding only, uppercase MMMYY, >=80.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : encode
      "<MOIS COURANT en 3 lettres MAJUSCULES><AA>-80" en z85, par
      exemple pour novembre 2026 :
        node -e "console.log(require('z85').encode('NOV26-80'))"
        # -> pes[Chz3)x
      Applique-le au panier :
        PUT /rest/basket/<ton_bid>/coupon/<coupon URL-encode>
      (reponse {"discount":80}), puis valide le panier
      (POST /rest/basket/<bid>/checkout). Le challenge se resout
      (order.ts:185). Attention : le mois doit etre le mois courant et
      en MAJUSCULES (le tableau months est ['JAN'...'DEC']) ; les
      caracteres z85 doivent etre URL-encodes dans le chemin.
      Defense : signer les coupons (HMAC avec un secret serveur) et
      verifier la signature ; un encodage reversible n'est pas une
      protection.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): z85-
      encode "<CURRENT MONTH 3-letter UPPERCASE><YY>-80", e.g. for
      November 2026:
        node -e "console.log(require('z85').encode('NOV26-80'))"
        # -> pes[Chz3)x
      Apply it to the basket:
        PUT /rest/basket/<your_bid>/coupon/<URL-encoded coupon>
      (response {"discount":80}), then check out
      (POST /rest/basket/<bid>/checkout). The challenge solves
      (order.ts:185). Note: the month must be the current month and
      UPPERCASE (the months array is ['JAN'...'DEC']); z85 characters
      must be URL-encoded in the path.
      Defense: sign coupons (HMAC with a server secret) and verify the
      signature; a reversible encoding is not protection.
    pedagogical_intent: |
      Full solution: verified z85 forge, apply+checkout, defense.
