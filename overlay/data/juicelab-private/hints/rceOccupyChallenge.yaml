challenge_key: "rceOccupyChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP : "occupy CPU 2 seconds". Tu connais le rceChallenge
      (boucle infinie). Ici c'est une variante DoS : occuper le CPU > 2s
      pour declencher le timeout sandbox.
    text_en: |
      OWASP hint: "occupy CPU 2 seconds". You know rceChallenge (infinite
      loop). Here it's a DoS variant: occupy CPU > 2s to trigger sandbox
      timeout.
    pedagogical_intent: |
      Activate timeout reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Le sandbox notevil + vm.runInContext a 2 protections : (1) max
      iterations (le rceChallenge), (2) timeout 2s (ce challenge). Il
      faut un code qui PROGRESSE (avoid max iter) mais LENT (CPU bound).
    text_en: |
      notevil + vm.runInContext sandbox has 2 protections: (1) max
      iterations (rceChallenge), (2) 2s timeout (this challenge). Need
      code that PROGRESSES (avoid max iter) but SLOW (CPU bound).
    pedagogical_intent: |
      Spell distinction.

  N3:
    cost_pct: 20
    text_fr: |
      Exemple : un gros nested loop ou regex catastrophic backtracking.
      `for(let i=0;i<1e9;i++){Math.sqrt(i);}` ou `'a'.repeat(100000).match
      (/(a+)+b/)`. Le code fait du work mais lent.
    text_en: |
      Example: big nested loop or regex catastrophic backtracking.
      `for(let i=0;i<1e9;i++){Math.sqrt(i);}` or `'a'.repeat(100000).match
      (/(a+)+b/)`. Code does work but slow.
    pedagogical_intent: |
      Reveal CPU pattern.

  N4:
    cost_pct: 35
    text_fr: |
      Meme surface que rceChallenge (POST /b2b/v2/orders, champ
      orderLinesData evalue dans un bac a sable avec timeout 2000 ms),
      mais ici il faut un calcul qui DEPASSE 2000 ms sans etre detecte
      comme boucle. Une boucle for bornee est comptee et levee en
      "Infinite loop detected" (ce serait rceChallenge). La voie fiable
      est un ReDoS : une regex a backtracking catastrophique s'execute
      en code natif, non comptable par le bac a sable, et depasse le
      timeout.
    text_en: |
      Same surface as rceChallenge (POST /b2b/v2/orders, orderLinesData
      evaluated in a sandbox with a 2000 ms timeout), but here you need
      a computation that EXCEEDS 2000 ms without being detected as a
      loop. A bounded for loop is counted and raises "Infinite loop
      detected" (that would be rceChallenge). The reliable path is a
      ReDoS: a catastrophic-backtracking regex runs in native code,
      uncountable by the sandbox, and exceeds the timeout.
    pedagogical_intent: |
      Distinguish from rce: need a timeout (ReDoS), not a detectable loop.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : envoie un
      ReDoS a l'API B2B :
        curl -s -X POST http://127.0.0.1:3000/b2b/v2/orders \\
          -H "Authorization: Bearer <ton_jwt>" \\
          -H "Content-Type: application/json" \\
          -d '{"orderLinesData":"/((a+)+)+$/.test(\"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!\")"}'
      L'evaluation depasse 2000 ms (mesure environ 2,0 s), le serveur
      repond 503 et leve "Script execution timed out" : le challenge est
      resolu (b2bOrder.ts:27). Endpoint exact : /b2b/v2/orders.
      Defense : ne pas evaluer d'entree utilisateur ; se premunir du
      ReDoS (regex lineaires, moteur RE2) et plafonner le temps CPU.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): send a
      ReDoS to the B2B API:
        curl -s -X POST http://127.0.0.1:3000/b2b/v2/orders \\
          -H "Authorization: Bearer <your_jwt>" \\
          -H "Content-Type: application/json" \\
          -d '{"orderLinesData":"/((a+)+)+$/.test(\"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!\")"}'
      Evaluation exceeds 2000 ms (measured about 2.0 s), the server
      replies 503 and raises "Script execution timed out": the challenge
      solves (b2bOrder.ts:27). Exact endpoint: /b2b/v2/orders.
      Defense: do not evaluate user input; guard against ReDoS (linear
      regex, RE2 engine) and cap CPU time.
    pedagogical_intent: |
      Full verified solution: ReDoS payload, exact endpoint, defense.
