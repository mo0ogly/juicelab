challenge_key: "persistedXssUserChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "There are only some input fields
      in the Juice Shop forms that validate their input". Donc la
      premiere etape est de mapper QUELS fields ont une validation
      client-side. Indices visuels : un mat-error rouge qui
      apparait, une regex pattern, un disable du bouton submit
      tant que invalide. Va sur les pages avec des forms (Profile,
      Account > Saved Addresses, Customer Feedback, Contact)
      et observe.
    text_en: |
      Official OWASP hint #1: "There are only some input fields
      in the Juice Shop forms that validate their input". So
      first step is mapping WHICH fields have client-side
      validation. Visual cues: red mat-error appearing, regex
      pattern, submit button disabled until valid. Go through
      pages with forms (Profile, Account > Saved Addresses,
      Customer Feedback, Contact) and observe.
    pedagogical_intent: |
      Activate the field-mapping reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #2 : encore moins de ces champs sont persistes puis
      reaffiches ailleurs. Cherche un champ valide cote client, stocke
      tel quel, puis reaffiche. L'email de ton compte coche les trois
      cases : le formulaire valide son format (Validators.email),
      l'email est stocke, et il reapparait ensuite dans ton compte.
    text_en: |
      OWASP hint #2: even fewer of these fields are persisted then
      shown again elsewhere. Look for a field validated client-side,
      stored as-is, then redisplayed. Your account email ticks all
      three: the form validates its format (Validators.email), the
      email is stored, and it later reappears in your account.
    pedagogical_intent: |
      Point at the email field as the validated+persisted+redisplayed one.

  N3:
    cost_pct: 20
    text_fr: |
      Hint OWASP #3 : contourner une protection cote client se fait
      soit en la desactivant dans le navigateur (DOM), soit en
      ignorant le frontend et en parlant directement au backend. Le
      validateur d'email d'Angular ne protege pas l'API : un POST
      /api/Users (inscription) ou une mise a jour peut porter un email
      qui n'est pas un email du tout.
    text_en: |
      OWASP hint #3: bypassing a client-side guard is done either by
      disabling it in the browser (DOM), or by ignoring the frontend
      and talking to the backend directly. Angular's email validator
      does not protect the API: a POST /api/Users (registration) or an
      update can carry an email that is not an email at all.
    pedagogical_intent: |
      Name the client guard and the backend-direct bypass.

  N4:
    cost_pct: 35
    text_fr: |
      Le payload exact (description) est <iframe
      src="javascript:alert(`xss`)">, a placer dans le champ email. La
      validation (models/user.ts, setter de email) resout le challenge
      des que l'email fourni contient cette chaine. Aucun privilege
      particulier n'est requis : il suffit de creer un compte avec cet
      email via l'API.
    text_en: |
      The exact payload (description) is <iframe
      src="javascript:alert(`xss`)">, to place in the email field.
      Validation (models/user.ts, email setter) solves the challenge
      as soon as the supplied email contains this string. No special
      privilege is required: just create an account with that email
      via the API.
    pedagogical_intent: |
      Give the exact payload, the field and the validation condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
        curl -s -X POST http://127.0.0.1:3000/api/Users \\
          -H "Content-Type: application/json" \\
          -d '{"email":"<iframe src=\\"javascript:alert(`xss`)\\">","password":"Xx123456!","passwordRepeat":"Xx123456!","securityQuestion":{"id":2},"securityAnswer":"x"}'
      Reponse 201, challenge resolu : le setter d'email du modele User
      detecte le payload. Dans l'UI, l'email est ensuite reaffiche
      (compte / commandes) et l'iframe s'execute.
      Defense : valider ET nettoyer cote serveur (ne pas se fier au
      validateur Angular) ; echapper l'email a l'affichage plutot que
      de l'inserer en HTML.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
        curl -s -X POST http://127.0.0.1:3000/api/Users \\
          -H "Content-Type: application/json" \\
          -d '{"email":"<iframe src=\\"javascript:alert(`xss`)\\">","password":"Xx123456!","passwordRepeat":"Xx123456!","securityQuestion":{"id":2},"securityAnswer":"x"}'
      Response 201, challenge solved: the User model's email setter
      detects the payload. In the UI, the email is then redisplayed
      (account / orders) and the iframe runs.
      Defense: validate AND sanitize server-side (do not rely on the
      Angular validator); escape the email at render time instead of
      inserting it as HTML.
    pedagogical_intent: |
      Full solution: verified request, email setter, defense.
