challenge_key: "scoreBoardChallenge"
schema_version: "juicelab.hints.v1"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Une application web qui te propose des challenges de hacking doit bien
      garder une trace de qui a resolu quoi. Cette page existe forcement
      quelque part. Pourquoi ne te la donne-t-on pas spontanement ? Et si elle
      etait juste cachee plutot qu'absente ?
    text_en: |
      A web application that offers hacking challenges has to keep track of
      who solved what somewhere. That page must exist. Why isn't it shown to
      you upfront? What if it is hidden rather than absent?
    pedagogical_intent: |
      Activate the discovery reflex: a missing UI does not mean a missing route.

  N2:
    cost_pct: 10
    text_fr: |
      Dans une SPA Angular comme Juice Shop, toutes les routes du frontend
      sont declarees dans le bundle JavaScript livre au navigateur. Si un
      lien n'apparait pas dans le menu, le chemin est quand meme present
      dans le code charge cote client. Tes DevTools savent te montrer ce
      code.
    text_en: |
      In an Angular SPA like Juice Shop, every frontend route is declared in
      the JavaScript bundle delivered to the browser. If a link is missing
      from the menu, the path is still present in the code loaded
      client-side. Your DevTools can show you that code.
    pedagogical_intent: |
      Introduce the SPA / client-side routing model: routes shipped to the client.

  N3:
    cost_pct: 20
    text_fr: |
      Ouvre l'onglet Sources des DevTools, deroule le bundle principal
      (main.js ou un fichier proche), et utilise Ctrl-F pour chercher des
      mots evocateurs : "score", "score-board", "scoreBoard". Tu vas tomber
      sur la table de routage Angular et identifier le chemin vers la page
      cachee.
    text_en: |
      Open the DevTools Sources tab, expand the main bundle (main.js or
      similar), and use Ctrl-F to search for telling keywords: "score",
      "score-board", "scoreBoard". You will hit the Angular routing table
      and spot the path to the hidden page.
    pedagogical_intent: |
      Localize the surface: the JavaScript bundle and the routing table.

  N4:
    cost_pct: 35
    text_fr: |
      Les routes Angular sont declarees dans le bundle sous une forme
      du type { path: 'score-board', component: ... }. Le chemin est
      donc la concatenation de "score" et "board". Pas besoin de lien :
      tu peux taper directement le chemin dans la barre d'adresse,
      prefixe du diese qui marque les routes Angular (/#/).
    text_en: |
      Angular routes are declared in the bundle as { path:
      'score-board', component: ... }. The path is the concatenation
      of "score" and "board". No link needed: type the path directly
      in the address bar, prefixed by the hash that marks Angular
      routes (/#/).
    pedagogical_intent: |
      Give the exact route path and the direct-navigation method.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : ouvre
      http://127.0.0.1:3000/#/score-board et laisse la page se charger.
      Comme pour Admin Section et Privacy Policy, la validation n'est
      pas un appel API dedie : la page affiche tout en bas une image
      technique, assets/public/images/padding/1px.png
      (score-board.component.html:56), et le serveur resout le
      challenge sur la requete de cette image
      (routes/verify.ts:63, url se terminant par /1px.png).
      Defense : ne pas se reposer sur l'obscurite d'une route cliente
      pour cacher une page ; appliquer un controle d'acces reel cote
      serveur sur les ressources sensibles.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): open
      http://127.0.0.1:3000/#/score-board and let the page load. As
      with Admin Section and Privacy Policy, validation is not a
      dedicated API call: the page shows a technical image at the very
      bottom, assets/public/images/padding/1px.png
      (score-board.component.html:56), and the server solves the
      challenge on that image request (routes/verify.ts:63, url ending
      with /1px.png).
      Defense: do not rely on the obscurity of a client route to hide
      a page; enforce real server-side access control on sensitive
      resources.
    pedagogical_intent: |
      Full solution with the exact tracking-pixel mechanism and defense.
