challenge_key: "retrieveBlueprintChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "Check for products which seem
      like a natural fit for being based on a blueprint".
      Donc parcours le catalogue produits (/#/search) et
      identifie celui qui pourrait avoir un blueprint
      (typiquement un produit physique manufacture, comme un
      OWASP Juice Shop logo 3D ou un objet 3D-printed).
    text_en: |
      Official OWASP hint #1: "Check for products which seem
      like a natural fit for being based on a blueprint". So
      browse the catalog (/#/search) and identify the one
      that might have a blueprint (typically a physical
      manufactured product, like an OWASP Juice Shop logo 3D
      or a 3D-printed object).
    pedagogical_intent: |
      Direct toward physical-product candidates.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP officiel #2 : "pay attention to the images of
      the identified product candidates". Donc l'IMAGE
      contient un indice. Telecharge l'image du produit
      candidat (right-click + Save As ou inspecter via
      DevTools Network), puis inspecte ses metadata.
    text_en: |
      Official OWASP hint #2: "pay attention to the images of
      the identified product candidates". So the IMAGE has a
      clue. Download the candidate's image (right-click +
      Save As or inspect via DevTools Network), then inspect
      its metadata.
    pedagogical_intent: |
      Direct toward image inspection.

  N3:
    cost_pct: 20
    text_fr: |
      Telecharge l'image du produit candidat et lis ses metadonnees
      (exiftool, ou un lecteur EXIF en ligne). L'indice n'est pas un
      chemin cache : c'est le logiciel de creation. Le champ Make
      (IFD0) vaut OpenSCAD, un outil de modelisation 3D. Il confirme
      que ce produit est imprime en 3D et possede donc un fichier de
      modele (un blueprint) quelque part sur le serveur.
    text_en: |
      Download the candidate product's image and read its metadata
      (exiftool, or an online EXIF viewer). The clue is not a hidden
      path: it is the authoring software. The Make field (IFD0) is
      OpenSCAD, a 3D-modeling tool. It confirms this product is
      3D-printed and therefore has a model file (a blueprint)
      somewhere on the server.
    pedagogical_intent: |
      Correct the clue: it is the EXIF Make tag (OpenSCAD), not a path.

  N4:
    cost_pct: 35
    text_fr: |
      Le produit candidat est "OWASP Juice Shop Logo (3D-printed)"
      (image 3d_keychain.jpg). Hint OWASP #3 : le blueprint n'est PAS
      range dans /ftp/ comme les autres fichiers oublies. Il est
      servi parmi les ressources publiques des produits :
      /assets/public/images/products/. Le nom du fichier n'est pas
      dans l'EXIF ; deduis-le du produit (un modele .stl au nom du
      shop). La validation (routes/verify.ts:69) resout le challenge
      des que l'URL demandee se termine par ce fichier.
    text_en: |
      The candidate product is "OWASP Juice Shop Logo (3D-printed)"
      (image 3d_keychain.jpg). OWASP hint #3: the blueprint is NOT
      stored in /ftp/ like the other forgotten files. It is served
      among the products' public assets:
      /assets/public/images/products/. The file name is not in the
      EXIF; infer it from the product (an .stl model named after the
      shop). Validation (routes/verify.ts:69) solves the challenge as
      soon as the requested URL ends with that file.
    pedagogical_intent: |
      Give the product, where the file lives, and the solve condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
        http://127.0.0.1:3000/assets/public/images/products/JuiceShop.stl
      Ouvre cette URL (ou curl) : le fichier se telecharge et le
      challenge est resolu. Le nom JuiceShop.stl se deduit du produit
      3D ; l'EXIF (Make = OpenSCAD) ne fait que confirmer la piste 3D.
      Defense : ne pas exposer les fichiers sources/propriete
      intellectuelle sous un chemin public devinable ; les servir via
      un controle d'acces, et retirer des images publiees les
      metadonnees qui trahissent le processus de fabrication.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
        http://127.0.0.1:3000/assets/public/images/products/JuiceShop.stl
      Open this URL (or curl): the file downloads and the challenge is
      solved. The name JuiceShop.stl is inferred from the 3D product;
      the EXIF (Make = OpenSCAD) only confirms the 3D lead.
      Defense: do not expose source/IP files under a guessable public
      path; serve them behind access control, and strip from published
      images the metadata that reveals the manufacturing process.
    pedagogical_intent: |
      Full solution: verified URL, inference vs EXIF, defense.
