challenge_key: "emptyUserRegistration"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel unique : "Consider
      intercepting and playing with the request
      payload". Donc l'objectif est de bypass le
      validation cote frontend en intercepted la
      requete et la modified.
    text_en: |
      Official OWASP single hint: "Consider
      intercepting and playing with the request
      payload". So objective is bypass frontend
      validation by intercepting and modifying
      request.
    pedagogical_intent: |
      Activate frontend bypass reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Le formulaire /#/register cote Angular utilise
      Validators.required + Validators.email. Le
      submit button est disabled si email vide. Mais
      le serveur ne fait peut-etre PAS la meme
      validation. Test : envoie une requete avec
      email vide via curl ou Burp Repeater.
    text_en: |
      /#/register form Angular-side uses
      Validators.required + Validators.email. Submit
      button is disabled if empty email. But server
      maybe doesn't do same validation. Test: send
      request with empty email via curl or Burp
      Repeater.
    pedagogical_intent: |
      Spell test methodology.

  N3:
    cost_pct: 20
    text_fr: |
      Source serveur verifiee (routes/verify.ts:
      21-26) : `req.body.email === '' && req.body.
      password === ''`. Donc le serveur attend
      literalement EMPTY string pour les DEUX
      (email AND password). Note : `passwordRepeat`
      doit aussi matcher pour eviter de declencher
      passwordRepeatChallenge ; mets-le aussi a
      empty string.
    text_en: |
      Verified server source (routes/verify.ts:
      21-26): `req.body.email === '' && req.body.
      password === ''`. So server literally expects
      EMPTY string for BOTH (email AND password).
      Note: `passwordRepeat` must also match to
      avoid triggering passwordRepeatChallenge; set
      it to empty string too.
    pedagogical_intent: |
      Reveal exact server check.

  N4:
    cost_pct: 35
    text_fr: |
      Le formulaire envoie POST /api/Users. Tu dois reproduire cet
      appel hors de l'UI (Burp Repeater, onglet Network > "Edit and
      Resend", ou curl) avec un corps JSON ou email et password sont
      des chaines vides. Ni question de securite ni jeton ne sont
      exiges par le serveur : seuls email et password comptent pour
      la validation. Ajoute passwordRepeat vide lui aussi, pour ne
      pas resoudre passwordRepeatChallenge au passage.
    text_en: |
      The form sends POST /api/Users. Replay that call outside the
      UI (Burp Repeater, Network tab > "Edit and Resend", or curl)
      with a JSON body where email and password are empty strings.
      Neither a security question nor a token is required by the
      server: only email and password matter for validation. Add an
      empty passwordRepeat too, so you do not solve
      passwordRepeatChallenge along the way.
    pedagogical_intent: |
      Guided steps: replay tool, minimal body, side effect to avoid.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
        curl -s -X POST http://127.0.0.1:3000/api/Users \
          -H "Content-Type: application/json" \
          -d '{"email":"","password":"","passwordRepeat":""}'
      Reponse "status":"success" avec un utilisateur dont l'email est
      vide : le middleware verify.emptyUserRegistration (server.ts:422,
      routes/verify.ts:21-26) resout le challenge.
      Defense : valider cote serveur ce que le formulaire valide cote
      client (email non vide et bien forme, mot de passe non vide et
      conforme a la politique), par validators du modele User ou
      schema de requete. Une validation Angular ne protege que
      l'utilisateur honnete.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
        curl -s -X POST http://127.0.0.1:3000/api/Users \
          -H "Content-Type: application/json" \
          -d '{"email":"","password":"","passwordRepeat":""}'
      Response "status":"success" with a user whose email is empty:
      the verify.emptyUserRegistration middleware (server.ts:422,
      routes/verify.ts:21-26) solves the challenge.
      Defense: validate server-side what the form validates
      client-side (non-empty, well-formed email; non-empty password
      matching the policy), with User model validators or a request
      schema. Angular validation only protects the honest user.
    pedagogical_intent: |
      Full solution: verified minimal command, solving middleware,
      canonical server-side defense.
