challenge_key: "videoXssChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 te previent IMMEDIATEMENT : "Without
      utilizing the vulnerability behind another 6-star
      challenge it is not possible to plant the XSS payload".
      Donc tu DOIS avoir resolu un autre challenge difficulty 6
      avant de tenter celui-ci. Identifie les 6-stars : SSRF,
      SSTi, jwtForged, fileWrite, premiumPaywall,
      rceOccupyChallenge, ssrfChallenge, sstiChallenge,
      web3Wallet, easter, timing... Lequel donne une primitive
      d'ecriture sur le filesystem ?
    text_en: |
      Official OWASP hint #1 IMMEDIATELY warns: "Without
      utilizing the vulnerability behind another 6-star
      challenge it is not possible to plant the XSS payload".
      So you MUST have solved another difficulty-6 challenge
      before attempting this. Identify 6-stars: SSRF, SSTi,
      jwtForged, fileWrite, premiumPaywall, rceOccupyChallenge,
      ssrfChallenge, sstiChallenge, web3Wallet, easter,
      timing... Which gives a filesystem write primitive?
    pedagogical_intent: |
      Activate prerequisite reflex on 6-star challenges.

  N2:
    cost_pct: 10
    text_fr: |
      Le challenge 6 etoiles prerequis est l'ecriture de fichier
      arbitraire (Arbitrary File Write, fileWriteChallenge) : son
      primitive, un chemin de sortie non controle a l'upload, te
      permet d'ecrire ailleurs que prevu sur le serveur. Ce n'est PAS
      rceOccupy (un deni de service, sans primitive d'ecriture
      fiable). Ce que tu vas ecraser n'est pas la video : ce sont ses
      SOUS-TITRES.
    text_en: |
      The required 6-star challenge is Arbitrary File Write
      (fileWriteChallenge): its primitive, an uncontrolled output
      path at upload time, lets you write outside the intended place
      on the server. It is NOT rceOccupy (a denial of service, with
      no reliable write primitive). What you overwrite is not the
      video: it is its SUBTITLES.
    pedagogical_intent: |
      Correct the enabler (Arbitrary File Write) and the real target
      (subtitles).

  N3:
    cost_pct: 20
    text_fr: |
      La page promo injecte le contenu des sous-titres dans le HTML
      (routes/videoHandler.ts, views/promotionVideo.pug) a l'interieur
      d'un bloc <script id="subtitle" type="text/vtt">...</script>. Le
      fichier lu est owasp_promo.vtt, dans
      frontend/dist/frontend/assets/public/videos/. Comme le contenu
      est insere sans echappement, une sequence qui ferme le script et
      en ouvre un autre s'execute : c'est l'angle d'attaque.
    text_en: |
      The promo page injects the subtitle content into the HTML
      (routes/videoHandler.ts, views/promotionVideo.pug) inside a
      <script id="subtitle" type="text/vtt">...</script> block. The
      file read is owasp_promo.vtt, in
      frontend/dist/frontend/assets/public/videos/. Since the content
      is inserted without escaping, a sequence that closes the script
      and opens another one executes: that is the attack angle.
    pedagogical_intent: |
      Localize the sink (script block) and the exact file.

  N4:
    cost_pct: 35
    text_fr: |
      Le payload exact (description du challenge) est :
      </script><script>alert(`xss`)</script>
      Il doit se retrouver dans owasp_promo.vtt : le </script> ferme
      le bloc des sous-titres, le <script> suivant s'execute. La
      validation (videoHandler.ts, videoXssChallenge) ne regarde pas
      l'affichage : elle verifie que le contenu des sous-titres servis
      contient cette chaine exacte. Il te faut donc ecraser le .vtt
      via la primitive d'ecriture arbitraire.
    text_en: |
      The exact payload (challenge description) is:
      </script><script>alert(`xss`)</script>
      It must land inside owasp_promo.vtt: the </script> closes the
      subtitle block, the following <script> executes. Validation
      (videoHandler.ts, videoXssChallenge) does not look at rendering:
      it checks that the served subtitle content contains this exact
      string. So you must overwrite the .vtt via the arbitrary-write
      primitive.
    pedagogical_intent: |
      Give the exact payload, the sink and the real validation.

  N5:
    cost_pct: 50
    text_fr: |
      Marche a suivre (deduite du code ; chaine complete non rejouee
      pendant la revue du 2026-11-16) :
      1. Obtenir la primitive d'ecriture arbitraire via
         fileWriteChallenge (archive piegee dont une entree pointe hors
         du dossier d'extraction).
      2. S'en servir pour ecraser owasp_promo.vtt par un contenu VTT
         valide contenant le payload, par exemple :
           WEBVTT
           1
           00:00.000 --> 00:05.000
           </script><script>alert(`xss`)</script>
      3. Recharger la page promo : le bloc <script id="subtitle">
         contient desormais la chaine ; le challenge se valide.
      Hint OWASP #4 : une partie reste volontairement a tatons, c'est
      voulu. Defense : echapper le contenu des sous-titres a
      l'insertion (ne jamais injecter un texte brut dans un <script>),
      et empecher l'ecriture de fichiers hors d'un repertoire dedie
      (chemins d'extraction normalises et verifies).
    text_en: |
      Procedure (derived from code; the full chain was not replayed
      during the 2026-11-16 review):
      1. Obtain the arbitrary-write primitive via fileWriteChallenge
         (a crafted archive whose entry points outside the extraction
         folder).
      2. Use it to overwrite owasp_promo.vtt with valid VTT content
         containing the payload, for example:
           WEBVTT
           1
           00:00.000 --> 00:05.000
           </script><script>alert(`xss`)</script>
      3. Reload the promo page: the <script id="subtitle"> block now
         holds the string; the challenge is solved.
      OWASP hint #4: part of it stays intentionally blind. Defense:
      escape subtitle content on insertion (never inject raw text into
      a <script>), and prevent writing files outside a dedicated
      directory (normalized, verified extraction paths).
    pedagogical_intent: |
      Full chain with honest replay status and defense.
