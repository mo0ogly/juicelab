challenge_key: "loginBenderChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      La description du challenge dit explicitement "without previously
      changing his password, applying SQL Injection on another user, or
      hacking his Google account". Toute defense par auth Google ou
      reset etant exclue, qu'est-ce qui reste comme angle d'attaque
      sur un formulaire de login ?
    text_en: |
      The challenge description explicitly says "without previously
      changing his password, applying SQL Injection on another user,
      or hacking his Google account". With Google auth and password
      reset ruled out, what attack angle is left on a login form?
    pedagogical_intent: |
      Activate the elimination reflex via the OWASP wording itself.

  N2:
    cost_pct: 10
    text_fr: |
      Pour faire SQLi sur Bender, tu as besoin de son email — mais le
      shop ne te le donne pas spontanement. Sur quelles pages
      institutionnelles peut-on lire des messages publics signes par
      des utilisateurs ? Pense aux pages "vitrine" du marketing : About
      Us, Customer Feedback, Reviews.
    text_en: |
      To run SQLi against Bender, you need his email — but the shop
      does not hand it to you. On which institutional pages can you
      read public messages signed by users? Think about marketing
      "showcase" pages: About Us, Customer Feedback, Reviews.
    pedagogical_intent: |
      Localize the OSINT surface (institutional pages with attribution).

  N3:
    cost_pct: 20
    text_fr: |
      Va sur About Us. La page contient une carousel de user feedbacks.
      Cherche celui signe par Bender. Le rendu fait fuiter une partie
      visible de son email — assez pour deduire le pattern complet.
      Convention business : 90% des entreprises utilisent
      firstName@domain pour leurs emails internes.
    text_en: |
      Go to About Us. The page hosts a user-feedback carousel. Look
      for the one signed by Bender. The render leaks a visible part
      of his email — enough to deduce the full pattern. Business
      convention: 90% of companies use firstName@domain for internal
      email.
    pedagogical_intent: |
      Narrow OSINT surface to the exact element + give the email pattern.

  N4:
    cost_pct: 35
    text_fr: |
      L'email est bender@juice-sh.op. Le backend construit la requete
      de login en collant ta saisie dans la chaine (routes/login.ts) :
      SELECT * FROM Users WHERE email = '<input>' AND password =
      '<hash>' AND deletedAt IS NULL. Comment faire disparaitre tout
      ce qui suit l'email (le AND password et le AND deletedAt) en
      injectant dans le champ email ? Pense apostrophe pour fermer la
      chaine + commentaire SQL pour neutraliser la suite.
    text_en: |
      The email is bender@juice-sh.op. The backend builds the login
      query by concatenating your input into the string
      (routes/login.ts): SELECT * FROM Users WHERE email = '<input>'
      AND password = '<hash>' AND deletedAt IS NULL. How do you make
      everything after the email vanish (the AND password and the AND
      deletedAt) by injecting in the email field? Think single quote
      to close the string + SQL comment to neutralize the rest.
    pedagogical_intent: |
      Give the exact query and the syntactic shape of the bypass.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : champ
      email = bender@juice-sh.op'-- (apostrophe puis deux tirets, sans
      espace apres l'apostrophe), mot de passe quelconque, puis Login.
      La requete devient : SELECT * FROM Users WHERE email =
      'bender@juice-sh.op'-- AND password = '...' AND deletedAt IS
      NULL, ou le -- met en commentaire tout le controle du mot de
      passe ; tu es connecte comme Bender. Payload identique au
      tutoriel natif (loginBender.ts:101).
      Defense : (1) requetes parametrees (binding Sequelize) sur
      toutes les requetes de login. (2) MFA TOTP en second facteur :
      meme si la SQLi contourne le mot de passe, le MFA bloque la
      session. (3) limiter le debit des tentatives et alerter sur les
      motifs d'erreur SQL inhabituels.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): email
      field = bender@juice-sh.op'-- (single quote then two dashes, no
      space after the quote), any password, then Login. The query
      becomes: SELECT * FROM Users WHERE email =
      'bender@juice-sh.op'-- AND password = '...' AND deletedAt IS
      NULL, where -- comments out the entire password check; you are
      logged in as Bender. Same payload as the native tutorial
      (loginBender.ts:101).
      Defense: (1) parameterized queries (Sequelize binding) on all
      login queries. (2) MFA TOTP as a second factor: even if SQLi
      bypasses the password, MFA blocks the session. (3) rate-limit
      attempts and alert on unusual SQL error patterns.
    pedagogical_intent: |
      Full solution: verified payload, accurate reconstructed query,
      defense.
