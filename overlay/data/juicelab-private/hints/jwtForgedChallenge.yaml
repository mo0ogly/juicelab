challenge_key: "jwtForgedChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "explicitly not about
      acquiring the RSA private key". Donc
      l'attaquant n'a PAS la private key. Hint #3 :
      "Instead of enforcing no encryption to be
      applied, try to apply a more sophisticated
      exploit". Donc PAS alg=none (different de
      jwtUnsignedChallenge). C'est l'algorithm
      confusion attack.
    text_en: |
      Official OWASP hint #1: "explicitly not about
      acquiring the RSA private key". So attacker
      does NOT have private key. Hint #3: "Instead
      of enforcing no encryption to be applied, try
      to apply a more sophisticated exploit". So
      NOT alg=none (different from
      jwtUnsignedChallenge). It's algorithm
      confusion attack.
    pedagogical_intent: |
      Activate alg confusion attack reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #4 : "Getting your hands on the
      public RSA key the application employs for its
      JWTs is mandatory for this challenge". Donc tu
      DOIS d'abord obtenir la public key. Sources :
      (a) /encryptionkeys endpoint Juice Shop (visible
      via /ftp/), (b) bundle Angular (DevTools
      Sources, search 'BEGIN PUBLIC KEY'), (c) static
      assets path direct.
    text_en: |
      OWASP hint #4: "Getting your hands on the
      public RSA key the application employs for its
      JWTs is mandatory for this challenge". So you
      MUST first obtain public key. Sources: (a)
      /encryptionkeys endpoint Juice Shop (visible
      via /ftp/), (b) Angular bundle (DevTools
      Sources, search 'BEGIN PUBLIC KEY'), (c)
      direct static assets path.
    pedagogical_intent: |
      Spell public key sources.

  N3:
    cost_pct: 20
    text_fr: |
      Algorithm confusion mecanique : (1) Login pour
      obtenir un valid JWT. (2) Decode header
      (typiquement `{alg: "RS256", typ: "JWT"}`). (3)
      Modifier en `{alg: "HS256", typ: "JWT"}`
      (downgrade asymmetric -> symmetric). (4)
      Modifier payload pour `data.email = "rsa_lord@
      juice-sh.op"`. (5) Signer avec HS256 EN
      UTILISANT LA PUBLIC KEY RSA (raw bytes ou PEM
      encoded) comme HMAC secret. (6) Submit le
      forged JWT. La library jwt.verify() lit alg=
      HS256, utilise security.publicKey comme
      "secret", verifie HMAC = success.
    text_en: |
      Algorithm confusion mechanic: (1) Login to
      get valid JWT. (2) Decode header (typically
      `{alg: "RS256", typ: "JWT"}`). (3) Modify to
      `{alg: "HS256", typ: "JWT"}` (downgrade
      asymmetric -> symmetric). (4) Modify payload
      for `data.email = "rsa_lord@juice-sh.op"`. (5)
      Sign with HS256 USING THE RSA PUBLIC KEY (raw
      bytes or PEM encoded) as HMAC secret. (6)
      Submit forged JWT. Library jwt.verify() reads
      alg=HS256, uses security.publicKey as
      "secret", verifies HMAC = success.
    pedagogical_intent: |
      Spell forge mechanic + key reuse.

  N4:
    cost_pct: 35
    text_fr: |
      C'est une confusion d'algorithme (RS256 -> HS256). Le serveur
      verifie le token avec sa cle PUBLIQUE ; si tu signes un token en
      HS256 en utilisant cette cle publique comme secret HMAC, la
      verification passe. Recupere la cle publique de l'instance, servie
      a /encryptionkeys/jwt.pub, et signe un payload dont
      data.email = rsa_lord@juice-sh.op. Le serveur resout si
      l'algorithme est HS256 ET l'email correspond.
    text_en: |
      This is an algorithm confusion (RS256 -> HS256). The server
      verifies the token with its PUBLIC key; if you sign a token with
      HS256 using that public key as the HMAC secret, verification
      passes. Fetch the instance's public key, served at
      /encryptionkeys/jwt.pub, and sign a payload whose
      data.email = rsa_lord@juice-sh.op. The server solves if the
      algorithm is HS256 AND the email matches.
    pedagogical_intent: |
      Explain the RS256->HS256 key-confusion and the exact key source.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
        curl -s http://127.0.0.1:3000/encryptionkeys/jwt.pub -o jwt.pub
        node -e "const jwt=require('jsonwebtoken'),fs=require('fs');console.log(jwt.sign({data:{email:'rsa_lord@juice-sh.op'},iat:1583037711},fs.readFileSync('jwt.pub'),{algorithm:'HS256'}))"
      Envoie le token obtenu en Authorization: Bearer (ou via
      localStorage token). Important : la signature depend des OCTETS
      EXACTS de la cle publique de CETTE instance ; un token signe avec
      une autre cle (ou copie d'un autre build) ne se verifie pas.
      Challenge desactive sous Windows. Outils equivalents : extension
      Burp JWT Editor (key confusion), jwt_tool -X k.
      Defense : ne pas reutiliser la cle publique comme secret ;
      imposer une liste blanche d'algorithmes cote verification
      (interdire HS256 quand on attend RS256).
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
        curl -s http://127.0.0.1:3000/encryptionkeys/jwt.pub -o jwt.pub
        node -e "const jwt=require('jsonwebtoken'),fs=require('fs');console.log(jwt.sign({data:{email:'rsa_lord@juice-sh.op'},iat:1583037711},fs.readFileSync('jwt.pub'),{algorithm:'HS256'}))"
      Send the resulting token in Authorization: Bearer (or via
      localStorage token). Important: the signature depends on the
      EXACT bytes of THIS instance's public key; a token signed with
      another key (or copied from another build) will not verify.
      Challenge disabled on Windows. Equivalent tools: Burp JWT Editor
      extension (key confusion), jwt_tool -X k.
      Defense: do not reuse the public key as a secret; enforce an
      algorithm allowlist on verification (forbid HS256 when expecting
      RS256).
    pedagogical_intent: |
      Full solution: verified forge, key-byte sensitivity, Windows
      caveat, defense.
