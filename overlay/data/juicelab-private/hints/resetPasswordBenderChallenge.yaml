challenge_key: "resetPasswordBenderChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "If you have no idea who Bender
      is, please put down this book right now and watch the
      first episodes of Futurama before you come back". Donc
      Bender = personnage de Futurama. La security question
      concerne probablement une appartenance ou affiliation du
      personnage Bender.
    text_en: |
      Official OWASP hint #1: "If you have no idea who Bender
      is, please put down this book right now and watch the
      first episodes of Futurama before you come back". So
      Bender = Futurama character. Security question likely
      concerns a membership/affiliation of the Bender character.
    pedagogical_intent: |
      Activate pop-culture OSINT reflex on Futurama.

  N2:
    cost_pct: 10
    text_fr: |
      Sur /#/forgot-password, entre bender@juice-sh.op. La
      security question s'affiche. C'est typiquement quelque
      chose comme "Company you first work for as an adult?" ou
      similar. Va sur Wikipedia "Bender (Futurama)" + Futurama
      Fandom Wiki pour trouver la reponse canonique.
    text_en: |
      On /#/forgot-password, enter bender@juice-sh.op. Security
      question appears. Typically something like "Company you
      first work for as an adult?" or similar. Go to Wikipedia
      "Bender (Futurama)" + Futurama Fandom Wiki to find
      canonical answer.
    pedagogical_intent: |
      Spell forgot-password discovery + OSINT sources.

  N3:
    cost_pct: 20
    text_fr: |
      Sur /#/forgot-password, saisis bender@juice-sh.op : la question
      est "Company you first work for as an adult?". Bender est un
      robot de Futurama. Cherche, dans Futurama (episode pilote "Space
      Pilot 3000"), la societe liee a sa toute premiere intention
      professionnelle d'adulte.
    text_en: |
      On /#/forgot-password, enter bender@juice-sh.op: the question is
      "Company you first work for as an adult?". Bender is a Futurama
      robot. Look, in Futurama (pilot "Space Pilot 3000"), for the
      company tied to his very first adult career intention.
    pedagogical_intent: |
      Give the exact question and steer the OSINT at the pilot episode.

  N4:
    cost_pct: 35
    text_fr: |
      La societe est Stop'n'Drop, la cabine de suicide que Bender
      voulait rejoindre au debut de l'episode pilote. Hint OWASP #4 :
      si une reponse "correcte" est refusee, c'est une question
      d'orthographe. La valeur stockee contient des apostrophes et un
      n minuscule : attention a les reproduire exactement.
    text_en: |
      The company is Stop'n'Drop, the suicide booth Bender wanted to
      join at the start of the pilot. OWASP hint #4: if a "correct"
      answer is rejected, it is a spelling issue. The stored value
      contains apostrophes and a lowercase n: reproduce them exactly.
    pedagogical_intent: |
      Give the answer and warn about exact spelling.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : /#/forgot-password, email bender@juice-sh.op,
      question "Company you first work for as an adult?", reponse
      exacte Stop'n'Drop (deux apostrophes droites, n minuscule), puis
      un nouveau mot de passe. Reponse confirmee dans le code
      (routes/resetPassword.ts:59) ; question confirmee via
      /rest/user/security-question. Non rejouee pour preserver le
      compte seede. Hint OWASP #5 : le brute force est quasi
      impossible ici (reponse non standard).
      Defense : reset par jeton e-mail a usage unique ; ne pas fonder
      la recuperation de compte sur une anecdote publique du titulaire.
    text_en: |
      Solution: /#/forgot-password, email bender@juice-sh.op, question
      "Company you first work for as an adult?", exact answer
      Stop'n'Drop (two straight apostrophes, lowercase n), then a new
      password. Answer confirmed in the code
      (routes/resetPassword.ts:59); question confirmed via
      /rest/user/security-question. Not replayed to preserve the
      seeded account. OWASP hint #5: brute force is near impossible
      here (non-standard answer).
      Defense: single-use email-token reset; do not base account
      recovery on a public anecdote about the owner.
    pedagogical_intent: |
      Full solution: exact answer and spelling, source confirmation,
      defense.
