challenge_key: "noSqlCommandChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Le hint OWASP officiel #1 dit : "This challenge is essentially a
      stripped-down Denial of Service (DoS) attack". Mais le hint #4
      precise : "flooding the application with requests will not
      solve this challenge. That would probably just kill your
      server instance". Donc UN seul payload, pas du flooding. La
      categorie est NoSQL Injection (hint #3) — sur quel endpoint
      Juice Shop traite des donnees NoSQL ?
    text_en: |
      Official OWASP hint #1: "This challenge is essentially a
      stripped-down Denial of Service (DoS) attack". But hint #4
      adds: "flooding the application with requests will not solve
      this challenge. That would probably just kill your server
      instance". So ONE single payload, no flooding. The category
      is NoSQL Injection (hint #3) — on which Juice Shop endpoint
      is NoSQL data handled?
    pedagogical_intent: |
      Activate the single-payload DoS reflex on the NoSQL surface.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP officiel #2 : "OWASP Juice Shop uses a MongoDB
      derivate as its NoSQL database". MongoDB stocke les reviews
      produit (visibles sous chaque produit). Ouvre un produit avec
      l'onglet Network des DevTools : quelle requete charge ses
      reviews, et ou l'identifiant du produit apparait-il ? Quel
      operateur MongoDB permet d'executer du JavaScript COTE SERVEUR
      pour chaque document analyse ?
    text_en: |
      Official OWASP hint #2: "OWASP Juice Shop uses a MongoDB
      derivate as its NoSQL database". MongoDB stores product
      reviews (visible under each product). Open a product with the
      DevTools Network tab: which request loads its reviews, and
      where does the product id appear? Which MongoDB operator runs
      JavaScript SERVER-SIDE for each scanned document?
    pedagogical_intent: |
      Localize the surface by observation (Network tab) and hint $where.

  N3:
    cost_pct: 20
    text_fr: |
      Operateur $where. Il prend une string JavaScript et l'execute
      sur le serveur MongoDB pour CHAQUE document de la collection.
      C'est concu pour des conditions complexes mais offre
      litteralement un moteur d'execution arbitraire. Pour ce
      challenge, tu veux faire dormir le worker — quelle fonction
      JavaScript du runtime MongoDB consomme du temps sans crasher ?
    text_en: |
      $where operator. Takes a JavaScript string and runs it on the
      MongoDB server for EACH document in the collection. Designed
      for complex conditions but literally offers an arbitrary
      execution engine. For this challenge, you want to make the
      worker sleep — which JavaScript function in the MongoDB
      runtime consumes time without crashing?
    pedagogical_intent: |
      Connect $where to a sleep-style function.

  N4:
    cost_pct: 35
    text_fr: |
      La requete est GET /rest/products/<id>/reviews. Cote serveur
      (routes/showProductReviews.ts), l'id du chemin est concatene
      tel quel dans une string $where :
        { $where: 'this.product == ' + id }
      Tu ne remplaces donc pas un champ JSON : tu ecris du JavaScript
      a la place de l'id dans l'URL. Le runtime expose sleep(ms),
      plafonne a 2000 ms par appel, et l'id est tronque a 40
      caracteres. Le $where s'execute une fois PAR review : la duree
      totale est (nombre de reviews) x (ms). Le challenge se valide
      si la requete depasse 2000 ms.
    text_en: |
      The request is GET /rest/products/<id>/reviews. Server-side
      (routes/showProductReviews.ts), the path id is concatenated
      as-is into a $where string:
        { $where: 'this.product == ' + id }
      So you do not replace a JSON field: you write JavaScript in
      place of the id in the URL. The runtime exposes sleep(ms),
      capped at 2000 ms per call, and the id is truncated to 40
      characters. $where runs once PER review: total duration is
      (number of reviews) x (ms). The challenge solves when the
      request takes longer than 2000 ms.
    pedagogical_intent: |
      Give the syntactic shape: injection point in the URL path, the
      2000 ms cap and the per-document multiplier.

  N5:
    cost_pct: 50
    text_fr: |
      Payload complet (aucune authentification requise) :
        time curl -s -o /dev/null "http://127.0.0.1:3000/rest/products/sleep(200)/reviews"
      Le $where devient 'this.product == sleep(200)' et s'execute
      pour chaque review : avec les 28 reviews du jeu de donnees par
      defaut, la reponse prend environ 5,6 s (mesure en recette sur
      Juice Shop 19.2.1) et le challenge est resolu. Inutile de
      monter la valeur : sleep est plafonne a 2000 ms par appel et
      une valeur haute bloque ton instance pendant (28 x 2 s).
      Defense : (1) ne jamais concatener une entree dans $where ;
      desactiver l'execution JavaScript cote base. (2) Valider l'id
      (entier attendu : Number(req.params.id), comme le fait le code
      quand le challenge est desactive). (3) Timeout de requete au
      niveau du driver pour limiter l'impact DoS.
    text_en: |
      Full payload (no authentication required):
        time curl -s -o /dev/null "http://127.0.0.1:3000/rest/products/sleep(200)/reviews"
      $where becomes 'this.product == sleep(200)' and runs for every
      review: with the 28 reviews of the default dataset, the
      response takes about 5.6 s (measured during testing on Juice
      Shop 19.2.1) and the challenge is solved. No need for a higher
      value: sleep is capped at 2000 ms per call and a high value
      freezes your instance for (28 x 2 s).
      Defense: (1) never concatenate input into $where; disable
      server-side JavaScript execution in the database. (2) Validate
      the id (integer expected: Number(req.params.id), as the code
      does when the challenge is disabled). (3) Driver-level query
      timeout to limit DoS impact.
    pedagogical_intent: |
      Full solution: exact URL, measured duration, safety reason for a
      small value, canonical defense from the code itself.
