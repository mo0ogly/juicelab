challenge_key: "killChatbotChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #2 : "first get an
      understanding of how it works under the hood".
      Hint #3 : "third party, possibly open source
      library". Hint #4 : "dumpster dive the internet
      to get a hold of the bot's source". Donc :
      (a) le chatbot est une library externe,
      (b) le source est public (open source),
      (c) il faut le lire pour identifier la vuln.
    text_en: |
      Official OWASP hint #2: "first get an
      understanding of how it works under the
      hood". Hint #3: "third party, possibly open
      source library". Hint #4: "dumpster dive the
      internet to get a hold of the bot's source".
      So: (a) chatbot is external library, (b)
      source is public (open source), (c) must
      read it to identify vuln.
    pedagogical_intent: |
      Activate library source-code research reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Library cible : `juicy-chat-bot` (visible
      dans package.json ou via /ftp/package.json.
      bak si forgottenDevBackup resolu). Repo
      GitHub : github.com/bkimminich/juicy-chat-bot
      (ou similar). Lire le source pour identifier
      les fonctions exposees : bot.greet, bot.
      respond, bot.addUser. Cherche les eval,
      template literals, regex - les surfaces
      typiques de injection.
    text_en: |
      Target library: `juicy-chat-bot` (visible in
      package.json or via /ftp/package.json.bak if
      forgottenDevBackup solved). GitHub repo:
      github.com/bkimminich/juicy-chat-bot (or
      similar). Read source to identify exposed
      functions: bot.greet, bot.respond, bot.
      addUser. Look for eval, template literals,
      regex - typical injection surfaces.
    pedagogical_intent: |
      Spell library identification.

  N3:
    cost_pct: 20
    text_fr: |
      Vuln identifiee : la fonction `bot.greet(
      userId)` evalue le username comme template
      string (template literal `${...}`). Si tu
      change ton username via /rest/chatbot avec
      action=setname et un payload contenant
      `${...}` qui throw, le bot est mis en etat
      casse. La recovery testCommand utilise aussi
      greet -> meme exception -> double catch ->
      solve.
    text_en: |
      Identified vuln: `bot.greet(userId)` function
      evaluates username as template string
      (template literal `${...}`). If you change
      your username via /rest/chatbot with
      action=setname and payload containing `${...
      }` that throws, bot is put in broken state.
      Recovery testCommand also uses greet -> same
      exception -> double catch -> solve.
    pedagogical_intent: |
      Reveal injection mechanic.

  N4:
    cost_pct: 35
    text_fr: |
      Le chatbot construit sa logique en interpolant TON nom
      d'utilisateur (champ username du profil) dans du code
      (routes/chatbot.ts). Un username bien forme s'echappe de la chaine
      et redefinit le traitement des messages, par exemple en annulant
      la fonction qui repond (processQuery). Ensuite, des que tu discutes
      avec le bot, bot.respond leve une exception : le serveur resout
      killChatbot (chatbot.ts:127).
    text_en: |
      The chatbot builds its logic by interpolating YOUR username
      (profile username field) into code (routes/chatbot.ts). A
      well-crafted username breaks out of the string and redefines the
      message handling, for instance by nulling the responding function
      (processQuery). Then, as soon as you chat with the bot,
      bot.respond throws: the server solves killChatbot (chatbot.ts:127).
    pedagogical_intent: |
      Reveal the real vector: code injection via the profile username.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (payload du test natif) :
      1. Sur /#/profile, mets ton username a (exactement) :
         admin"); processQuery=null; users.addUser("1337", "test
         puis valide. Ce nom s'injecte dans le code du bot et met
         processQuery a null.
      2. Ouvre /#/chatbot et envoie quelques messages (par ex. "hi",
         "...", "bye").
      3. bot.respond echoue, le serveur repond "Remember to stay
         hydrated..." et resout le challenge (chatbot.ts:127).
      Vecteur confirme dans le code et le test cypress
      (test/cypress/e2e/chatbot.spec.ts) ; non rejoue de bout en bout
      pendant la revue (etat d'entrainement du bot).
      Defense : ne jamais interpoler une entree utilisateur dans du code
      execute ; isoler la configuration du bot des donnees utilisateur.
    text_en: |
      Solution (native test payload):
      1. On /#/profile, set your username to (exactly):
         admin"); processQuery=null; users.addUser("1337", "test
         then submit. This name injects into the bot code and sets
         processQuery to null.
      2. Open /#/chatbot and send a few messages (e.g. "hi", "...",
         "bye").
      3. bot.respond fails, the server replies "Remember to stay
         hydrated..." and solves the challenge (chatbot.ts:127).
      Vector confirmed in the code and the cypress test
      (test/cypress/e2e/chatbot.spec.ts); not replayed end-to-end during
      the review (bot training state).
      Defense: never interpolate user input into executed code; isolate
      the bot configuration from user data.
    pedagogical_intent: |
      Full solution: real username-injection payload, defense.
