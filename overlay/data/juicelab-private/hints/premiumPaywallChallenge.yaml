challenge_key: "premiumPaywallChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 + #4 : "You do not
      have to pay anything to unlock this
      challenge!" (repete 2 fois pour insistence).
      Hint #2 : "no inappropriate, self-written
      or misconfigured cryptographic library to be
      exploited here" - donc la cryptography est
      CORRECT, le problem est ailleurs.
    text_en: |
      Official OWASP hint #1 + #4: "You do not
      have to pay anything to unlock this
      challenge!" (repeated twice for emphasis).
      Hint #2: "no inappropriate, self-written
      or misconfigured cryptographic library to
      be exploited here" - so cryptography is
      CORRECT, problem is elsewhere.
    pedagogical_intent: |
      Activate non-crypto-bug reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #3 cite : "How much protection
      does a sturdy top-quality door lock add to
      your house if you put the key under the
      door mat?". Metaphore claire : la
      cryptography (door lock) est forte, mais
      la clef est CACHEE de maniere triviale
      (under the doormat). Cherche la clef AES
      dans le source / bundle.
    text_en: |
      OWASP hint #3 quoted: "How much
      protection does a sturdy top-quality door
      lock add to your house if you put the
      key under the door mat?". Clear metaphor:
      cryptography (door lock) is strong, but
      key HIDDEN trivially (under doormat).
      Search AES key in source / bundle.
    pedagogical_intent: |
      Spell key location method.

  N3:
    cost_pct: 20
    text_fr: |
      Sur /#/score-board, regarde la description
      du challenge "Premium Paywall". View
      Source HTML (Ctrl+U ou DevTools Elements
      tab). Tu verras un commentaire HTML caché :
      `<!--IvLuRfBJYlmStf9XfL6ckJFngyd9LfV1JaaN/
      KRTPQPidTuJ7FR+D/nkWJUF+0xUF07CeCeqYfxq+
      OJVVa0gNbqgYkUNvn//UbE7e95C+6e+7GtdpqJ8mqm4
      WcPvUGIUxmGLTTAC2+G9UuFCD1DUjg==-->`. C'est
      le ciphertext AES base64-encoded.
    text_en: |
      On /#/score-board, look at "Premium
      Paywall" challenge description. View
      Source HTML (Ctrl+U or DevTools Elements
      tab). You'll see hidden HTML comment:
      `<!--IvLuRfBJYlmStf9XfL6ckJFngyd9LfV1J
      aaN/KRTPQPidTuJ7FR+D/nkWJUF+0xUF07CeCeqY
      fxq+OJVVa0gNbqgYkUNvn//UbE7e95C+6e+7GtdpqJ
      8mqm4WcPvUGIUxmGLTTAC2+G9UuFCD1DUjg==-->`.
      It's AES base64-encoded ciphertext.
    pedagogical_intent: |
      Reveal ciphertext location.

  N4:
    cost_pct: 35
    text_fr: |
      Les hints OWASP sont explicites : "no inappropriate, self-written
      or misconfigured cryptographic library to be exploited here", et
      l'image de la "cle sous le paillasson". Ce n'est donc PAS une
      attaque crypto (pas d'AES a casser) : c'est de la securite par
      l'obscurite. L'URL secrete de la page premium est cachee en clair
      dans le code/les ressources livres au client ; il faut la trouver,
      pas la dechiffrer.
    text_en: |
      The OWASP hints are explicit: "no inappropriate, self-written or
      misconfigured cryptographic library to be exploited here", plus
      the "key under the doormat" image. So it is NOT a crypto attack
      (no AES to break): it is security through obscurity. The premium
      page's secret URL is hidden in plaintext in the code/assets
      delivered to the client; you must find it, not decrypt it.
    pedagogical_intent: |
      Correct the mechanism: obscurity, not cryptography.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (URL verifiee en recette sur Juice Shop 19.2.1) :
      fouille les ressources cote client (bundles JS, fichiers servis
      sous des chemins devinables) pour reperer un chemin anormalement
      long et explicite. Il se termine par la plaisanterie sur le
      paiement d'1 BTC. L'ouvrir suffit a resoudre le challenge
      (routes/premiumReward.ts) :
        GET /this/page/is/hidden/behind/an/incredibly/high/paywall/that/could/only/be/unlocked/by/sending/1btc/to/us
      La page renvoie un fond d'ecran "premium" ; aucun paiement n'est
      requis (hint OWASP #1).
      Defense : ne pas proteger une ressource par le simple secret de
      son URL ; appliquer un vrai controle d'acces cote serveur.
    text_en: |
      Solution (URL verified during testing on Juice Shop 19.2.1):
      search the client-side resources (JS bundles, files served under
      guessable paths) for an abnormally long, explicit path. It ends
      with the joke about paying 1 BTC. Opening it is enough to solve
      the challenge (routes/premiumReward.ts):
        GET /this/page/is/hidden/behind/an/incredibly/high/paywall/that/could/only/be/unlocked/by/sending/1btc/to/us
      The page returns a "premium" wallpaper; no payment is required
      (OWASP hint #1).
      Defense: do not protect a resource by the secrecy of its URL
      alone; enforce real server-side access control.
    pedagogical_intent: |
      Full solution: the hidden URL, no-crypto framing, defense.
