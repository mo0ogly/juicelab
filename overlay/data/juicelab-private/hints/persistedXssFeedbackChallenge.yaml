challenge_key: "persistedXssFeedbackChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "The Comment field in the Customer
      Feedback screen is where you want to put your focus on".
      Va sur Customer Feedback (/#/contact). Le field Comment
      est ta cible. Mais hint #3 te previent : "the attack
      payload will not be rejected by any validator but stripped
      from the comment before persisting it". Donc le serveur
      strip le payload — il ne le rejette pas, il le transforme.
    text_en: |
      Official OWASP hint #1: "The Comment field in the Customer
      Feedback screen is where you want to put your focus on".
      Go to Customer Feedback (/#/contact). Comment field is
      your target. But hint #3 warns: "the attack payload will
      not be rejected by any validator but stripped from the
      comment before persisting it". So the server strips the
      payload — doesn't reject, transforms.
    pedagogical_intent: |
      Pin the field + signal strip-not-reject behavior.

  N2:
    cost_pct: 10
    text_fr: |
      Le mot cle du titre est "server-side" : ce n'est pas un
      validateur cote navigateur qu'il faut contourner, mais un
      nettoyage applique par le serveur avant l'enregistrement. Le
      hint OWASP #4 oriente vers package.json.bak (recupere via un
      challenge de divulgation de fichier) pour identifier la
      bibliotheque de nettoyage utilisee. Ce n'est pas un pre-requis
      technique : c'est la facon realiste de decouvrir la cible.
    text_en: |
      The key word in the title is "server-side": it is not a
      browser-side validator you must bypass, but a cleanup applied
      by the server before persisting. OWASP hint #4 points to
      package.json.bak (recovered through a file-disclosure
      challenge) to identify the sanitizing library. It is not a
      technical precondition: it is the realistic way to discover the
      target.
    pedagogical_intent: |
      Reframe to the server-side cleanup and the role of package.json.bak.

  N3:
    cost_pct: 20
    text_fr: |
      Dans package.json.bak, la dependance de nettoyage est
      "sanitize-html": "1.4.2". Cette version ancienne nettoie en un
      seul passage, sans re-verifier son resultat : une balise
      imbriquee de maniere a ce que le retrait d'un tag interne
      reconstitue le tag voulu passe au travers. C'est une mutation
      XSS. Cherche la forme d'imbrication qui, apres un seul retrait,
      laisse exactement la balise cible.
    text_en: |
      In package.json.bak, the sanitizing dependency is
      "sanitize-html": "1.4.2". This old version cleans in a single
      pass, without re-checking its result: a tag nested so that
      removing an inner tag reconstitutes the intended tag slips
      through. This is a mutation XSS. Look for the nesting shape
      that, after one removal, leaves exactly the target tag.
    pedagogical_intent: |
      Name the exact library/version and the single-pass weakness.

  N4:
    cost_pct: 35
    text_fr: |
      La cible a persister (description du challenge) est exactement :
      <iframe src="javascript:alert(`xss`)">
      Contre sanitize-html 1.4.2, double la balise d'ouverture :
      <<iframe>iframe src="javascript:alert(`xss`)">
      Le nettoyeur retire le <iframe> interne et laisse exactement la
      chaine cible. La validation (models/feedback.ts) ne verifie pas
      que l'alerte s'affiche : elle verifie que le commentaire STOCKE
      (apres nettoyage) contient cette chaine exacte.
    text_en: |
      The target to persist (challenge description) is exactly:
      <iframe src="javascript:alert(`xss`)">
      Against sanitize-html 1.4.2, double the opening tag:
      <<iframe>iframe src="javascript:alert(`xss`)">
      The sanitizer removes the inner <iframe> and leaves exactly the
      target string. Validation (models/feedback.ts) does not check
      that the alert fires: it checks that the STORED comment (after
      cleanup) contains this exact string.
    pedagogical_intent: |
      Give the exact payload and the real validation condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (payload verifie contre sanitize-html 1.4.2 : il
      produit exactement la chaine cible) :
      1. Sur /#/contact (Customer Feedback), champ Comment, saisis :
         <<iframe>iframe src="javascript:alert(`xss`)">
      2. Remplis la note et le captcha, puis envoie.
      3. Ouvre /#/about (About Us) ou les feedbacks sont affiches.
      Le commentaire stocke vaut desormais la balise iframe exacte ;
      le challenge est resolu (hint OWASP #5 : si une alerte
      apparait sans que le challenge se valide, c'est que la chaine
      stockee n'est pas exactement celle attendue).
      Defense : mettre a jour sanitize-html, ou nettoyer en plusieurs
      passes jusqu'a point fixe ; mieux, echapper le contenu a
      l'affichage plutot que d'autoriser du HTML dans un commentaire.
    text_en: |
      Solution (payload verified against sanitize-html 1.4.2: it
      produces exactly the target string):
      1. On /#/contact (Customer Feedback), Comment field, enter:
         <<iframe>iframe src="javascript:alert(`xss`)">
      2. Fill in the rating and captcha, then submit.
      3. Open /#/about (About Us) where feedback is displayed.
      The stored comment now equals the exact iframe tag; the
      challenge is solved (OWASP hint #5: if an alert shows but the
      challenge does not solve, the stored string is not exactly the
      expected one).
      Defense: upgrade sanitize-html, or sanitize in multiple passes
      to a fixed point; better, escape content at render time rather
      than allowing HTML in a comment.
    pedagogical_intent: |
      Full solution: verified payload, exact-string validation, defense.
