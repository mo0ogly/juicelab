challenge_key: "loginJimChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Login Jim ressemble a Login Bender. La mecanique d'attaque finale
      sera la meme (SQLi sur login). Mais la source d'OSINT pour
      decouvrir l'email est differente. Indice : About Us t'a aide
      pour Bender — quelle autre surface UI affiche du texte ecrit
      DIRECTEMENT par les utilisateurs ?
    text_en: |
      Login Jim looks like Login Bender. The final attack mechanic
      is identical (SQLi on login). But the OSINT source to find
      the email differs. Hint: About Us helped for Bender — what
      other UI surface displays text written DIRECTLY by users?
    pedagogical_intent: |
      Build on prior knowledge (Bender) and pivot to a new OSINT class.

  N2:
    cost_pct: 10
    text_fr: |
      User-generated content : feedback (page About Us), product
      reviews (sous chaque produit dans le catalogue), Q&A,
      commentaires. Sur Juice Shop, c'est sous chaque produit que tu
      trouveras les reviews — clique sur un produit pour ouvrir son
      dialog de details.
    text_en: |
      User-generated content: feedback (About Us page), product
      reviews (under each catalog product), Q&A, comments. On
      Juice Shop, reviews live under each product — click a product
      to open its details dialog.
    pedagogical_intent: |
      Localize the OSINT surface (product details dialog → reviews).

  N3:
    cost_pct: 20
    text_fr: |
      Ouvre plusieurs produits et lis la section Reviews du dialog de
      details : l'auteur d'un avis est affiche avec son email complet.
      Des que tu vois jim@juice-sh.op (par exemple sur l'avis d'un
      sticker ou d'un patch), tu as sa cible. Le tutoriel natif fait
      exactement ce parcours (loginJim.ts, etape "user reviews").
    text_en: |
      Open several products and read the Reviews section of the
      details dialog: a review's author is shown with its full email.
      As soon as you see jim@juice-sh.op (for instance on a sticker or
      patch review), you have the target. The native tutorial follows
      exactly this path (loginJim.ts, "user reviews" step).
    pedagogical_intent: |
      Point at the real leak (review author email) and the tutorial.

  N4:
    cost_pct: 35
    text_fr: |
      La convention d'emails donne presque toujours prenom@domaine
      (hint OWASP : "smart-guess Jim's email"), confirme par les avis :
      jim@juice-sh.op. La SQLi est identique a Bender : le backend
      construit SELECT * FROM Users WHERE email = '<input>' AND
      password = '<hash>' AND deletedAt IS NULL (routes/login.ts).
      Ferme la chaine de l'email avec une apostrophe puis commente la
      suite.
    text_en: |
      The email convention is almost always firstname@domain (OWASP
      hint: "smart-guess Jim's email"), confirmed by the reviews:
      jim@juice-sh.op. The SQLi is identical to Bender: the backend
      builds SELECT * FROM Users WHERE email = '<input>' AND password
      = '<hash>' AND deletedAt IS NULL (routes/login.ts). Close the
      email string with a single quote then comment out the rest.
    pedagogical_intent: |
      Confirm the email and reuse the exact query/bypass.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : champ
      email = jim@juice-sh.op'-- (apostrophe puis deux tirets, sans
      espace apres l'apostrophe), mot de passe quelconque, puis Login.
      La requete devient SELECT * FROM Users WHERE email =
      'jim@juice-sh.op'-- AND password = '...' AND deletedAt IS NULL ;
      le -- commente le controle du mot de passe et tu es connecte
      comme Jim. Payload identique au tutoriel natif (loginJim.ts:90).
      Defense : (1) requetes parametrees (binding Sequelize) sur les
      requetes de login. (2) MFA TOTP en second facteur. (3) limiter
      le debit des tentatives et bloquer le compte apres des echecs
      repetes.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): email
      field = jim@juice-sh.op'-- (single quote then two dashes, no
      space after the quote), any password, then Login. The query
      becomes SELECT * FROM Users WHERE email = 'jim@juice-sh.op'--
      AND password = '...' AND deletedAt IS NULL; the -- comments out
      the password check and you are logged in as Jim. Same payload as
      the native tutorial (loginJim.ts:90).
      Defense: (1) parameterized queries (Sequelize binding) on login
      queries. (2) MFA TOTP as a second factor. (3) rate-limit
      attempts and lock the account after repeated failures.
    pedagogical_intent: |
      Full solution: verified payload, accurate query, defense.
