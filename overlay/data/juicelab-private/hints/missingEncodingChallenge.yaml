challenge_key: "missingEncodingChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "Check the Photo Wall
      for an image that could not be loaded
      correctly". Naviguer /#/photo-wall et trouver
      une image qui ne charge pas (404/broken).
      Hint #2 : "(literally) inspect the problem"
      = inspecter avec DevTools.
    text_en: |
      Official OWASP hint #1: "Check the Photo Wall
      for an image that could not be loaded
      correctly". Navigate /#/photo-wall and find
      image that doesn't load (404/broken). Hint
      #2: "(literally) inspect the problem" =
      inspect with DevTools.
    pedagogical_intent: |
      Activate UI exploration reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Sur /#/photo-wall, une entree n'affiche pas son image (vignette
      cassee) : c'est la photo du chat de Bjoern en "melee combat-
      mode". Ouvre l'inspecteur (Elements) et lis l'attribut src de
      la balise img. Le nom du fichier contient des caracteres
      inhabituels, dont des dieses (#) et un petit dessin fait de
      symboles unicode.
    text_en: |
      On /#/photo-wall, one entry does not show its image (broken
      thumbnail): it is the photo of Bjoern's cat in "melee combat-
      mode". Open the inspector (Elements) and read the img tag's src
      attribute. The file name contains unusual characters, including
      hash signs (#) and a small drawing made of unicode symbols.
    pedagogical_intent: |
      Localize the broken image and point at the odd characters.

  N3:
    cost_pct: 20
    text_fr: |
      Dans une URL, le diese (#) marque le debut du fragment (RFC
      3986) : le navigateur coupe tout ce qui suit le premier # avant
      d'envoyer sa requete au serveur. Le serveur recoit donc un
      chemin tronque et renvoie une erreur : l'image ne charge pas.
      Pour que le # fasse partie du nom de fichier, il doit etre
      encode en %23. Hint OWASP #3 : le bouton Tweet de l'entree
      encode l'URL correctement, ce qui te donne la forme attendue.
    text_en: |
      In a URL, the hash (#) marks the start of the fragment (RFC
      3986): the browser drops everything after the first # before
      sending its request to the server. The server thus receives a
      truncated path and returns an error: the image does not load.
      For the # to be part of the file name it must be encoded as
      %23. OWASP hint #3: the entry's Tweet button encodes the URL
      correctly, which gives you the expected form.
    pedagogical_intent: |
      Explain why the image breaks (fragment separator) and the fix.

  N4:
    cost_pct: 35
    text_fr: |
      La validation (routes/verify.ts:71) resout le challenge pour
      toute URL se terminant (en minuscules) par le nom de fichier
      entierement encode : les symboles unicode en %E1%..., chaque #
      en %23, et le suffixe
      -%23zatschi-%23whoneedsfourlegs-1572600969477.jpg. Il te suffit
      donc de demander l'image avec ce nom correctement encode.
    text_en: |
      Validation (routes/verify.ts:71) solves the challenge for any
      URL ending (lowercased) with the fully encoded file name: the
      unicode symbols as %E1%..., each # as %23, and the suffix
      -%23zatschi-%23whoneedsfourlegs-1572600969477.jpg. So you just
      need to request the image with this correctly encoded name.
    pedagogical_intent: |
      State the exact server condition without needing the raw glyphs.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : ouvre
      dans la barre d'adresse
        http://127.0.0.1:3000/assets/public/images/uploads/%E1%93%9A%E1%98%8F%E1%97%A2-%23zatschi-%23whoneedsfourlegs-1572600969477.jpg
      L'image (le chat) s'affiche et le challenge est resolu.
      Equivalent sans copier l'URL : clique le bouton Tweet de
      l'entree cassee, Twitter encode l'URL, copie-la depuis l'onglet
      ouvert et colle-la dans le navigateur.
      Defense : encoder systematiquement les noms de fichiers et les
      parametres d'URL (encodeURIComponent cote client, echappement
      cote gabarit) pour qu'un caractere reserve comme # ne casse pas
      la requete.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): open in
      the address bar
        http://127.0.0.1:3000/assets/public/images/uploads/%E1%93%9A%E1%98%8F%E1%97%A2-%23zatschi-%23whoneedsfourlegs-1572600969477.jpg
      The image (the cat) shows and the challenge is solved.
      Without copying the URL: click the broken entry's Tweet button,
      Twitter encodes the URL, copy it from the opened tab and paste
      it into the browser.
      Defense: always encode file names and URL parameters
      (encodeURIComponent client-side, template escaping) so a
      reserved character like # cannot break the request.
    pedagogical_intent: |
      Full solution: verified encoded URL and Tweet-button path,
      defense.
