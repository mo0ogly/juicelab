challenge_key: "resetPasswordBjoernOwaspChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Cible : le compte OWASP de Bjoern, bjoern@owasp.org (distinct du
      compte interne bjoern@juice-sh.op et du compte Google
      bjoern.kimminich@gmail.com, qui lui n'a pas de question secrete).
      Hint OWASP #1 : la reponse se trouve en cherchant Bjoern sur
      Internet.
    text_en: |
      Target: Bjoern's OWASP account, bjoern@owasp.org (distinct from
      the internal account bjoern@juice-sh.op and from the Google
      account bjoern.kimminich@gmail.com, which has no security
      question). OWASP hint #1: the answer is found by looking Bjoern
      up online.
    pedagogical_intent: |
      Fix the exact target email and distinguish the three accounts.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #2, specifique : Bjoern s'est "doxxe" lui-meme en
      mentionnant sa reponse au moins une fois DEVANT UNE CAMERA.
      Cherche donc des VIDEOS (talks de conference), pas des profils
      sociaux. Sur /#/forgot-password, saisis bjoern@owasp.org pour
      voir la question.
    text_en: |
      OWASP hint #2, specific: Bjoern "doxxed" himself by mentioning
      his answer at least once ON CAMERA. So look for VIDEOS
      (conference talks), not social profiles. On /#/forgot-password,
      enter bjoern@owasp.org to see the question.
    pedagogical_intent: |
      Point the OSINT at recorded talks, not social media.

  N3:
    cost_pct: 20
    text_fr: |
      La question est "Name of your favorite pet?". Cherche sur
      YouTube "Bjoern Kimminich" + OWASP / AppSec / Juice Shop :
      Bjoern mentionne le nom de son animal dans un talk. La reponse
      est un nom propre court.
    text_en: |
      The question is "Name of your favorite pet?". Search YouTube
      for "Bjoern Kimminich" + OWASP / AppSec / Juice Shop: Bjoern
      mentions his pet's name in a talk. The answer is a short proper
      name.
    pedagogical_intent: |
      Give the exact question and the video-OSINT query.

  N4:
    cost_pct: 35
    text_fr: |
      La reponse configuree est Zaya. La validation
      (routes/resetPassword.ts:62) exige user BjoernOwasp ET answer
      exactement "Zaya". Hint OWASP #3 : si tu ne trouves pas la video,
      le brute force est envisageable avec une liste etendue de noms
      d'animaux courants.
    text_en: |
      The configured answer is Zaya. Validation
      (routes/resetPassword.ts:62) requires user BjoernOwasp AND answer
      exactly "Zaya". OWASP hint #3: if you cannot find the video,
      brute force is feasible with an extensive list of common pet
      names.
    pedagogical_intent: |
      Pin the exact answer and the validation condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : /#/forgot-password, email bjoern@owasp.org, question
      "Name of your favorite pet?", reponse Zaya, puis un nouveau mot
      de passe. Reponse confirmee dans le code (resetPassword.ts:62) ;
      email et question confirmes via
      /rest/user/security-question?email=bjoern@owasp.org (le compte
      gmail ne renvoie aucune question). Non rejouee pour preserver le
      compte seede.
      Defense : un secret revele publiquement (ici en video) n'est
      plus un secret ; reset par jeton e-mail a usage unique et
      questions secretes a bannir.
    text_en: |
      Solution: /#/forgot-password, email bjoern@owasp.org, question
      "Name of your favorite pet?", answer Zaya, then a new password.
      Answer confirmed in the code (resetPassword.ts:62); email and
      question confirmed via
      /rest/user/security-question?email=bjoern@owasp.org (the gmail
      account returns no question). Not replayed to preserve the
      seeded account.
      Defense: a secret revealed publicly (here on video) is no longer
      a secret; single-use email-token reset and avoid security
      questions.
    pedagogical_intent: |
      Full solution: corrected email, exact answer, source
      confirmation, defense.
