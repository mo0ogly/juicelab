challenge_key: "easterEggLevelTwoChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #2 : "Make sure you
      solve Find the hidden easter egg first".
      Donc pre-requis : easterEggLevelOneChallenge
      resolu (acces a /ftp/eastere.gg via null
      byte bypass). Le contenu de eastere.gg
      donne l'indice pour ce challenge.
    text_en: |
      Official OWASP hint #2: "Make sure you
      solve Find the hidden easter egg first".
      So prerequisite:
      easterEggLevelOneChallenge solved (
      /ftp/eastere.gg access via null byte
      bypass). eastere.gg content gives clue
      for this challenge.
    pedagogical_intent: |
      Activate composition reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Lire /ftp/eastere.gg (apres null byte
      bypass : `GET /ftp/eastere.gg%00.md`). Le
      content typique inclut un message
      decoratif + une URL string que tu DOIS
      DECODER. La string utilise une simple
      cipher (Caesar/ROT family). Hint OWASP
      #1 : "tough-as-nails encryption" est
      ironique.
    text_en: |
      Read /ftp/eastere.gg (after null byte
      bypass: `GET /ftp/eastere.gg%00.md`).
      Typical content includes decorative
      message + URL string YOU MUST DECODE.
      String uses simple cipher (Caesar/ROT
      family). OWASP hint #1: "tough-as-
      nails encryption" is ironic.
    pedagogical_intent: |
      Spell investigation method.

  N3:
    cost_pct: 20
    text_fr: |
      Le cipher est ROT13 (Caesar avec
      rotation 13). Tools : tr (Unix), CyberChef
      (web), Python `codecs.decode("...","
      rot13")`. Source verifiee (lib/antiCheat.
      ts:34) : la URL ROT13-encoded est `/gur/
      qrif/ner/fb/shaal/gurl/uvq/na/rnfgre/
      rtt/jvguva/gur/rnfgre/rtt`. Decode en
      `/the/devs/are/so/funny/they/hid/an/
      easter/egg/within/the/easter/egg`.
    text_en: |
      Cipher is ROT13 (Caesar with rotation
      13). Tools: tr (Unix), CyberChef (web),
      Python `codecs.decode("...","rot13")`.
      Verified source (lib/antiCheat.ts:34):
      ROT13-encoded URL is `/gur/qrif/ner/
      fb/shaal/gurl/uvq/na/rnfgre/rtt/jvguva
      /gur/rnfgre/rtt`. Decodes to `/the/
      devs/are/so/funny/they/hid/an/easter/
      egg/within/the/easter/egg`.
    pedagogical_intent: |
      Reveal cipher + decoded URL.

  N4:
    cost_pct: 35
    text_fr: |
      Le fichier /ftp/eastere.gg (obtenu via easterEggLevelOne) se
      moque de toi puis donne la vraie piste sous forme d'une chaine.
      Cette chaine est encodee en Base64 ; une fois decodee, tu obtiens
      un chemin, mais chiffre par substitution ROT13. "Advanced
      cryptanalysis" est ironique : c'est du Base64 puis du ROT13,
      rien de plus. Decode dans cet ordre pour obtenir l'URL reelle.
    text_en: |
      The file /ftp/eastere.gg (obtained via easterEggLevelOne) mocks
      you then gives the real lead as a string. That string is Base64-
      encoded; once decoded, you get a path, but ciphered with the
      ROT13 substitution. "Advanced cryptanalysis" is ironic: it is
      Base64 then ROT13, nothing more. Decode in that order to get the
      real URL.
    pedagogical_intent: |
      Give the exact two-step decode (Base64 then ROT13).

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
      1. Decode Base64 de la chaine de eastere.gg ->
         /gur/qrif/ner/fb/shaal/gurl/uvq/na/rnfgre/rtt/jvguva/gur/rnfgre/rtt
      2. ROT13 de ce chemin :
         echo "/gur/qrif/..." | tr 'A-Za-z' 'N-ZA-Mn-za-m'
         -> /the/devs/are/so/funny/they/hid/an/easter/egg/within/the/easter/egg
      3. Ouvre cette URL : GET http://127.0.0.1:3000/the/devs/are/so/funny/they/hid/an/easter/egg/within/the/easter/egg
      Le serveur (routes/easterEgg.ts:13) resout le challenge et sert la
      demo 3D (threejs).
      Defense : cacher une ressource derriere un encodage/ROT13 n'est
      pas une protection ; appliquer un controle d'acces reel.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
      1. Base64-decode the string from eastere.gg ->
         /gur/qrif/ner/fb/shaal/gurl/uvq/na/rnfgre/rtt/jvguva/gur/rnfgre/rtt
      2. ROT13 that path:
         echo "/gur/qrif/..." | tr 'A-Za-z' 'N-ZA-Mn-za-m'
         -> /the/devs/are/so/funny/they/hid/an/easter/egg/within/the/easter/egg
      3. Open the URL: GET http://127.0.0.1:3000/the/devs/are/so/funny/they/hid/an/easter/egg/within/the/easter/egg
      The server (routes/easterEgg.ts:13) solves the challenge and
      serves the 3D demo (threejs).
      Defense: hiding a resource behind an encoding/ROT13 is not
      protection; enforce real access control.
    pedagogical_intent: |
      Full solution: Base64+ROT13 steps and the final URL.
