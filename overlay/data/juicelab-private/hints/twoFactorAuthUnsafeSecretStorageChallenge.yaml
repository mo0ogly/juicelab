challenge_key: "twoFactorAuthUnsafeSecretStorageChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "The 2FA implementation
      requires to store a secret for every user. You will
      need to find a way to access this secret". Donc le
      bug est sur le STOCKAGE du shared secret TOTP. Hint
      #3 : la composante "critically sensitive" du TOTP
      est le shared secret (RFC 6238). Cible : wurstbrot@
      juice-sh.op (verifie via routes/2fa.ts ligne 44).
    text_en: |
      Official OWASP hint #1: "The 2FA implementation
      requires to store a secret for every user. You will
      need to find a way to access this secret". So bug
      is on TOTP shared secret STORAGE. Hint #3: TOTP's
      "critically sensitive" component is shared secret
      (RFC 6238). Target: wurstbrot@juice-sh.op (verified
      via routes/2fa.ts line 44).
    pedagogical_intent: |
      Activate TOTP shared-secret reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #4 : "Solving the challenge Retrieve a
      list of all user credentials via SQL Injection
      before tackling this one will definitely help".
      Donc pre-requis : unionSqlInjectionChallenge. Mais
      "it will not carry you all the way" — la SQLi est
      necessaire mais insuffisante. Que faut-il en plus ?
      Reflechis a comment generer un code TOTP a partir
      du secret stocke.
    text_en: |
      OWASP hint #4: "Solving the challenge Retrieve a
      list of all user credentials via SQL Injection
      before tackling this one will definitely help". So
      prerequisite: unionSqlInjectionChallenge. But "it
      will not carry you all the way" — SQLi is
      necessary but insufficient. What else? Think about
      how to generate TOTP code from stored secret.
    pedagogical_intent: |
      Spell prerequisite + reveal multi-step kill chain.

  N3:
    cost_pct: 20
    text_fr: |
      Workflow tooling : (a) SQLi UNION SELECT id, email,
      password, totpSecret FROM Users WHERE email = '
      wurstbrot@juice-sh.op'. Tu obtiens le hash bcrypt +
      le totpSecret en clair (en base32, ex.
      "JBSWY3DPEHPK3PXP"). (b) Crack le hash avec hashcat
      -m 3200 + rockyou.txt -> password en clair. (c)
      Importe le totpSecret dans Google Authenticator
      (manual entry, type Time-based) OU genere le code
      avec : `node -e "const otplib =
      require('otplib'); console.log(otplib.authenticator.
      generate('JBSWY3DPEHPK3PXP'))"`.
    text_en: |
      Tooling workflow: (a) SQLi UNION SELECT id, email,
      password, totpSecret FROM Users WHERE email = '
      wurstbrot@juice-sh.op'. You get bcrypt hash +
      cleartext totpSecret (in base32, e.g.,
      "JBSWY3DPEHPK3PXP"). (b) Crack hash with hashcat
      -m 3200 + rockyou.txt -> cleartext password. (c)
      Import totpSecret in Google Authenticator (manual
      entry, type Time-based) OR generate code with:
      `node -e "const otplib =
      require('otplib'); console.log(otplib.authenticator.
      generate('JBSWY3DPEHPK3PXP'))"`.
    pedagogical_intent: |
      Spell tooling for each step.

  N4:
    cost_pct: 35
    text_fr: |
      Le defaut vise est le STOCKAGE du secret TOTP : Juice Shop garde
      totpSecret en clair dans la table Users (routes/2fa.ts le lit tel
      quel), au lieu de le chiffrer. Une injection SQL UNION qui dumpe
      les Users expose donc, pour wurstbrot@juice-sh.op, son hash de
      mot de passe ET son secret TOTP en clair. C'est ce secret qui te
      permet de generer les codes a 6 chiffres sans l'application
      d'authentification de la victime.
    text_en: |
      The targeted flaw is the STORAGE of the TOTP secret: Juice Shop
      keeps totpSecret in cleartext in the Users table (routes/2fa.ts
      reads it as-is), instead of encrypting it. A UNION SQL injection
      dumping the Users thus exposes, for wurstbrot@juice-sh.op, their
      password hash AND their TOTP secret in cleartext. That secret
      lets you generate the 6-digit codes without the victim's
      authenticator app.
    pedagogical_intent: |
      Center on the real vuln: plaintext TOTP secret exfiltrated by SQLi.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
      1. Dumpe les Users par SQLi UNION (cf. User Credentials) en
         incluant la colonne totpSecret ; recupere la ligne wurstbrot
         (email, hash du mot de passe, totpSecret en clair).
      2. Obtiens le mot de passe de wurstbrot (le hash est en MD5 cote
         Juice Shop ; a defaut, c'est la limite honnete de ce challenge
         - le point pedagogique est le secret TOTP en clair).
      3. Login : POST /rest/user/login (email+mot de passe) -> le
         serveur renvoie status "totp_token_required" + un tmpToken.
      4. Genere le code courant a partir du secret en clair, par ex.
         node -e "console.log(require('otplib').authenticator.generate('<totpSecret>'))"
      5. POST /rest/2fa/verify {"tmpToken":"...","totpToken":"<code>"}
         -> 200, challenge resolu (2fa.ts:44).
      Defense : chiffrer le secret TOTP au repos (jamais en clair en
      base), et traiter une fuite de secret TOTP comme une
      compromission du second facteur.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
      1. Dump the Users via UNION SQLi (see User Credentials) including
         the totpSecret column; get the wurstbrot row (email, password
         hash, cleartext totpSecret).
      2. Obtain wurstbrot's password (the hash is MD5 on Juice Shop;
         otherwise this is the honest limit of this challenge - the
         teaching point is the cleartext TOTP secret).
      3. Log in: POST /rest/user/login (email+password) -> the server
         returns status "totp_token_required" + a tmpToken.
      4. Generate the current code from the cleartext secret, e.g.
         node -e "console.log(require('otplib').authenticator.generate('<totpSecret>'))"
      5. POST /rest/2fa/verify {"tmpToken":"...","totpToken":"<code>"}
         -> 200, challenge solved (2fa.ts:44).
      Defense: encrypt the TOTP secret at rest (never cleartext in the
      database), and treat a TOTP-secret leak as a second-factor
      compromise.
    pedagogical_intent: |
      Full solution: verified 2FA flow, honest note on the password,
      defense.
