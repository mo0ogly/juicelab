challenge_key: "uploadSizeChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "You can attach a small
      file to the Complaint form. Investigate how this
      upload actually works". Surface = Complaint form
      avec file upload. Hint #2 : "understand how the
      file upload is actually handled on the client
      and server side".
    text_en: |
      Official OWASP hint #1: "You can attach a small
      file to the Complaint form. Investigate how this
      upload actually works". Surface = Complaint form
      with file upload. Hint #2: "understand how the
      file upload is actually handled on the client
      and server side".
    pedagogical_intent: |
      Activate file upload investigation reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Inspecte le formulaire B2B Complaint :
      /#/complain. Le file picker accept .pdf et
      .zip uniquement (HTML accept attribute). Le
      submit button verifie la taille via JS
      (frontend). Si tu uploades > 100kB via UI,
      le frontend rejette. Question : est-ce
      bypass-able ?
    text_en: |
      Inspect B2B Complaint form: /#/complain. File
      picker accepts only .pdf and .zip (HTML
      accept attribute). Submit button verifies
      size via JS (frontend). If you upload >
      100kB via UI, frontend rejects. Question: is
      it bypassable?
    pedagogical_intent: |
      Spell investigation surface.

  N3:
    cost_pct: 20
    text_fr: |
      Source serveur (routes/fileUpload.ts:60-65) :
      `function checkUploadSize ({ file }, res,
      next) { if (file != null) { challengeUtils.
      solveIf(challenges.uploadSizeChallenge, ()
      => { return file?.size > 100000 }) } next() }`.
      Le check est SEULEMENT pour le solve, PAS
      pour rejeter le upload. Le multer middleware
      n'a pas de `limits` config. Donc tout file
      passe, le solve trigger si > 100kB.
    text_en: |
      Server source (routes/fileUpload.ts:60-65):
      `function checkUploadSize ({ file }, res,
      next) { if (file != null) { challengeUtils.
      solveIf(challenges.uploadSizeChallenge, ()
      => { return file?.size > 100000 }) } next() }`.
      Check is ONLY for solve, NOT to reject
      upload. Multer middleware has no `limits`
      config. So any file passes, solve triggers
      if > 100kB.
    pedagogical_intent: |
      Reveal server bypass mechanic.

  N4:
    cost_pct: 35
    text_fr: |
      Le frontend limite la taille, mais l'endpoint /file-upload ne la
      verifie pas de la meme facon. Attention : multer plafonne la
      requete a 200000 octets (server.ts), et le challenge exige un
      fichier de PLUS de 100000 octets (fileUpload.ts:62). La cible est
      donc une taille STRICTEMENT comprise entre 100 Ko et 200 Ko (par
      exemple 150 Ko) : plus gros est rejete par multer ("File too
      large").
    text_en: |
      The frontend limits the size, but the /file-upload endpoint does
      not check it the same way. Caution: multer caps the request at
      200000 bytes (server.ts), and the challenge requires a file
      LARGER than 100000 bytes (fileUpload.ts:62). The target is
      therefore a size STRICTLY between 100 KB and 200 KB (e.g. 150
      KB): larger is rejected by multer ("File too large").
    pedagogical_intent: |
      Give the exact size window (multer cap vs challenge threshold).

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1, sans
      authentification) :
        head -c 150000 /dev/urandom > mid.pdf
        curl -s -X POST http://127.0.0.1:3000/file-upload -F "file=@mid.pdf"
      Reponse 204, challenge resolu : checkUploadSize voit file.size >
      100000. Un fichier de 200 Ko echoue (multer limite a 200000).
      L'extension doit rester autorisee (.pdf/.zip/.xml/.yml/.yaml)
      pour ne pas declencher a la place uploadTypeChallenge.
      Defense : appliquer la limite de taille cote serveur (et non
      seulement dans le navigateur), coherente avec la politique
      metier, et rejeter proprement les fichiers trop volumineux.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1, no
      authentication):
        head -c 150000 /dev/urandom > mid.pdf
        curl -s -X POST http://127.0.0.1:3000/file-upload -F "file=@mid.pdf"
      Response 204, challenge solved: checkUploadSize sees file.size >
      100000. A 200 KB file fails (multer caps at 200000). The
      extension must stay allowed (.pdf/.zip/.xml/.yml/.yaml) so as not
      to trigger uploadTypeChallenge instead.
      Defense: enforce the size limit server-side (not only in the
      browser), consistent with the business policy, and reject
      oversized files cleanly.
    pedagogical_intent: |
      Full solution: verified command, size window, defense.
