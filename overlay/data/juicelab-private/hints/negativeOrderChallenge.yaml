challenge_key: "negativeOrderChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "You literally need to
      make the shop owe you any amount of money".
      Donc objectif = totalPrice negatif ou shop
      paye le user. Hint #2 : "Investigate the
      shopping basket closely". Surface = basket /
      checkout endpoints.
    text_en: |
      Official OWASP hint #1: "You literally need to
      make the shop owe you any amount of money". So
      objective = negative totalPrice or shop pays
      user. Hint #2: "Investigate the shopping
      basket closely". Surface = basket / checkout
      endpoints.
    pedagogical_intent: |
      Activate negative-price attack reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Quels sont les inputs qui contribuent au
      totalPrice ? Reponse : `quantity` et `price`.
      `price` est server-side (pas modifiable). Mais
      `quantity` est user-side (input via le
      basket). Test : peut-on mettre quantity
      negative ?
    text_en: |
      What inputs contribute to totalPrice? Answer:
      `quantity` and `price`. `price` is
      server-side (not modifiable). But `quantity`
      is user-side (input via basket). Test: can we
      set negative quantity?
    pedagogical_intent: |
      Spell investigation method.

  N3:
    cost_pct: 20
    text_fr: |
      Endpoint cible : PUT /api/BasketItems/:id (modifie
      le quantity d'un item du basket). Le frontend
      Angular empeche via `min="1"` mais le backend
      ne valide PAS. Test via curl/Burp :
      modifie un BasketItem existant avec quantity
      = -10. Source serveur : routes/order.ts:138
      verifie totalPrice < 0.
    text_en: |
      Target endpoint: PUT /api/BasketItems/:id
      (modifies basket item quantity). Angular
      frontend prevents via `min="1"` but backend
      doesn't validate. Test via curl/Burp: modify
      existing BasketItem with quantity = -10.
      Server source: routes/order.ts:138 checks
      totalPrice < 0.
    pedagogical_intent: |
      Reveal endpoint + bypass mechanic.

  N4:
    cost_pct: 35
    text_fr: |
      Le serveur ne borne pas la quantite d'un article de panier a une
      valeur positive. Ajoute un produit au panier, note l'id de
      l'article (GET du panier ou onglet Network), puis force une
      quantite negative :
        PUT /api/BasketItems/<id> {"quantity": -10}
      (le controle de mise a jour laisse passer les quantites
      negatives). Au paiement, le total devient negatif.
    text_en: |
      The server does not bound a basket item's quantity to a positive
      value. Add a product to the basket, note the item id (GET the
      basket or the Network tab), then force a negative quantity:
        PUT /api/BasketItems/<id> {"quantity": -10}
      (the update check lets negative quantities through). At checkout
      the total becomes negative.
    pedagogical_intent: |
      Give the negative-quantity update and its effect on the total.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
      1. Ajoute un article : POST /api/BasketItems
         {"ProductId":1,"BasketId":<ton_bid>,"quantity":1} -> note l'id.
      2. PUT /api/BasketItems/<id> {"quantity":-10}.
      3. Valide le panier : POST /rest/basket/<ton_bid>/checkout
         (c'est cet endpoint qui place la commande, pas /api/Orders).
      Le total calcule (quantite x prix + livraison) devient negatif
      et le challenge est resolu (order.ts:138). Ironie : le solde du
      portefeuille est CREDITE du montant negatif.
      Defense : valider cote serveur que chaque quantite est un entier
      strictement positif, et refuser tout total de commande negatif
      avant paiement.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
      1. Add an item: POST /api/BasketItems
         {"ProductId":1,"BasketId":<your_bid>,"quantity":1} -> note the id.
      2. PUT /api/BasketItems/<id> {"quantity":-10}.
      3. Check out: POST /rest/basket/<your_bid>/checkout (this is the
         endpoint that places the order, not /api/Orders).
      The computed total (quantity x price + delivery) becomes negative
      and the challenge is solved (order.ts:138). Irony: the wallet
      balance is CREDITED with the negative amount.
      Defense: validate server-side that each quantity is a strictly
      positive integer, and reject any negative order total before
      payment.
    pedagogical_intent: |
      Full solution: verified steps, correct checkout endpoint, defense.
