challenge_key: "resetPasswordBjoernChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Deux comptes distincts portent le nom de Bjoern (le createur de
      Juice Shop). Ici la cible est le compte INTERNE, bjoern@juice-
      sh.op, a ne pas confondre avec son compte OWASP. Hint OWASP #1 :
      "nothing a little Facebook stalking couldn't reveal" avec un
      "historical twist" sur la reponse.
    text_en: |
      Two distinct accounts carry Bjoern's name (the Juice Shop
      author). Here the target is the INTERNAL account,
      bjoern@juice-sh.op, not to be confused with his OWASP account.
      OWASP hint #1: "nothing a little Facebook stalking couldn't
      reveal", with a "historical twist" on the answer.
    pedagogical_intent: |
      Disambiguate the two Bjoern accounts; announce the twist.

  N2:
    cost_pct: 10
    text_fr: |
      Sur /#/forgot-password, saisis bjoern@juice-sh.op : la question
      est "Your ZIP/postal code when you were a teenager?". La reponse
      est donc un CODE POSTAL, pas un lieu ni une ecole. Hint OWASP #3 :
      Bjoern a repondu honnetement mais avec une torsion historique.
    text_en: |
      On /#/forgot-password, enter bjoern@juice-sh.op: the question is
      "Your ZIP/postal code when you were a teenager?". So the answer
      is a POSTAL CODE, not a place or a school. OWASP hint #3: Bjoern
      answered truthfully but with a historical twist.
    pedagogical_intent: |
      Correct the target: a postal code, with a historical twist.

  N3:
    cost_pct: 20
    text_fr: |
      Le "twist historique" : Bjoern vit dans la region de Hambourg
      (Allemagne du Nord), information publique (profils OWASP/GitHub).
      Avant la reforme allemande des codes postaux de 1993, les codes
      de l'Ouest s'ecrivaient avec un prefixe directionnel (W- pour
      West). La reponse combine donc ce format ancien et un code
      local.
    text_en: |
      The "historical twist": Bjoern lives in the Hamburg area
      (northern Germany), public information (OWASP/GitHub profiles).
      Before Germany's 1993 postal-code reform, western codes were
      written with a directional prefix (W- for West). The answer
      therefore combines that old format and a local code.
    pedagogical_intent: |
      Explain the historical twist (pre-1993 German postal format).

  N4:
    cost_pct: 35
    text_fr: |
      La reponse configuree est West-2082 : le prefixe directionnel
      "West" de l'ancien systeme ouest-allemand, suivi d'un code a
      quatre chiffres. La validation (routes/resetPassword.ts:60) exige
      user Bjoern (interne) ET answer exactement "West-2082",
      majuscule et tiret compris.
    text_en: |
      The configured answer is West-2082: the directional prefix
      "West" from the old West German system, followed by a four-digit
      code. Validation (routes/resetPassword.ts:60) requires user
      Bjoern (internal) AND answer exactly "West-2082", capital and
      hyphen included.
    pedagogical_intent: |
      Pin the exact answer and the validation condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : /#/forgot-password, email bjoern@juice-sh.op,
      question "Your ZIP/postal code when you were a teenager?",
      reponse West-2082, puis un nouveau mot de passe. Reponse
      confirmee dans le code (resetPassword.ts:60) ; question confirmee
      via /rest/user/security-question. Non rejouee pour preserver le
      compte seede. Hint OWASP #5 : brute force quasi impossible
      (format inhabituel).
      Defense : ne pas utiliser une donnee OSINTable (code postal
      d'adolescence) comme secret ; reset par jeton e-mail a usage
      unique.
    text_en: |
      Solution: /#/forgot-password, email bjoern@juice-sh.op, question
      "Your ZIP/postal code when you were a teenager?", answer
      West-2082, then a new password. Answer confirmed in the code
      (resetPassword.ts:60); question confirmed via
      /rest/user/security-question. Not replayed to preserve the
      seeded account. OWASP hint #5: brute force near impossible
      (unusual format).
      Defense: do not use OSINT-able data (teenage postal code) as a
      secret; single-use email-token reset.
    pedagogical_intent: |
      Full solution: exact answer, source confirmation, defense.
