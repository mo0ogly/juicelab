challenge_key: "dataExportChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "Trick the regular Data Export
      to give you more than actually belongs to you". La
      feature GDPR Data Export est dans Account > Privacy &
      Security. Hint #4 : "Inspecting various server
      responses which contain user-specific data might give
      you a clue about the mistake the developers made". Donc
      regarde les responses Network — comment l'API construit-
      elle la query ?
    text_en: |
      Official OWASP hint #1: "Trick the regular Data Export
      to give you more than actually belongs to you". The
      GDPR Data Export feature is in Account > Privacy &
      Security. Hint #4: "Inspecting various server responses
      which contain user-specific data might give you a clue
      about the mistake the developers made". So watch
      Network responses — how does the API build the query?
    pedagogical_intent: |
      Direct toward Network observation.

  N2:
    cost_pct: 10
    text_fr: |
      En appelant /dataerasure (la route dataExport), tu
      reçois un fichier qui contient TES orders + reviews.
      Inspecte ce fichier : il y a un champ "email" deforme
      avec des asterisques (les voyelles remplacees). C'est
      un INDICE majeur sur la mecanique : le serveur query
      par email DEFORME, pas par user.id.
    text_en: |
      Calling /dataerasure (the dataExport route), you get a
      file with YOUR orders + reviews. Inspect the file:
      there's a deformed "email" field with asterisks (vowels
      replaced). Major CLUE on the mechanic: server queries
      by DEFORMED email, not user.id.
    pedagogical_intent: |
      Reveal the email-deformation mechanism.

  N3:
    cost_pct: 20
    text_fr: |
      Le code serveur (route dataExport.ts) execute :
      const updatedEmail = email.replace(/[aeiou]/gi, '*')
      orders = await db.ordersCollection.find({ email:
        updatedEmail })
      Donc le query retourne TOUS les orders dont l'email
      DEFORME matche le tien. Si tu peux register avec un
      email qui DEFORME comme celui d'une victime, tu obtiens
      ses orders. Hint #2 : "should not try a vanilla user
      who never even ordered" — choisi une victime qui A des
      orders.
    text_en: |
      Server code (route dataExport.ts) runs:
      const updatedEmail = email.replace(/[aeiou]/gi, '*')
      orders = await db.ordersCollection.find({ email:
        updatedEmail })
      So the query returns ALL orders whose DEFORMED email
      matches yours. If you can register with an email
      DEFORMING like a victim's, you get their orders. Hint
      #2: "should not try a vanilla user who never even
      ordered" — pick a victim who HAS orders.
    pedagogical_intent: |
      Spell the exact server code + collision strategy.

  N4:
    cost_pct: 35
    text_fr: |
      L'export GDPR (/rest/user/data-export) inclut tes commandes. Or
      chaque numero de commande est prefixe par les 4 premiers
      caracteres du hash de l'email AU MOMENT de la commande. Le serveur
      marque le challenge resolu des qu'une commande exportee a un
      prefixe DIFFERENT du hash de ton email COURANT
      (routes/dataExport.ts). Autrement dit : il faut que l'email de
      reference ait change entre la commande et l'export.
    text_en: |
      The GDPR export (/rest/user/data-export) includes your orders. But
      each order number is prefixed with the first 4 characters of the
      email hash AT ORDER TIME. The server marks the challenge solved as
      soon as an exported order has a prefix DIFFERENT from your CURRENT
      email hash (routes/dataExport.ts). In other words: the reference
      email must have changed between the order and the export.
    pedagogical_intent: |
      Reveal the real condition: order prefix vs current email hash.

  N5:
    cost_pct: 50
    text_fr: |
      Marche a suivre (mecanisme verifie dans le code ; l'export exige
      de resoudre le captcha image, non rejoue de bout en bout) :
      1. Avec un compte, passe une commande (son numero est prefixe par
         le hash de ton email actuel).
      2. Change l'email de ton compte (profil / PUT /api/Users/<id>),
         donc le hash de reference change.
      3. Lance l'export : POST /rest/user/data-export (resous le captcha
         image demande). L'export contient toujours la commande avec
         l'ancien prefixe, different du hash du nouvel email -> le
         challenge se resout (dataExport.ts).
      Variante : enregistrer un email qui entre en collision de hash
      (4 car.) avec une victime. Le point : "voler des donnees sans
      injection" via une incoherence de hachage.
      Defense : lier les donnees a un identifiant stable (userId), pas a
      un hash d'email mutable, et cloisonner strictement l'export par
      utilisateur.
    text_en: |
      Procedure (mechanism verified in the code; the export requires
      solving the image captcha, not replayed end-to-end):
      1. With an account, place an order (its number is prefixed with
         your current email hash).
      2. Change your account email (profile / PUT /api/Users/<id>), so
         the reference hash changes.
      3. Run the export: POST /rest/user/data-export (solve the image
         captcha it asks for). The export still contains the order with
         the old prefix, different from the new email's hash -> the
         challenge solves (dataExport.ts).
      Variant: register an email that hash-collides (4 chars) with a
      victim. The point: "steal data without injection" via a hashing
      inconsistency.
      Defense: tie data to a stable identifier (userId), not a mutable
      email hash, and strictly scope the export per user.
    pedagogical_intent: |
      Full solution: real mechanism, captcha caveat, defense.
