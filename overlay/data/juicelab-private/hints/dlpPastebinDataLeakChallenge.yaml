challenge_key: "dlpPastebinDataLeakChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "Your own SQLi and someone
      else's Ctrl-V will be your accomplices". Donc deux
      elements : (a) une SQLi de toi, (b) un paste public de
      quelqu'un d'autre. Hint #2 te dit de commencer par
      identifier le "unsafe product not available in the
      shop". Avec quel challenge tu peux reveler les produits
      soft-deleted ?
    text_en: |
      Official OWASP hint #1: "Your own SQLi and someone
      else's Ctrl-V will be your accomplices". Two elements:
      (a) your SQLi, (b) someone else's public paste. Hint #2
      says start by identifying the "unsafe product not
      available in the shop". Which challenge reveals
      soft-deleted products?
    pedagogical_intent: |
      Connect to christmasSpecialChallenge prerequisite.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP officiel #3 : "Solving the Christmas special
      offer challenge might give it to you as by-catch".
      Donc resous d'abord christmasSpecialChallenge (SQLi
      OR true-- sur /rest/products/search). Tu obtiens la
      liste de TOUS les produits, soft-deleted inclus. Repere
      celui marque "unsafe" dans la description.
    text_en: |
      Official OWASP hint #3: "Solving the Christmas special
      offer challenge might give it to you as by-catch". So
      first solve christmasSpecialChallenge (SQLi OR true--
      on /rest/products/search). You get the list of ALL
      products including soft-deleted. Spot the one marked
      "unsafe" in the description.
    pedagogical_intent: |
      Spell prerequisite + spot the unsafe product.

  N3:
    cost_pct: 20
    text_fr: |
      Hint OWASP officiel #4 : "the actual data you need to
      solve this challenge was leaked on the same platform
      that was involved in 'Dumpster dive the Internet for a
      leaked password'". Le challenge "Dumpster dive" reference
      Pastebin (la platform classique de leak digital). Hint
      #5 : "Google is a particularly good accomplice". Donc
      Google "<nom du produit unsafe> pastebin" ou recherche
      directement sur pastebin.com.
    text_en: |
      Official OWASP hint #4: "the actual data you need to
      solve this challenge was leaked on the same platform
      that was involved in 'Dumpster dive the Internet for a
      leaked password'". The "Dumpster dive" challenge
      references Pastebin (classic digital-leak platform).
      Hint #5: "Google is a particularly good accomplice". So
      Google "<unsafe product name> pastebin" or search
      directly on pastebin.com.
    pedagogical_intent: |
      Spell Pastebin lookup + Google strategy.

  N4:
    cost_pct: 35
    text_fr: |
      Le produit concerne est "Rippertuer Special Juice" (un produit
      retire, visible via la SQLi de recherche). Deux de ses
      ingredients ont fuite sur un pastebin et sont les mots-cles
      recherches par le serveur : hueteroneel et eurogium edule. La
      validation exige que le message contienne LES DEUX (Op.and).
    text_en: |
      The product involved is "Rippertuer Special Juice" (a removed
      product, visible via the search SQLi). Two of its ingredients
      leaked on a pastebin and are the keywords the server looks for:
      hueteroneel and eurogium edule. Validation requires the message to
      contain BOTH (Op.and).
    pedagogical_intent: |
      Give the exact product and the two required keywords.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : soumets un
      feedback (/#/contact) ou une reclamation (/#/complain) dont le
      message contient les deux ingredients fuites :
        "... hueteroneel ... eurogium edule ..."
      Le serveur detecte les deux mots-cles et resout le challenge
      (routes/verify.ts, dangerousIngredients, Op.and). Les ingredients
      se trouvent par OSINT (pastebin lie au produit retire Rippertuer
      Special Juice).
      Defense : controler les fuites de donnees (DLP), ne pas publier
      d'informations produit sensibles hors des canaux maitrises, et
      surveiller les pastebins pour ses propres donnees.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): submit a
      feedback (/#/contact) or a complaint (/#/complain) whose message
      contains both leaked ingredients:
        "... hueteroneel ... eurogium edule ..."
      The server detects both keywords and solves the challenge
      (routes/verify.ts, dangerousIngredients, Op.and). The ingredients
      are found by OSINT (a pastebin linked to the removed product
      Rippertuer Special Juice).
      Defense: enforce data-loss prevention (DLP), do not publish
      sensitive product information outside controlled channels, and
      monitor pastebins for your own data.
    pedagogical_intent: |
      Full verified solution: exact keywords, both-required condition.
