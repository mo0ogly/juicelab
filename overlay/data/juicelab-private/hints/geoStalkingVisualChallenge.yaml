challenge_key: "geoStalkingVisualChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Le mecanisme attaque est la reinitialisation de mot de passe par
      question secrete : si tu devines la reponse d'Emma, tu reprends
      son compte. Hint OWASP : "look at the details in the photo". La
      reponse n'est donc pas dans des metadonnees (c'est le cas du
      challenge jumeau geoStalkingMeta) mais visible DANS l'image.
      Va sur /#/photo-wall reperer la photo d'Emma.
    text_en: |
      The attacked mechanism is password reset via security question:
      if you guess Emma's answer, you take over her account. OWASP
      hint: "look at the details in the photo". So the answer is not
      in metadata (that is the twin challenge geoStalkingMeta) but
      visible IN the image. Go to /#/photo-wall and find Emma's
      photo.
    pedagogical_intent: |
      Frame the goal (security-question reset) and the visual nature.

  N2:
    cost_pct: 10
    text_fr: |
      D'abord, quelle question ? Lance /#/forgot-password avec
      emma@juice-sh.op : le formulaire affiche sa question secrete,
      "Company you first work for as an adult?" (question 10). La
      reponse est donc un NOM D'ENTREPRISE, pas une ville ni un
      monument. Sa photo est legendee "My old workplace..." : cherche
      une enseigne, un logo ou un badge d'entreprise dans l'image.
    text_en: |
      First, which question? Start /#/forgot-password with
      emma@juice-sh.op: the form shows her security question,
      "Company you first work for as an adult?" (question 10). So the
      answer is a COMPANY NAME, not a city or a monument. Her photo is
      captioned "My old workplace...": look for a sign, a logo or a
      company badge in the image.
    pedagogical_intent: |
      Correct the target: a company name, cued by the question and
      caption.

  N3:
    cost_pct: 20
    text_fr: |
      Telecharge la photo d'Emma (IMG_4253.jpg) et agrandis-la pour
      lire les textes : enseigne sur la facade, plaque, logo sur un
      mur ou un vetement. Au besoin, une recherche d'image inversee
      (Google Lens, Yandex) peut aider a reconnaitre un logo
      d'entreprise, mais ici l'analyse visuelle directe du nom affiche
      suffit.
    text_en: |
      Download Emma's photo (IMG_4253.jpg) and zoom in to read the
      text: a sign on the facade, a plaque, a logo on a wall or on
      clothing. If needed, reverse image search (Google Lens, Yandex)
      can help recognize a company logo, but here reading the
      displayed name directly is enough.
    pedagogical_intent: |
      Direct the visual search at readable company signage.

  N4:
    cost_pct: 35
    text_fr: |
      Le nom lu sur la photo est la reponse a la question. La
      validation (routes/resetPassword.ts, geoStalkingVisualChallenge)
      compare ta reponse a la valeur configuree pour la memoire
      d'Emma. Sur /#/forgot-password : email emma@juice-sh.op,
      reponse = le nom de l'entreprise, puis choisis un nouveau mot
      de passe. Resoudre le reset resout le challenge.
    text_en: |
      The name read on the photo is the answer to the question.
      Validation (routes/resetPassword.ts, geoStalkingVisualChallenge)
      compares your answer to the value configured for Emma's memory.
      On /#/forgot-password: email emma@juice-sh.op, answer = the
      company name, then set a new password. Completing the reset
      solves the challenge.
    pedagogical_intent: |
      Tie the read name to the exact validation path.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : sur /#/forgot-password, email emma@juice-sh.op,
      reponse a "Company you first work for as an adult?" = ITsec
      (valeur par defaut, geoStalkingVisualSecurityAnswer dans
      config/default.yml, verifiee sur le lab 19.2.1), puis definis un
      nouveau mot de passe. Note : cette valeur depend de la config de
      l'instance ; sur une autre config, lis le nom reellement visible
      sur la photo d'Emma. Non rejoue pendant la revue pour ne pas
      modifier le mot de passe d'Emma sur le lab.
      Defense : les questions secretes dont la reponse est trouvable
      par OSINT ne protegent rien ; preferer un reset par e-mail a
      jeton a usage unique, et ne pas publier de donnees personnelles
      exploitables.
    text_en: |
      Solution: on /#/forgot-password, email emma@juice-sh.op, answer
      to "Company you first work for as an adult?" = ITsec (default
      value, geoStalkingVisualSecurityAnswer in config/default.yml,
      verified on lab 19.2.1), then set a new password. Note: this
      value depends on the instance config; on another config, read
      the name actually visible in Emma's photo. Not replayed during
      the review to avoid changing Emma's password on the lab.
      Defense: security questions whose answer is findable via OSINT
      protect nothing; prefer an email reset with a single-use token,
      and do not publish exploitable personal data.
    pedagogical_intent: |
      Full solution, config-dependency caveat, honest replay status,
      defense.
