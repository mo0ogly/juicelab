challenge_key: "basketManipulateChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Pre-requis pedagogique : as-tu deja resolu basketAccessChallenge
      (View Basket) ? Si oui, tu connais le pattern IDOR sur les
      paniers. Difference ici : ce n'est plus une lecture (voir le
      panier) mais une ECRITURE (modifier le panier). Hint OWASP
      officiel #2 te previent : pas un simple update quantity,
      pas un steal, mais ajouter un nouveau produit.
    text_en: |
      Pedagogical prerequisite: have you solved basketAccessChallenge
      (View Basket)? If yes, you know the IDOR pattern on baskets.
      Difference here: not a read (viewing the basket) but a
      WRITE (modifying it). Official OWASP hint #2 warns: not a
      simple quantity update, not a steal, but adding a new
      product.
    pedagogical_intent: |
      Connect to basketAccess (read) and pivot to write IDOR.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP officiel #1 : "Have an eye on the HTTP traffic
      while placing products in the shopping basket". Va sur la
      page produits, ouvre les DevTools onglet Network. Ajoute UN
      produit a TON basket. Observe la requete generee : quel
      endpoint ? Quel body ?
    text_en: |
      Official OWASP hint #1: "Have an eye on the HTTP traffic
      while placing products in the shopping basket". Go to
      products page, open DevTools Network tab. Add ONE product
      to YOUR basket. Observe the generated request: which
      endpoint? What body?
    pedagogical_intent: |
      Localize the endpoint via traffic observation.

  N3:
    cost_pct: 20
    text_fr: |
      L'endpoint est POST /api/BasketItems/ avec body :
      { "ProductId": <X>, "BasketId": <ton_bid>, "quantity": 1 }
      Question : qu'est-ce que ton bid ? Tu peux le voir dans le
      sessionStorage (cle "bid") ou dans la response de
      /rest/basket. C'est typiquement 6 ou 7 pour un user
      nouvellement inscrit. Que se passerait-il si tu changeais
      le BasketId du body en 1, 2 ou 3 ?
    text_en: |
      Endpoint is POST /api/BasketItems/ with body:
      { "ProductId": <X>, "BasketId": <your_bid>, "quantity": 1 }
      Question: what's your bid? You can see it in sessionStorage
      (key "bid") or in the /rest/basket response. Typically 6 or
      7 for a newly-registered user. What if you changed the body
      BasketId to 1, 2, or 3?
    pedagogical_intent: |
      Spell the body shape and trigger enumeration thinking.

  N4:
    cost_pct: 35
    text_fr: |
      Il y a bien un controle, mais il est contournable. A l'ajout
      d'article (POST /api/BasketItems), le serveur analyse le corps
      brut avec un parseur maison (utils.parseJsonCustom) qui collecte
      TOUTES les occurrences d'une cle. Le controle d'appartenance
      compare ton bid au PREMIER BasketId, tandis que l'insertion (et
      la validation du challenge) utilise le DERNIER. En envoyant deux
      cles BasketId, tu passes le controle avec la tienne et tu ecris
      dans le panier de la victime.
    text_en: |
      There is a check, but it is bypassable. On add (POST
      /api/BasketItems), the server parses the raw body with a
      homegrown parser (utils.parseJsonCustom) that collects ALL
      occurrences of a key. The ownership check compares your bid to
      the FIRST BasketId, while the insert (and the challenge
      validation) use the LAST. By sending two BasketId keys, you pass
      the check with yours and write into the victim's basket.
    pedagogical_intent: |
      Reveal the real flaw: duplicate-key parsing, first checked vs
      last used.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : le corps
      JSON porte deux BasketId, le tien d'abord, celui de la victime
      ensuite :
        curl -s -X POST http://127.0.0.1:3000/api/BasketItems \\
          -H "Authorization: Bearer <ton_jwt>" \\
          -H "Content-Type: application/json" \\
          -d '{"ProductId":6,"BasketId":<ton_bid>,"BasketId":2,"quantity":1}'
      Reponse 200 : l'article est ajoute au panier 2 (un autre user) et
      le challenge est resolu. Un seul BasketId etranger renvoie 401
      "Invalid BasketId" : c'est la duplication qui contourne le
      controle. Alternative : PUT /api/BasketItems/<id d'un item a toi>
      avec {"BasketId":2} (le controle de mise a jour ne verifie pas
      l'appartenance, basketItems.ts:70).
      Defense : valider le corps avec un parseur strict (rejeter les
      cles dupliquees), et verifier l'appartenance du panier sur la
      valeur reellement utilisee pour l'ecriture, pas sur une autre.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): the JSON
      body carries two BasketId, yours first, the victim's next:
        curl -s -X POST http://127.0.0.1:3000/api/BasketItems \\
          -H "Authorization: Bearer <your_jwt>" \\
          -H "Content-Type: application/json" \\
          -d '{"ProductId":6,"BasketId":<your_bid>,"BasketId":2,"quantity":1}'
      Response 200: the item is added to basket 2 (another user) and
      the challenge is solved. A single foreign BasketId returns 401
      "Invalid BasketId": it is the duplication that bypasses the
      check. Alternative: PUT /api/BasketItems/<id of an item you own>
      with {"BasketId":2} (the update path does not check ownership,
      basketItems.ts:70).
      Defense: validate the body with a strict parser (reject
      duplicate keys), and check basket ownership on the value actually
      used for the write, not on another.
    pedagogical_intent: |
      Full solution: verified duplicate-key payload, the 401 pitfall,
      alternative path, defense.
