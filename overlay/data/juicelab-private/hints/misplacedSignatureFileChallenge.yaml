challenge_key: "misplacedSignatureFileChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP #2 + #3 : "you already know
      where the SIEM signature file is" + "
      reuse the trick that already worked".
      Pre-requis : nullByteChallenge (Lot 7).
    text_en: |
      OWASP hints #2 + #3: "you already know
      where the SIEM signature file is" +
      "reuse the trick that already worked".
      Prerequisite: nullByteChallenge (Lot 7).
    pedagogical_intent: |
      Activate composition reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Le file SIEM = Sigma format (.yml
      extension). Cible : suspicious_errors.
      yml dans /ftp/. Mais .yml n'est pas
      dans allowlist endsWith .md/.pdf - donc
      need null byte bypass.
    text_en: |
      SIEM file = Sigma format (.yml
      extension). Target: suspicious_errors.
      yml in /ftp/. But .yml not in
      endsWith .md/.pdf allowlist - so
      need null byte bypass.
    pedagogical_intent: |
      Spell file + bypass.

  N3:
    cost_pct: 20
    text_fr: |
      Source serveur (routes/fileServer.ts:
      44) : `solveIf(() => file === '
      suspicious_errors.yml')`. Apres null
      byte strip. Donc GET /ftp/suspicious_
      errors.yml%00.md.
    text_en: |
      Server source (routes/fileServer.ts:
      44): `solveIf(() => file === '
      suspicious_errors.yml')`. After null
      byte strip. So GET /ftp/suspicious_
      errors.yml%00.md.
    pedagogical_intent: |
      Reveal exact target.

  N4:
    cost_pct: 35
    text_fr: |
      Le fichier vise, suspicious_errors.yml, a une extension .yml qui
      n'est pas dans l'allowlist (.md/.pdf) : il faut donc le meme
      contournement par octet nul que pour les .bak. L'octet nul doit
      souvent etre double-encode (%2500) selon le client : le filtre
      voit l'extension .md finale et accepte, puis cutOffPoisonNullByte
      tronque sur l'octet nul et ouvre le .yml.
    text_en: |
      The target file, suspicious_errors.yml, has a .yml extension not
      in the allowlist (.md/.pdf): so it needs the same poison-null-byte
      bypass as the .bak files. The null byte often has to be double-
      encoded (%2500) depending on the client: the filter sees the
      trailing .md extension and accepts, then cutOffPoisonNullByte
      truncates on the null byte and opens the .yml.
    pedagogical_intent: |
      Reuse the null-byte bypass for a .yml file, with the encoding note.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
        curl -s "http://127.0.0.1:3000/ftp/suspicious_errors.yml%2500.md"
      Le serveur sert suspicious_errors.yml (une regle de detection type
      Sigma) et resout le challenge (fileServer.ts:44). Dans un
      navigateur, saisis l'octet nul sous la forme qui parvient encode
      au serveur. Pre-requis : savoir lister /ftp/ (Confidential
      Document) et le principe du null byte.
      Defense : valider le type de fichier sur le chemin reellement
      ouvert (apres decodage), jamais sur la chaine brute ; rejeter tout
      octet nul dans un nom de fichier.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
        curl -s "http://127.0.0.1:3000/ftp/suspicious_errors.yml%2500.md"
      The server serves suspicious_errors.yml (a Sigma-style detection
      rule) and solves the challenge (fileServer.ts:44). In a browser,
      enter the null byte in the form that reaches the server encoded.
      Prerequisites: being able to list /ftp/ (Confidential Document)
      and the null-byte principle.
      Defense: validate the file type on the path actually opened (after
      decoding), never on the raw string; reject any null byte in a file
      name.
    pedagogical_intent: |
      Full verified solution: exact null-byte URL, encoding note, defense.
