challenge_key: "resetPasswordUvoginChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "OSINT on his social media
      personas to find his honest answer". Donc OSINT
      cross-platform sur l'alias "Uvogin". Hint #2 : "People
      often reuse aliases online". Methode pentester
      classique : tester l'alias sur 400+ sites en quelques
      secondes via un outil dedie.
    text_en: |
      Official OWASP hint #1: "OSINT on his social media
      personas to find his honest answer". So
      cross-platform OSINT on alias "Uvogin". Hint #2:
      "People often reuse aliases online". Classic pentester
      method: test alias on 400+ sites in seconds via a
      dedicated tool.
    pedagogical_intent: |
      Activate cross-platform OSINT reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP officiel #3 : "find some existing OSINT
      tools to help". Sherlock (github.com/sjherbert/
      sherlock) ou WhatsMyName (whatsmyname.app) sont les
      tools standards. Lance : `python sherlock uvogin` ou
      `whatsmyname uvogin` (web). Resultat : liste des
      profils existants pour cet alias.
    text_en: |
      Official OWASP hint #3: "find some existing OSINT
      tools to help". Sherlock (github.com/sjherbert/
      sherlock) or WhatsMyName (whatsmyname.app) are
      standard tools. Run: `python sherlock uvogin` or
      `whatsmyname uvogin` (web). Result: list of existing
      profiles for this alias.
    pedagogical_intent: |
      Spell OSINT tooling.

  N3:
    cost_pct: 20
    text_fr: |
      Une fois les profils trouves (typiquement Twitter,
      Instagram, anime forums), repere la security question
      d'Uvogin sur Juice Shop. Va sur /#/forgot-password,
      entre uvogin@juice-sh.op (ou similar). La question
      apparait : typiquement "What is your favorite anime
      character?" ou similar. Cherche sur les profils
      OSINT pour la reponse.
    text_en: |
      Once profiles found (typically Twitter, Instagram,
      anime forums), spot Uvogin's security question on
      Juice Shop. Go to /#/forgot-password, enter
      uvogin@juice-sh.op (or similar). Question appears:
      typically "What is your favorite anime character?" or
      similar. Search on OSINT profiles for the answer.
    pedagogical_intent: |
      Spell forgot-password discovery + answer search.

  N4:
    cost_pct: 35
    text_fr: |
      La question secrete d'Uvogin (uvogin@juice-sh.op) est "Your
      favorite movie?" (question 12), pas une preference anime. La
      reponse est le titre d'un film qu'il a laisse fuiter sur ses
      profils publics. C'est un classique du cinema (thriller).
    text_en: |
      Uvogin's security question (uvogin@juice-sh.op) is "Your favorite
      movie?" (question 12), not an anime preference. The answer is a
      film title he leaked on his public profiles. It is a cinema
      classic (thriller).
    pedagogical_intent: |
      Correct the question (favorite movie) and the answer category.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : sur /#/forgot-password, email uvogin@juice-sh.op,
      question "Your favorite movie?", reponse Silence of the Lambs,
      puis un nouveau mot de passe. Reponse confirmee en source
      (routes/resetPassword.ts:63) ; reset non rejoue pour preserver le
      compte seede. L'OSINT : le titre est trouvable sur les profils
      publics d'Uvogin (reference deposee dans les donnees seedees avec
      un lien IMDB).
      Defense : les questions secretes a reponse publique n'offrent
      aucune protection ; preferer un reset par e-mail a jeton unique.
    text_en: |
      Solution: on /#/forgot-password, email uvogin@juice-sh.op,
      question "Your favorite movie?", answer Silence of the Lambs,
      then a new password. Answer confirmed in source
      (routes/resetPassword.ts:63); reset not replayed to preserve the
      seeded account. OSINT: the title is findable on Uvogin's public
      profiles (referenced in the seeded data with an IMDB link).
      Defense: security questions with a public answer offer no
      protection; prefer an email reset with a single-use token.
    pedagogical_intent: |
      Full solution: exact question and answer, source-confirmed.
