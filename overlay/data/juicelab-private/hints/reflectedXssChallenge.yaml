challenge_key: "reflectedXssChallenge"
schema_version: "juicelab.hints.v1"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Le DOM XSS exploite une saisie qui revient dans la meme page, traitee
      par du JavaScript local. Le Reflected XSS, lui, exploite des
      parametres d'URL qui sont relayes par le serveur a une page de
      destination, et reaffiches sur cette page. Quelles pages de Juice
      Shop sont accedees via une URL contenant un parametre de requete ?
    text_en: |
      DOM XSS exploits an input that comes back to the same page, handled
      by local JavaScript. Reflected XSS exploits URL parameters relayed
      by the server to a destination page and re-displayed on it. Which
      Juice Shop pages are reached via a URL containing a query parameter?
    pedagogical_intent: |
      Differentiate DOM XSS from reflected XSS via the data path.

  N2:
    cost_pct: 10
    text_fr: |
      Le Reflected XSS exploite un parametre d'URL renvoye tel quel
      dans la page de destination. La page de suivi de commande affiche
      un identifiant de commande lu dans l'URL. Tu peux l'atteindre
      depuis l'historique des commandes, mais aussi directement en
      construisant l'URL : c'est le parametre reflete typique.
    text_en: |
      Reflected XSS exploits a URL parameter echoed as-is into the
      destination page. The order-tracking page displays an order id
      read from the URL. You can reach it from the order history, but
      also directly by building the URL: that is the typical reflected
      parameter.
    pedagogical_intent: |
      Point at the order-tracking id parameter without over-constraining.

  N3:
    cost_pct: 20
    text_fr: |
      L'URL est /#/track-result?id=XXXX. Le parametre id est lu par
      Angular et insere dans la page via bypassSecurityTrustHtml du
      DomSanitizer, qui dit explicitement a Angular de faire confiance
      au contenu : la promesse cassee. Cote serveur, /rest/track-order/
      :id relaie aussi cet id (c'est la que le challenge est valide).
    text_en: |
      The URL is /#/track-result?id=XXXX. The id parameter is read by
      Angular and inserted into the page via the DomSanitizer's
      bypassSecurityTrustHtml, which explicitly tells Angular to trust
      the content: the broken promise. Server-side, /rest/track-order/
      :id also relays this id (that is where the challenge is solved).
    pedagogical_intent: |
      Give the exact route and the sink (bypassSecurityTrustHtml).

  N4:
    cost_pct: 35
    text_fr: |
      Le payload est identique a celui du DOM XSS : <iframe
      src="javascript:alert(`xss`)">. Il se place dans le parametre id.
      La validation (routes/trackOrder.ts) resout le challenge quand
      l'id contient cette chaine ; l'id est tronque a 60 caracteres,
      le payload tient dans cette limite.
    text_en: |
      The payload is identical to the DOM XSS one: <iframe
      src="javascript:alert(`xss`)">. It goes in the id parameter.
      Validation (routes/trackOrder.ts) solves the challenge when the
      id contains this string; the id is truncated to 60 characters,
      the payload fits within that limit.
    pedagogical_intent: |
      Give the exact payload, the field and the truncation limit.

  N5:
    cost_pct: 50
    text_fr: |
      Solution : dans la barre d'adresse,
      http://127.0.0.1:3000/#/track-result?id=<iframe src="javascript:alert(`xss`)">
      Le navigateur encode les caracteres speciaux ; au chargement,
      l'iframe est inseree via bypassSecurityTrustHtml et alert(`xss`)
      s'execute. Attention : ce challenge est desactive en Docker /
      Heroku / Gitpod (safetyMode) ; sur une instance locale non-Docker
      il fonctionne.
      Defense : ne jamais appeler bypassSecurityTrustHtml sur une
      entree utilisateur ; afficher le parametre par interpolation
      {{ }} (echappee).
    text_en: |
      Solution: in the address bar,
      http://127.0.0.1:3000/#/track-result?id=<iframe src="javascript:alert(`xss`)">
      The browser encodes the special characters; on load, the iframe
      is inserted via bypassSecurityTrustHtml and alert(`xss`) runs.
      Note: this challenge is disabled in Docker / Heroku / Gitpod
      (safetyMode); on a non-Docker local instance it works.
      Defense: never call bypassSecurityTrustHtml on user input;
      display the parameter through {{ }} interpolation (escaped).
    pedagogical_intent: |
      Full solution with the Docker-disabled caveat and defense.
