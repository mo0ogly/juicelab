challenge_key: "csafChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      CSAF est un standard OASIS pour security advisories. Un fichier CSAF
      est cache sur le shop. Il faut trouver son hash et le rapporter via
      /#/contact.
    text_en: |
      CSAF is OASIS standard for security advisories. A CSAF file is
      hidden on shop. Find its hash and report via /#/contact.
    pedagogical_intent: |
      Activate CSAF + standard reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Le hint OWASP dit : "Security Advisories are often listed in the
      security.txt". security.txt (RFC 9116) est publie a un
      emplacement standard defini par la RFC 8615. Ouvre-le : un de
      ses champs pointe vers les advisories du shop, au format CSAF
      (standard OASIS).
    text_en: |
      The OWASP hint says: "Security Advisories are often listed in
      the security.txt". security.txt (RFC 9116) is published at a
      standard location defined by RFC 8615. Open it: one of its
      fields points to the shop's advisories, in CSAF format (OASIS
      standard).
    pedagogical_intent: |
      Research direction: security.txt and its standard location.

  N3:
    cost_pct: 20
    text_fr: |
      /.well-known/security.txt contient un champ Csaf: qui pointe
      vers /.well-known/csaf/provider-metadata.json. Le dossier
      /.well-known/csaf/ est listable : il contient des advisories
      ranges par annee, chacun accompagne d'un .asc (signature) et
      d'un .sha512 (empreinte). Lis les advisories : lequel concerne
      une bibliotheque, marque known_affected, avec seulement un
      contournement en attendant le correctif ?
    text_en: |
      /.well-known/security.txt has a Csaf: field pointing to
      /.well-known/csaf/provider-metadata.json. The
      /.well-known/csaf/ folder is browsable: it holds advisories
      sorted by year, each with a .asc (signature) and a .sha512
      (checksum). Read the advisories: which one concerns a library,
      is marked known_affected, and offers only a workaround while
      the fix is pending?
    pedagogical_intent: |
      Localize the artefacts and narrow down to the right advisory by
      its CSAF fields.

  N4:
    cost_pct: 35
    text_fr: |
      C'est l'advisory 2017/juice-shop-sa-20200513-express-jwt.json
      (CVE-2020-15084, remediation "workaround" uniquement). La
      somme de controle attendue est son SHA-512. Prends la valeur
      publiee dans le .sha512 voisin et, par diligence, compare-la a
      ton propre calcul (sha512sum sous Linux, Get-FileHash
      -Algorithm SHA512 sous PowerShell). Attention : si ton
      installation a modifie les fins de ligne du fichier, ton calcul
      differera ; seule la valeur du .sha512 est acceptee. Le serveur
      cherche cette valeur dans les feedbacks ET les reclamations
      (routes/verify.ts, checkPatternInFeedbackAndComplaints).
    text_en: |
      It is advisory 2017/juice-shop-sa-20200513-express-jwt.json
      (CVE-2020-15084, "workaround" remediation only). The expected
      checksum is its SHA-512. Take the value published in the
      neighbouring .sha512 and, for due diligence, compare it with
      your own computation (sha512sum on Linux, Get-FileHash
      -Algorithm SHA512 on PowerShell). Beware: if your installation
      changed the file's line endings, your computation will differ;
      only the .sha512 value is accepted. The server looks for that
      value in feedback AND complaints (routes/verify.ts,
      checkPatternInFeedbackAndComplaints).
    pedagogical_intent: |
      Guided steps: identify the advisory, obtain and cross-check the
      checksum, know where it is matched.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) :
        curl -s http://127.0.0.1:3000/.well-known/csaf/2017/juice-shop-sa-20200513-express-jwt.json.sha512
      La valeur commence par 7e7ce7c65db3bf06 et finit par 0242e843
      (config/default.yml, challenges.csafHashValue). Colle-la comme
      commentaire sur /#/contact (note et captcha obligatoires), ou
      dans une reclamation /#/complain. Le challenge est resolu a la
      requete suivante.
      Defense : publier un correctif ou une mesure compensatoire
      (ici, verifier l'algorithme JWT attendu), tenir l'advisory CSAF
      a jour et signe (.asc), et suivre les dependances vulnerables
      (npm audit, SCA) pour ne pas rester "known affected".
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1):
        curl -s http://127.0.0.1:3000/.well-known/csaf/2017/juice-shop-sa-20200513-express-jwt.json.sha512
      The value starts with 7e7ce7c65db3bf06 and ends with 0242e843
      (config/default.yml, challenges.csafHashValue). Paste it as a
      comment on /#/contact (rating and captcha required), or in a
      complaint at /#/complain. The challenge is solved on the next
      request.
      Defense: ship a fix or compensating control (here, enforce the
      expected JWT algorithm), keep the CSAF advisory current and
      signed (.asc), and track vulnerable dependencies (npm audit,
      SCA) so as not to remain "known affected".
    pedagogical_intent: |
      Full solution: verified command, expected value bounds, both
      submission channels, defense.
