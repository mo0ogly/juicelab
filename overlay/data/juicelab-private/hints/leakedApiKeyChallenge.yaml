challenge_key: "leakedApiKeyChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "The API call is part of a
      scheduled process behind the scenes, completely
      unrelated to the web application". Donc l'API key
      n'est PAS dans la webapp Juice Shop. Elle est ailleurs,
      hors webapp. Hint #2 : "Check the Juice Shop's social
      media channels for regularly scheduled content being
      posted". Donc cherche les social media channels.
    text_en: |
      Official OWASP hint #1: "The API call is part of a
      scheduled process behind the scenes, completely
      unrelated to the web application". So API key is NOT
      in the Juice Shop webapp. It's elsewhere, off-webapp.
      Hint #2: "Check the Juice Shop's social media channels
      for regularly scheduled content being posted". So look
      for social media channels.
    pedagogical_intent: |
      Direct off-webapp + signal social media.

  N2:
    cost_pct: 10
    text_fr: |
      Le footer ou About Us de Juice Shop linkent typiquement
      Twitter/X, GitHub, Slack du projet. Identifie ces
      channels. Hint OWASP officiel #2 mentionne
      "regularly scheduled content" — donc des posts
      automatiques (un tweet par jour, par exemple). Repere
      ce pattern de posts.
    text_en: |
      Juice Shop footer or About Us typically link Twitter/X,
      GitHub, Slack of the project. Identify these channels.
      Official OWASP hint #2 mentions "regularly scheduled
      content" — so automatic posts (a tweet per day, for
      example). Spot this post pattern.
    pedagogical_intent: |
      Spell social media surface.

  N3:
    cost_pct: 20
    text_fr: |
      Hint OWASP officiel #3 : "Find out which part of the
      content might come from the response of an API call".
      Quelles parts d'un tweet pourraient etre auto-generees
      par une API ? Une blague (jokes API), une citation
      (quotes API), une image meme. Identifie le pattern :
      typiquement les Juice Shop tweets contiennent une dad
      joke quotidienne, qui vient probablement d'icanhazdadjoke
      .com ou similar.
    text_en: |
      Official OWASP hint #3: "Find out which part of the
      content might come from the response of an API call".
      Which parts of a tweet could be auto-generated by an
      API? A joke (jokes API), a quote (quotes API), a meme
      image. Identify the pattern: typically Juice Shop
      tweets contain a daily dad joke, likely from
      icanhazdadjoke.com or similar.
    pedagogical_intent: |
      Connect content to API source.

  N4:
    cost_pct: 35
    text_fr: |
      Hint OWASP : la cle n'est pas dans l'application web mais dans le
      script d'automatisation qui appelle une API externe (le bot qui
      poste des blagues). Ce code est public ; on y trouve une cle API
      laissee en clair. Le challenge se resout en rapportant cette cle
      exacte au shop (feedback /#/contact ou reclamation /#/complain).
    text_en: |
      OWASP hint: the key is not in the web application but in the
      automation script that calls an external API (the bot posting
      jokes). That code is public; it contains an API key left in
      cleartext. The challenge solves by reporting that exact key to the
      shop (feedback /#/contact or complaint /#/complain).
    pedagogical_intent: |
      Point at the leaked key in the public automation code.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : soumets la
      cle exacte dans un feedback ou une reclamation :
        6PPi37DBxP4lDwlriuaxP15HaDJpsUXY5TspVmie
      Le serveur la detecte et resout le challenge (routes/verify.ts,
      checkPatternInFeedbackAndComplaints). L'OSINT consiste a retrouver
      cette cle dans le code public du bot (lien depuis le pied de page
      / comptes sociaux du shop vers le depot).
      Defense : ne jamais committer de cle API ; utiliser des secrets
      d'environnement, un scan de secrets en CI, et rotater toute cle
      exposee.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): submit
      the exact key in a feedback or complaint:
        6PPi37DBxP4lDwlriuaxP15HaDJpsUXY5TspVmie
      The server detects it and solves the challenge (routes/verify.ts,
      checkPatternInFeedbackAndComplaints). OSINT means finding this key
      in the bot's public code (linked from the shop's footer / social
      accounts to the repository).
      Defense: never commit an API key; use environment secrets, secret
      scanning in CI, and rotate any exposed key.
    pedagogical_intent: |
      Full verified solution: exact key, submission channel, defense.
