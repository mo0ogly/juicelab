challenge_key: "freeDeluxeChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hints OWASP #1, #2 : "what happens when you
      attempt to upgrade" + "try paying through
      different methods". Donc l'objectif est sur
      le upgrade flow. Naviguer /#/deluxe-
      membership et observer les options de
      payment.
    text_en: |
      OWASP hints #1, #2: "what happens when you
      attempt to upgrade" + "try paying through
      different methods". So objective on upgrade
      flow. Navigate /#/deluxe-membership and
      observe payment options.
    pedagogical_intent: |
      Activate upgrade flow exploration.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #3 : "inspect the requests ... using the browser's
      developer tools". Ouvre l'onglet Network, lance une tentative
      de paiement (wallet ou carte) : la requete est
      POST /rest/deluxe-membership. Regarde son corps JSON. Un seul
      champ y decrit comment tu paies. Note : ton identifiant n'a pas
      besoin d'etre dans le corps, le serveur le deduit de ton jeton.
    text_en: |
      OWASP hint #3: "inspect the requests ... using the browser's
      developer tools". Open the Network tab, start a payment attempt
      (wallet or card): the request is POST /rest/deluxe-membership.
      Look at its JSON body. A single field describes how you pay.
      Note: your user id does not need to be in the body, the server
      derives it from your token.
    pedagogical_intent: |
      Localize the request and the single decisive field.

  N3:
    cost_pct: 20
    text_fr: |
      Hint OWASP #4 : "playing around with the parameters". Le champ
      s'appelle paymentMode et vaut "wallet" ou "card". Que se passe-
      t-il si tu envoies une troisieme valeur, que le serveur ne
      reconnait ni comme portefeuille ni comme carte ? Rejoue la
      requete modifiee et observe le role de ton compte apres coup.
    text_en: |
      OWASP hint #4: "playing around with the parameters". The field
      is paymentMode and holds "wallet" or "card". What happens if
      you send a third value the server recognizes as neither wallet
      nor card? Replay the modified request and check your account
      role afterwards.
    pedagogical_intent: |
      Point at the parameter and the idea of an unhandled value.

  N4:
    cost_pct: 35
    text_fr: |
      Code serveur (routes/deluxe.ts, upgradeToDeluxe) : le bloc
      "wallet" ne s'execute que si paymentMode vaut "wallet", le bloc
      "card" que si paymentMode vaut "card". Avec toute autre valeur,
      les deux controles de paiement sont sautes, puis
      user.update({ role: deluxe }) s'execute, et solveIf exige
      exactement : jeton valide ET paymentMode different de "wallet"
      ET different de "card". Pre-requis : etre connecte avec un
      compte de role "customer" (la requete cible role customer).
    text_en: |
      Server code (routes/deluxe.ts, upgradeToDeluxe): the "wallet"
      block runs only if paymentMode is "wallet", the "card" block
      only if paymentMode is "card". With any other value both
      payment checks are skipped, then user.update({ role: deluxe })
      runs, and solveIf requires exactly: valid token AND paymentMode
      other than "wallet" AND other than "card". Precondition: be
      logged in with a "customer" role account (the query targets
      role customer).
    pedagogical_intent: |
      Give the exact branch logic and the solve condition.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : connecte
      comme client, rejoue la requete avec une troisieme valeur de
      paymentMode, par exemple :
        POST /rest/deluxe-membership
        Authorization: Bearer <ton jeton>
        corps : {"paymentMode":"none"}
      Reponse 200 ; ton compte passe deluxe sans paiement et le
      challenge est resolu. Inutile de mettre un UserId dans le
      corps : le middleware appendUserId l'ecrase avec l'id de ton
      jeton.
      Defense : ne jamais accorder un acces paye sur la base d'un
      champ fourni par le client. Valider paymentMode contre une
      liste fermee de moyens de paiement et refuser toute valeur
      inconnue avant de modifier le role.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): logged
      in as a customer, replay the request with a third paymentMode
      value, for example:
        POST /rest/deluxe-membership
        Authorization: Bearer <your token>
        body: {"paymentMode":"none"}
      Response 200; your account becomes deluxe without paying and the
      challenge is solved. No need to put a UserId in the body: the
      appendUserId middleware overwrites it with your token's id.
      Defense: never grant paid access based on a client-supplied
      field. Validate paymentMode against a closed list of payment
      methods and reject any unknown value before changing the role.
    pedagogical_intent: |
      Full solution: verified request, UserId pitfall, defense.
