challenge_key: "emailLeakChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "find and attack an endpoint
      that responds with user information. SQL Injection is
      not the solution here". Donc tu dois trouver un endpoint
      qui leak des emails sans SQLi. Hint #2 : "ways to access
      data from a web application cross-domain". Quelles sont
      les techniques cross-domain en HTTP ?
    text_en: |
      Official OWASP hint #1: "find and attack an endpoint
      that responds with user information. SQL Injection is
      not the solution here". So find an endpoint leaking
      emails without SQLi. Hint #2: "ways to access data from
      a web application cross-domain". What are the
      cross-domain techniques in HTTP?
    pedagogical_intent: |
      Activate cross-domain reflex.

  N2:
    cost_pct: 10
    text_fr: |
      CORS (moderne, recommande) ou JSONP (ancien, deprecated).
      Hint OWASP officiel #3 : "this challenge uses an old way
      which is no longer recommended". Donc JSONP. Cherche un
      endpoint Juice Shop qui supporte un parametre
      `callback=...` ou similaire. Tente
      /rest/user/whoami?callback=test ou variants.
    text_en: |
      CORS (modern, recommended) or JSONP (legacy,
      deprecated). Official OWASP hint #3: "this challenge
      uses an old way which is no longer recommended". So
      JSONP. Look for a Juice Shop endpoint supporting a
      `callback=...` parameter or similar. Try
      /rest/user/whoami?callback=test or variants.
    pedagogical_intent: |
      Spell JSONP + first endpoint candidate.

  N3:
    cost_pct: 20
    text_fr: |
      L'endpoint candidat principal est /rest/user/whoami avec
      support JSONP. Si on appelle GET /rest/user/whoami?
      callback=foo, et que le serveur retourne foo({...user
      data...}); au lieu de {...data...}, c'est JSONP. Le
      payload exact a passer au callback peut leak les emails
      d'autres users si l'endpoint expose une liste.
    text_en: |
      Main candidate endpoint is /rest/user/whoami with JSONP
      support. If GET /rest/user/whoami?callback=foo returns
      foo({...user data...}); instead of {...data...}, it's
      JSONP. Exact payload passed to the callback may leak
      other users' emails if the endpoint exposes a list.
    pedagogical_intent: |
      Pin the JSONP detection workflow.

  N4:
    cost_pct: 35
    text_fr: |
      L'endpoint /rest/user/whoami renvoie normalement du JSON. Mais
      s'il recoit un parametre callback, il repond en JSONP
      (res.jsonp) : la reponse devient du JavaScript executable
      cross-origin, ce qui permet a une page tierce de lire ton email.
      C'est la fuite (routes/currentUser.ts).
    text_en: |
      The /rest/user/whoami endpoint normally returns JSON. But if it
      receives a callback parameter, it answers with JSONP (res.jsonp):
      the response becomes executable cross-origin JavaScript, which
      lets a third-party page read your email. That is the leak
      (routes/currentUser.ts).
    pedagogical_intent: |
      Reveal the JSONP callback leak on whoami.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : connecte,
      appelle whoami avec un callback :
        GET /rest/user/whoami?callback=leak   (jeton en cookie)
      La reponse est du JSONP (leak({...email...})) et le challenge est
      resolu (currentUser.ts:57). Exploitation reelle : une page
      attaquante inclut <script src=".../rest/user/whoami?callback=leak">
      et recupere l'email de la victime connectee.
      Defense : ne pas exposer de donnees via JSONP ; utiliser CORS
      avec une allowlist stricte et renvoyer uniquement du JSON.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): logged
      in, call whoami with a callback:
        GET /rest/user/whoami?callback=leak   (token as cookie)
      The response is JSONP (leak({...email...})) and the challenge
      solves (currentUser.ts:57). Real exploitation: an attacker page
      includes <script src=".../rest/user/whoami?callback=leak"> and
      reads the logged-in victim's email.
      Defense: do not expose data via JSONP; use CORS with a strict
      allowlist and return JSON only.
    pedagogical_intent: |
      Full verified solution: exact JSONP payload, defense.
