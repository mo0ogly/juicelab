challenge_key: "manipulateClockChallenge"
schema_version: "juicelab.hints.v2"

hints:
  N1:
    cost_pct: 5
    text_fr: |
      Hint OWASP officiel #1 : "identify past special
      event or holiday campaigns". Donc le challenge
      cible une campagne EXPIREE. Hint #3 : "does
      not require actual time traveling" - donc PAS
      de manipulation systeme, l'attaque est
      payload-based.
    text_en: |
      Official OWASP hint #1: "identify past special
      event or holiday campaigns". So challenge
      targets EXPIRED campaign. Hint #3: "does not
      require actual time traveling" - so NO system
      manipulation, attack is payload-based.
    pedagogical_intent: |
      Activate payload-based time-manipulation reflex.

  N2:
    cost_pct: 10
    text_fr: |
      Hint OWASP #2 : "Look for clues about the past
      campaign or holiday event somewhere in the
      application". Les codes de campagne sont
      visibles dans le bundle Angular (DevTools
      Sources, search "WMNSDY" pour Women's Day, ou
      autres holidays). Une fois identifie, il faut
      crafter un coupon redeem.
    text_en: |
      OWASP hint #2: "Look for clues about the past
      campaign or holiday event somewhere in the
      application". Campaign codes visible in
      Angular bundle (DevTools Sources, search
      "WMNSDY" for Women's Day, or other
      holidays). Once identified, must craft coupon
      redeem.
    pedagogical_intent: |
      Spell OSINT in-app for campaign codes.

  N3:
    cost_pct: 20
    text_fr: |
      Source serveur (routes/order.ts:182-198) : le
      serveur decode le couponData base64 :
      `couponData = Buffer.from(req.body.couponData,
      'base64').toString().split('-')`, puis prend
      `couponCode = couponData[0]` et `couponDate
      = Number(couponData[1])`. Si le couponDate
      matche `campaign.validOn` (timestamp ms), la
      campagne est valid. Donc l'attaquant doit
      crafter `<CODE>-<TIMESTAMP>` en base64.
    text_en: |
      Server source (routes/order.ts:182-198):
      server decodes couponData base64:
      `couponData = Buffer.from(req.body.coupon
      Data, 'base64').toString().split('-')`, then
      takes `couponCode = couponData[0]` and
      `couponDate = Number(couponData[1])`. If
      couponDate matches `campaign.validOn`
      (timestamp ms), campaign is valid. So
      attacker must craft `<CODE>-<TIMESTAMP>` in
      base64.
    pedagogical_intent: |
      Reveal exact decoding mechanic.

  N4:
    cost_pct: 35
    text_fr: |
      Construis couponData = "<CODE>-<validOn>" puis encode-le en
      base64. Pour WMNSDY2019, validOn vaut 1551999600000, d'ou
      couponData = "WMNSDY2019-1551999600000" qui s'encode en
      V01OU0RZMjAxOS0xNTUxOTk5NjAwMDAw. Ce champ ne se soumet pas via
      /api/Orders : il voyage dans le corps de la requete de
      validation du panier (routes/order.ts, calculateApplicableDiscount
      lit req.body.couponData). Le serveur compare couponDate a
      campaign.validOn et resout le challenge si validOn est dans le
      passe.
    text_en: |
      Build couponData = "<CODE>-<validOn>" then base64-encode it.
      For WMNSDY2019, validOn is 1551999600000, so couponData =
      "WMNSDY2019-1551999600000" which encodes to
      V01OU0RZMjAxOS0xNTUxOTk5NjAwMDAw. This field is not submitted via
      /api/Orders: it travels in the body of the basket checkout
      request (routes/order.ts, calculateApplicableDiscount reads
      req.body.couponData). The server compares couponDate to
      campaign.validOn and solves the challenge if validOn is in the
      past.
    pedagogical_intent: |
      Give the exact couponData, its encoding, and the right request.

  N5:
    cost_pct: 50
    text_fr: |
      Solution (verifiee en recette sur Juice Shop 19.2.1) : ajoute un
      article au panier, puis envoie la validation du panier avec le
      couponData force :
        POST /rest/basket/<ton bid>/checkout
        Authorization: Bearer <ton jeton>
        corps : {"couponData":"V01OU0RZMjAxOS0xNTUxOTk5NjAwMDAw"}
      Reponse 200, remise de 75% appliquee et challenge resolu. Le
      champ couponData court-circuite le refus du frontend, qui lui
      bloque les coupons expires. Les codes WMNSDY2019/2020/2021 sont
      tous expires ; ajuste validOn au code choisi.
      Defense : valider la fraicheur d'un coupon cote serveur a partir
      d'une source de confiance (date serveur), jamais a partir d'une
      date fournie par le client ; signer les coupons et verifier la
      signature avant d'appliquer la remise.
    text_en: |
      Solution (verified during testing on Juice Shop 19.2.1): add an
      item to the basket, then send the basket checkout with the
      forced couponData:
        POST /rest/basket/<your bid>/checkout
        Authorization: Bearer <your token>
        body: {"couponData":"V01OU0RZMjAxOS0xNTUxOTk5NjAwMDAw"}
      Response 200, 75% discount applied and challenge solved. The
      couponData field bypasses the frontend's refusal, which blocks
      expired coupons. Codes WMNSDY2019/2020/2021 are all expired;
      adjust validOn to the chosen code.
      Defense: validate a coupon's freshness server-side from a
      trusted source (server time), never from a client-supplied date;
      sign coupons and verify the signature before applying the
      discount.
    pedagogical_intent: |
      Full solution: verified checkout request, frontend-bypass note,
      defense.
